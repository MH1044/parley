# Licence gate for every Rust dependency, transitive ones included (CONTRIBUTING.md, ADR-0002).
# `cargo deny check licenses` runs in scripts/verify and in CI. It fails on anything outside the
# allow list, so GPL, AGPL, SSPL and BUSL code can never enter the build.

[graph]
# Every target the app is built for, so a dependency that only appears on one platform is still
# checked on every push.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "aarch64-linux-android",
]
all-features = false

[licenses]
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "Unlicense",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

# speech-dispatcher and its -sys crate (pulled in by tts for Linux only, where Parley never builds
# tts) write the deprecated SPDX id "LGPL-2.1"; the expression with the current id says the same
# thing, and the crates are taken under MIT either way.
[[licenses.clarify]]
crate = "speech-dispatcher"
expression = "LGPL-2.1-only OR MIT OR Apache-2.0"
license-files = []

[[licenses.clarify]]
crate = "speech-dispatcher-sys"
expression = "LGPL-2.1-only OR MIT OR Apache-2.0"
license-files = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
