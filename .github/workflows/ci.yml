# CI (docs/TESTING.md §8): the full check on Windows and Linux for every push to main and every
# pull request, and the launch smoke (e2e). Later modules add the whisper, android and macos jobs.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux prerequisites for Tauri and audio
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: verify
        shell: bash
        run: scripts/verify

  # The launch smoke (docs/TESTING.md §8): the debug app starts and shows its first screen, driven
  # through tauri-driver over the W3C WebDriver protocol (app/e2e/launch.spec.ts).
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Linux prerequisites for Tauri, the WebKit driver and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev \
            webkit2gtk-driver xvfb

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: front end
        run: |
          npm ci --prefix app
          npm --prefix app run build

      - name: debug build of the app
        run: cargo build -p parley-app

      - name: tauri-driver
        run: cargo install tauri-driver --locked

      # tauri-driver drives WebView2 through msedgedriver, whose major version must match the
      # installed WebView2 runtime. The runner's preinstalled Edge driver is used when it
      # matches; otherwise the matching one is downloaded. Its folder goes on the PATH, where
      # tauri-driver looks for it.
      - name: Edge WebDriver matching WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $webview = $null
          foreach ($key in $keys) {
            if (Test-Path $key) { $webview = (Get-ItemProperty -Path $key).pv; break }
          }
          if (-not $webview) { throw 'The WebView2 runtime was not found.' }
          Write-Host "WebView2 runtime $webview"
          $driverDir = $env:EDGEWEBDRIVER
          $preinstalled = $null
          if ($driverDir -and (Test-Path (Join-Path $driverDir 'msedgedriver.exe'))) {
            $preinstalled = & (Join-Path $driverDir 'msedgedriver.exe') --version
            Write-Host "Preinstalled: $preinstalled"
          }
          if (-not $preinstalled -or $preinstalled -notmatch " $($webview.Split('.')[0])\.") {
            $driverDir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
            New-Item -ItemType Directory -Force -Path $driverDir | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'edgedriver_win64.zip'
            Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$webview/edgedriver_win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $driverDir -Force
            & (Join-Path $driverDir 'msedgedriver.exe') --version
          }
          Add-Content -Path $env:GITHUB_PATH -Value $driverDir

      - name: launch smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm --prefix app run e2e

      - name: launch smoke (Windows)
        if: runner.os == 'Windows'
        run: npm --prefix app run e2e
