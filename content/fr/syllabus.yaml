      - id: fr.a1.u03.s03
        kind: function
        title: At the café
        cefr: A1
        can_do: I can order a drink, ask how much it costs and ask for the bill.
        requires: [fr.a1.u03.s02]
        grammar_note: >-
          Je voudrais (I would like) is the polite way to order: je voudrais un café.
          Vouloir in the present is je veux, tu veux, il veut, nous voulons, vous voulez,
          ils veulent; je veux can sound blunt. Prendre (to take, to have) is irregular: je
          prends, tu prends, il prend, nous prenons, vous prenez, ils prennent. Ask the
          price with combien coûte...? or c'est combien ? The answer is often ça fait plus
          the amount: ça fait vingt euros. To get the bill, ask for l'addition.
