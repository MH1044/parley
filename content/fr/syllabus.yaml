          - {id: 3, target: "Allons au cinéma !", en: ["Let's go to the cinema!", "Let's go to the movies!"]}
          - {id: 4, target: "Je vais en ville.", en: ["I am going into town.", "I am going downtown."]}
          - {id: 5, target: "Nous aimons aller au musée.", en: ["We like going to the museum.", "We like to go to the museum."]}
          - {id: 6, target: "Les enfants jouent dans la rue.", en: ["The children play in the street.", "The children are playing in the street."]}
          - {id: 7, target: "J'habite au centre-ville.", en: ["I live in the town centre.", "I live downtown."]}
          - {id: 8, target: "Je vais au marché.", en: ["I am going to the market.", "I go to the market."]}
      - id: fr.a1.u04.s02
        kind: grammar
        title: Where things are
        cefr: A1
        can_do: I can ask if there is a place nearby and say where it is.
        requires: [fr.a1.u04.s01]
        grammar_note: >-
          Il y a means there is and there are; the question is y a-t-il...? or il y a...?
          with a rising voice. Près de (near), loin de (far from), à côté de (next to) and
          en face de (opposite) end in de, which joins le and les: à côté du parc, en face
          de la gare. Devant (in front of), derrière (behind) and entre (between) take no
          de. Près d'ici means near here.
