          - {id: 2, target: "J'ai très peu de temps libre.", en: ["I have very little free time."]}
          - {id: 3, target: "Qu'est-ce que tu en penses ?", en: ["What do you think about it?", "What do you think of it?"]}
          - {id: 4, target: "Je pense que oui.", en: ["I think so."]}
          - {id: 5, target: "Je ne crois pas.", en: ["I don't think so."]}
          - {id: 6, target: "Je trouve ça génial.", en: ["I think it's great.", "I think this is great."]}
          - {id: 7, target: "Ce film est ennuyeux.", en: ["This film is boring.", "This movie is boring."]}
          - {id: 8, target: "C'était très amusant.", en: ["It was a lot of fun.", "It was great fun."]}
  - id: fr.a2.u07
    title: Comparing and describing
    cefr: A2
    skills:
      - id: fr.a2.u07.s01
        kind: vocab
        title: Character
        cefr: A2
        can_do: I can describe what people are like.
        requires: [fr.a2.u06.s04]
        grammar_note: >-
          Adjectives of character agree like other adjectives: il est content, elle est
          contente; méchant, méchante; patient, patiente. Paresseux becomes paresseuse.
          Adjectives that already end in -e do not change for a feminine noun: timide, calme,
          triste, honnête. Sympa (nice, friendly), short for sympathique, is very common in
          speech and only adds -s in the plural. Être sympa avec or poli avec quelqu'un is to
          be nice or polite to someone.
        lemmas:
          - {lemma: sympa, pos: adj, en: [nice, friendly], rank: 2276}
          - {lemma: timide, pos: adj, en: [shy], rank: 2216}
          - {lemma: calme, pos: adj, en: [calm, quiet], rank: 1289}
          - {lemma: triste, pos: adj, en: [sad], rank: 1171}
          - {lemma: content, pos: adj, en: [happy, pleased], rank: 615}
          - {lemma: méchant, pos: adj, en: [nasty, mean], rank: 2435}
          - {lemma: paresseux, pos: adj, en: [lazy], rank: 2476}
          - {lemma: patient, pos: adj, en: [patient], rank: 1300}
          - {lemma: honnête, pos: adj, en: [honest], rank: 1354}
          - {lemma: poli, pos: adj, en: [polite], rank: 2345}
        examples:
          - {id: 1, target: "Elle est sympa avec moi.", en: ["She is nice to me."]}
          - {id: 2, target: "Elle est un peu timide.", en: ["She is a little shy.", "She's a bit shy."]}
          - {id: 3, target: "Sois poli avec tes parents.", en: ["Be polite to your parents."]}
          - {id: 4, target: "Parfois je me sens triste.", en: ["Sometimes I feel sad.", "I sometimes feel sad."]}
          - {id: 5, target: "Tout le monde est content.", en: ["Everybody is happy.", "Everyone is pleased."]}
          - {id: 6, target: "Il est très méchant avec moi.", en: ["He is very mean to me.", "He is very nasty to me."]}
          - {id: 7, target: "Ne sois pas si paresseux !", en: ["Don't be so lazy!"]}
          - {id: 8, target: "Je suis une personne honnête.", en: ["I am an honest person."]}
      - id: fr.a2.u07.s02
        kind: grammar
        title: More than, as ... as
        cefr: A2
        can_do: I can compare two people or things.
        requires: [fr.a2.u07.s01]
        grammar_note: >-
          To compare, put plus (more), moins (less) or aussi (as) before an adjective and que
          after it: il est plus grand que moi, aussi grand que toi. Que becomes qu' before a
          vowel, and is followed by moi, toi, lui, elle, nous, vous, eux or elles. Bon has its
          own form, meilleur (better): le livre était meilleur que le film; bien becomes
          mieux, and mauvais is often pire (worse). With a verb, use plus, moins or autant (as
          much): mangez autant que vous voulez. Le même ... que is the same ... as, and comme
          is like.
        lemmas:
          - {lemma: plus, pos: adv, en: [more], rank: 62}
          - {lemma: meilleur, pos: adj, en: [better, best], rank: 369}
          - {lemma: pire, pos: adj, en: [worse, worst], rank: 1250}
          - {lemma: autant, pos: adv, en: [as much, as many], rank: 733}
          - {lemma: comme, pos: conj, en: [like, as], rank: 150}
          - {lemma: même, pos: adj, en: [same], rank: 195}
          - {lemma: différent, pos: adj, en: [different], rank: 801}
        examples:
          - {id: 1, target: "Il est plus grand que moi.", en: ["He is taller than me.", "He's taller than I am."]}
          - {id: 2, target: "Elle est plus jeune que moi.", en: ["She is younger than me.", "She's younger than I am."]}
          - {id: 3, target: "Paul est aussi grand que Marie, mais plus jeune.", en: ["Paul is as tall as Marie, but younger."]}
          - {id: 4, target: "Le livre était meilleur que le film.", en: ["The book was better than the film.", "The book was better than the movie."]}
          - {id: 5, target: "C'est encore pire !", en: ["It's even worse!", "This is even worse!"]}
          - {id: 6, target: "Mangez autant que vous voulez.", en: ["Eat as much as you like.", "Eat as much as you want."]}
          - {id: 7, target: "Nous avons le même âge.", en: ["We are the same age."]}
          - {id: 8, target: "Faites comme chez vous.", en: ["Make yourself at home.", "Make yourselves at home."]}
      - id: fr.a2.u07.s03
        kind: grammar
        title: The best and the most
        cefr: A2
        can_do: I can say which is the best, the fastest or the most important.
        requires: [fr.a2.u07.s02]
        grammar_note: >-
          The superlative is le, la or les with plus or moins: le plus rapide, la moins chère.
          An adjective that comes after its noun stays there and the article is repeated: le
          train le plus rapide. One that comes before its noun stays before it: la plus longue
          rue. In or of after a superlative is de: le plus célèbre de Paris, le plus rapide du
          monde. Le meilleur is the best and le pire the worst. Facile and difficile take à
          before an infinitive: la langue la plus facile à apprendre.
        lemmas:
          - {lemma: rapide, pos: adj, en: [fast, quick], rank: 1355}
          - {lemma: lent, pos: adj, en: [slow], rank: 2407}
          - {lemma: long, pos: adj, en: [long], rank: 538}
          - {lemma: court, pos: adj, en: [short], rank: 933}
          - {lemma: facile, pos: adj, en: [easy], rank: 589}
          - {lemma: difficile, pos: adj, en: [difficult, hard], rank: 367}
          - {lemma: important, pos: adj, en: [important], rank: 540}
          - {lemma: célèbre, pos: adj, en: [famous], rank: 1474}
        examples:
          - {id: 1, target: "C'est le train le plus rapide du monde.", en: ["It's the fastest train in the world.", "That is the fastest train in the world."]}
          - {id: 2, target: "C'est la plus longue rue de la ville.", en: ["This is the longest street in town.", "This is the longest street in the city."]}
          - {id: 3, target: "Février est le mois le plus court.", en: ["February is the shortest month."]}
          - {id: 4, target: "Quelle est la langue la plus facile à apprendre ?", en: ["What is the easiest language to learn?", "Which language is the easiest to learn?"]}
          - {id: 5, target: "Le premier pas est le plus difficile.", en: ["The first step is the hardest.", "The first step is the most difficult."]}
          - {id: 6, target: "C'est la chose la plus importante.", en: ["That's the most important thing.", "It is the most important thing."]}
          - {id: 7, target: "C'est le musée le plus célèbre de Paris.", en: ["It's the most famous museum in Paris."]}
          - {id: 8, target: "Le bus est plus lent que le train.", en: ["The bus is slower than the train."]}
      - id: fr.a2.u07.s04
        kind: function
        title: Saying more about it
        cefr: A2
        can_do: I can describe people, places and things in more detail with who and which.
        requires: [fr.a2.u07.s03]
        grammar_note: >-
          Qui and que join two sentences about the same person or thing. Qui (who, which,
          that) is the subject of the verb that follows it: je connais quelqu'un qui peut
          t'aider. Que (who, whom, which, that) is the object, so a new subject follows it:
          l'endroit que j'aime, le roman qu'il a écrit. Que becomes qu' before a vowel, but
          qui never changes. English often leaves that out; French never drops qui or que. Les
          gens (people) is always plural.
        lemmas:
          - {lemma: chose, pos: noun, gender: f, en: [thing], rank: 106}
          - {lemma: "quelqu'un", pos: pron, en: [someone, somebody, anyone], rank: 310}
          - {lemma: gens, pos: noun, gender: m, article: les, en: [people], rank: 321}
          - {lemma: endroit, pos: noun, gender: m, en: [place, spot], rank: 683}
          - {lemma: histoire, pos: noun, gender: f, en: [story, history], rank: 450}
          - {lemma: roman, pos: noun, gender: m, en: [novel], rank: 1108}
          - {lemma: acteur, pos: noun, gender: m, en: [actor], rank: 2111}
        examples:
          - {id: 1, target: "Je connais quelqu'un qui peut t'aider.", en: ["I know someone who can help you.", "I know somebody who can help you."]}
          - {id: 2, target: "Les gens qui vivent ici sont nos amis.", en: ["The people who live here are our friends."]}
          - {id: 3, target: "Il y a un endroit que j'aimerais te montrer.", en: ["There's a place I'd like to show you.", "There is a place that I would like to show you."]}
          - {id: 4, target: "Tu trouveras quelque chose qui t'intéresse.", en: ["You will find something that interests you.", "You'll find something that interests you."]}
          - {id: 5, target: "C'est le roman qu'il a écrit.", en: ["This is the novel he wrote.", "That's the novel that he wrote."]}
          - {id: 6, target: "Tu me rappelles quelqu'un que je connaissais.", en: ["You remind me of someone I used to know.", "You remind me of somebody I used to know."]}
          - {id: 7, target: "C'est une histoire que tout le monde connaît.", en: ["It's a story that everyone knows.", "It is a story everybody knows."]}
          - {id: 8, target: "C'est un acteur que j'aime beaucoup.", en: ["He is an actor I like a lot.", "He's an actor that I really like."]}
  - id: fr.a2.u08
    title: Experiences
    cefr: A2
    skills:
      - id: fr.a2.u08.s01
        kind: grammar
        title: Have you ever ...?
        cefr: A2
        can_do: I can ask and say what I have done, or never done, in my life.
        requires: [fr.a2.u07.s04]
        grammar_note: >-
          To ask about experiences, use the passé composé with déjà (ever, already): êtes-vous
          déjà allé à l'étranger ? (have you ever been abroad?). Answer with ne ... jamais
          (never) around avoir or être: je ne suis jamais monté à cheval. Monter à cheval is
          to ride a horse and prendre le bateau to take the boat. Monter takes être when it
          means to go up or get on: je suis monté. Goûter is to taste or try a food. Combien
          de fois ? means how many times?
        lemmas:
          - {lemma: "à l'étranger", pos: expr, en: [abroad], rank: null}
          - {lemma: goûter, pos: verb, en: [to taste, to try], rank: 3015}
          - {lemma: monter, pos: verb, en: [to go up, to get on, to ride], rank: 143}
          - {lemma: cheval, pos: noun, gender: m, en: [horse], rank: 926}
          - {lemma: bateau, pos: noun, gender: m, en: [boat, ship], rank: 1039}
          - {lemma: île, pos: noun, gender: f, en: [island], rank: 1750}
          - {lemma: rêver, pos: verb, en: [to dream], rank: 583}
        examples:
          - {id: 1, target: "Êtes-vous déjà allé à l'étranger ?", en: ["Have you ever been abroad?"]}
          - {id: 2, target: "Je n'ai jamais été à l'étranger.", en: ["I have never been abroad.", "I've never been abroad."]}
          - {id: 3, target: "Je ne suis jamais monté à cheval.", en: ["I have never ridden a horse.", "I've never ridden a horse."]}
          - {id: 4, target: "Je suis monté à cheval pour la première fois hier.", en: ["I rode a horse for the first time yesterday."]}
          - {id: 5, target: "Combien de fois as-tu voyagé à l'étranger ?", en: ["How many times have you travelled abroad?", "How many times have you traveled abroad?"]}
          - {id: 6, target: "As-tu déjà goûté ce fromage ?", en: ["Have you ever tasted this cheese?", "Have you tried this cheese yet?"]}
          - {id: 7, target: "Nous avons pris le bateau pour aller sur l'île.", en: ["We took the boat to go to the island.", "We took the boat to the island."]}
          - {id: 8, target: "J'ai toujours rêvé de voir la mer.", en: ["I have always dreamed of seeing the sea.", "I've always dreamt of seeing the sea."]}
      - id: fr.a2.u08.s02
        kind: grammar
        title: What happened
        cefr: A2
        can_do: I can tell a short story about something that happened, with the background and the events.
        requires: [fr.a2.u08.s01]
        grammar_note: >-
          In a story, the imparfait sets the scene and says what was going on, and the passé
          composé tells the events: pendant que j'attendais le bus, j'ai vu un accident.
          Pendant que (while) and lorsque or quand (when) link the two. Tout à coup (suddenly)
          usually brings in an event in the passé composé. Tomber, entrer and descendre take
          être: il est tombé de cheval, je suis descendu du train (I got off the train).
        lemmas:
          - {lemma: tout à coup, pos: expr, en: [suddenly, all of a sudden], rank: null}
          - {lemma: moment, pos: noun, gender: m, en: [moment, time], rank: 400}
          - {lemma: accident, pos: noun, gender: m, en: [accident], rank: 637}
          - {lemma: tomber, pos: verb, en: [to fall], rank: 124}
          - {lemma: entrer, pos: verb, en: [to come in, to go in, to enter], rank: 312}
          - {lemma: descendre, pos: verb, en: [to go down, to get off], rank: 145}
          - {lemma: lorsque, pos: conj, en: [when], rank: 472}
          - {lemma: pendant que, pos: expr, en: [while], rank: null}
        examples:
          - {id: 1, target: "Pendant que j'attendais le bus, j'ai vu un accident.", en: ["While I was waiting for the bus, I saw an accident."]}
          - {id: 2, target: "Elle a appelé pendant que j'étais sorti.", en: ["She called while I was out."]}
          - {id: 3, target: "Il était occupé lorsque je l'ai appelé.", en: ["He was busy when I called him.", "He was busy when I phoned him."]}
          - {id: 4, target: "Je l'ai rencontré lorsque j'étais à Paris.", en: ["I met him when I was in Paris.", "I met him while I was in Paris."]}
          - {id: 5, target: "Il est tombé de cheval.", en: ["He fell off his horse.", "He fell off the horse."]}
          - {id: 6, target: "Je suis descendu du train.", en: ["I got off the train."]}
          - {id: 7, target: "Tout à coup, il a commencé à pleuvoir.", en: ["Suddenly it started to rain.", "All of a sudden it began to rain."]}
          - {id: 8, target: "Quand je suis entré, tout le monde dormait.", en: ["When I came in, everyone was asleep.", "When I went in, everybody was sleeping."]}
      - id: fr.a2.u08.s03
        kind: grammar
        title: Nothing, nobody, no longer
        cefr: A2
        can_do: I can say that I no longer do something, or that there is nothing or nobody.
        requires: [fr.a2.u08.s02]
        grammar_note: >-
          These negatives work like ne ... pas, with ne before the verb: ne ... plus (no
          longer, not any more), ne ... rien (nothing), ne ... personne (nobody), ne ...
          jamais (never), ne ... aucun (no, not any) and ne ... nulle part (nowhere). In the
          passé composé, rien, plus and jamais come before the participle (je n'ai rien dit),
          but personne and nulle part after it (je n'ai vu personne). Rien and personne can
          also be the subject: personne ne sait. Aucun agrees with its noun: aucune idée.
