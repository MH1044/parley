          - {lemma: souvent, pos: adv, en: [often], rank: 398}
          - {lemma: parfois, pos: adv, en: [sometimes], rank: 883}
          - {lemma: jamais, pos: adv, en: [never, ever], rank: 123}
          - {lemma: tout, pos: det, en: [all, every], rank: 44}
          - {lemma: fois, pos: noun, gender: f, en: [time, occasion], rank: 262}
          - {lemma: rentrer, pos: verb, en: [to go home, to come back], rank: 133}
        examples:
          - {id: 1, target: "Je vais souvent au cinéma.", en: ["I often go to the cinema.", "I often go to the movies."]}
          - {id: 2, target: "Je me lève toujours tôt.", en: ["I always get up early."]}
          - {id: 3, target: "Je ne mange jamais de viande.", en: ["I never eat meat."]}
          - {id: 4, target: "Je regarde parfois la télévision.", en: ["I sometimes watch television.", "I sometimes watch TV."]}
          - {id: 5, target: "Je viens tous les jours.", en: ["I come every day."]}
          - {id: 6, target: "À quelle heure rentres-tu ?", en: ["What time are you coming home?", "What time do you get back?"]}
          - {id: 7, target: "C'est la première fois.", en: ["It is the first time.", "This is the first time."]}
          - {id: 8, target: "Ils vont travailler tous les jours.", en: ["They go to work every day."]}
  - id: fr.a1.u08
    title: Travel and hotel
    cefr: A1
    skills:
      - id: fr.a1.u08.s01
        kind: vocab
        title: Travel
        cefr: A1
        can_do: I can talk about trips, tickets and holidays.
        requires: [fr.a1.u07.s04]
        grammar_note: >-
          Les vacances (the holidays) is always plural in this sense: je suis en vacances
          (I am on holiday). Voyager (to travel) keeps an e before -ons: nous voyageons.
          Travel by plane is en avion, like en train. Most country names take le or la, and
          to or in a country is en for a feminine one and au for a masculine one: en
          France, au Canada. Faites un bon voyage ! wishes someone a good trip.
