  - id: fr.a1.u06
    title: Home and family
    cefr: A1
    skills:
      - id: fr.a1.u06.s01
        kind: vocab
        title: Family
        cefr: A1
        can_do: I can talk about the people in my family and say whose they are.
        requires: [fr.a1.u05.s04]
        grammar_note: >-
          My, your and his or her agree with the noun that follows, not with the owner:
          mon frère, ma sœur, mes parents; ton, ta, tes; son, sa, ses. So sa mère can
          mean his mother or her mother. Our is notre and nos, your (vous) is votre and
          vos, their is leur and leurs: notre fils, nos enfants, leur fils. Before a vowel,
          use mon, ton or son even for a feminine noun: mon amie.
