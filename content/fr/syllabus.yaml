          - {id: 6, target: "Je suis très fier de toi.", en: ["I'm very proud of you.", "I am very proud of you."]}
          - {id: 7, target: "J'étais un peu déçu.", en: ["I was a little disappointed.", "I was a bit disappointed."]}
          - {id: 8, target: "Ça rappelle des souvenirs.", en: ["It brings back memories.", "That brings back memories."]}
