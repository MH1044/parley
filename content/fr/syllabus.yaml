          - {id: 6, target: "Ça me rappelle mon enfance.", en: ["It reminds me of my childhood.", "That reminds me of my childhood."]}
          - {id: 7, target: "Le village avait une petite école.", en: ["The village had a small school."]}
          - {id: 8, target: "Quand j'étais petite, j'habitais à la campagne.", en: ["When I was little, I lived in the countryside.", "When I was a child, I lived in the country."]}
  - id: fr.a2.u06
    title: Free time
    cefr: A2
    skills:
      - id: fr.a2.u06.s01
        kind: vocab
        title: Hobbies
        cefr: A2
        can_do: I can say what I do in my free time and which instrument or sport I play.
        requires: [fr.a2.u05.s04]
        grammar_note: >-
          Jouer à is to play a sport or a game: jouer au tennis. Jouer de is to play an
          instrument: je joue du piano, elle joue de la guitare. Faire de is used for many
          activities: faire du sport, faire du vélo, faire de la natation. After aimer, adorer
          and préférer, an activity is an infinitive: j'aime cuisiner, aimez-vous danser ?
          Courir (to run) is irregular: je cours, nous courons, j'ai couru.
        lemmas:
          - {lemma: nager, pos: verb, en: [to swim], rank: 568}
          - {lemma: danser, pos: verb, en: [to dance], rank: 869}
          - {lemma: cuisiner, pos: verb, en: [to cook], rank: 641}
          - {lemma: courir, pos: verb, en: [to run], rank: 307}
          - {lemma: jeu, pos: noun, gender: m, en: [game], rank: 800}
          - {lemma: chanson, pos: noun, gender: f, en: [song], rank: 777}
          - {lemma: guitare, pos: noun, gender: f, en: [guitar], rank: 1703}
          - {lemma: piano, pos: noun, gender: m, en: [piano], rank: 1483}
          - {lemma: tennis, pos: noun, gender: m, en: [tennis], rank: 1116}
          - {lemma: concert, pos: noun, gender: m, en: [concert], rank: 1370}
        examples:
          - {id: 1, target: "Il nage bien.", en: ["He swims well.", "He is a good swimmer."]}
          - {id: 2, target: "Aimez-vous danser ?", en: ["Do you like dancing?", "Do you like to dance?"]}
          - {id: 3, target: "J'aime cuisiner.", en: ["I like cooking.", "I like to cook."]}
          - {id: 4, target: "Je vais courir.", en: ["I'm going for a run.", "I am going to run."]}
          - {id: 5, target: "Je joue du piano.", en: ["I play the piano."]}
          - {id: 6, target: "Elle joue de la guitare.", en: ["She plays the guitar."]}
          - {id: 7, target: "J'aime jouer au tennis.", en: ["I like playing tennis.", "I like to play tennis."]}
          - {id: 8, target: "Je vais au concert.", en: ["I am going to the concert."]}
      - id: fr.a2.u06.s02
        kind: grammar
        title: There and some of it
        cefr: A2
        can_do: I can use y for places and en for amounts instead of repeating a word.
        requires: [fr.a2.u06.s01]
        grammar_note: >-
          Y replaces à or en and a place, and means there: tu vas à la piscine ? oui, j'y
          vais. En replaces de and a noun, and often means some, of it or of them; an amount
          stays at the end: des pommes ? j'en voudrais un kilo. Both go before the verb, or
          before avoir in the passé composé: j'y suis allé, j'en ai mangé. J'en ai assez means
          I've had enough. Quelques (a few), plusieurs (several), assez de (enough) and peu de
          (little, few) give an amount.
        lemmas:
          - {lemma: quelques, pos: adj, en: [a few, some], rank: 384}
          - {lemma: plusieurs, pos: adj, en: [several], rank: 835}
          - {lemma: assez, pos: adv, en: [enough, quite], rank: 328}
          - {lemma: peu, pos: adv, en: [little, not much], rank: 141}
          - {lemma: piscine, pos: noun, gender: f, en: [swimming pool, pool], rank: 2399}
          - {lemma: montagne, pos: noun, gender: f, en: [mountain, mountains], rank: 1080}
          - {lemma: kilo, pos: noun, gender: m, en: [kilo], rank: 3484}
        examples:
          - {id: 1, target: "J'y suis allé plusieurs fois.", en: ["I have been there several times.", "I went there several times."]}
          - {id: 2, target: "Je vais y rester quelques jours.", en: ["I am going to stay there for a few days."]}
          - {id: 3, target: "J'en ai assez !", en: ["I've had enough!", "I'm fed up!"]}
          - {id: 4, target: "En avez-vous assez ?", en: ["Do you have enough?"]}
          - {id: 5, target: "Il en reste encore un peu.", en: ["There is still a little left."]}
          - {id: 6, target: "La montagne ? J'y vais chaque hiver.", en: ["The mountains? I go there every winter."]}
          - {id: 7, target: "Des pommes ? J'en voudrais un kilo.", en: ["Apples? I would like a kilo.", "Apples? I'd like a kilo of them."]}
          - {id: 8, target: "Tu vas à la piscine ? Oui, j'y vais.", en: ["Are you going to the pool? Yes, I am.", "Are you going to the swimming pool? Yes, I'm going there."]}
      - id: fr.a2.u06.s03
        kind: grammar
        title: Going out
        cefr: A2
        can_do: I can say how I enjoy myself and suggest going out.
        requires: [fr.a2.u06.s02]
        grammar_note: >-
          Many verbs about free time are pronominal: s'amuser (to have fun), s'ennuyer (to be
          bored), se promener (to go for a walk) and se dépêcher (to hurry). In the imperative
          the pronoun follows and te becomes toi: amuse-toi bien !, dépêche-toi ! Sortir (to
          go out) goes like partir: je sors, nous sortons, and takes être in the passé
          composé: elle est sortie. On sort ce soir ? is a casual way to suggest going out.
          Marcher is to walk, and also to work, of a machine or a plan.
        lemmas:
          - {lemma: amuser, pos: verb, en: [to amuse, to have fun], rank: 713}
          - {lemma: ennuyer, pos: verb, en: [to bore, to be bored], rank: 1201}
          - {lemma: promener, pos: verb, en: [to walk, to go for a walk], rank: 1680}
          - {lemma: promenade, pos: noun, gender: f, en: [walk, stroll], rank: 2165}
          - {lemma: sortir, pos: verb, en: [to go out, to come out], rank: 107}
          - {lemma: dépêcher, pos: verb, en: [to hurry], rank: 1304}
          - {lemma: marcher, pos: verb, en: [to walk, to work], rank: 348}
        examples:
          - {id: 1, target: "Amusez-vous bien !", en: ["Have fun!", "Enjoy yourselves!"]}
          - {id: 2, target: "Je m'ennuie.", en: ["I am bored.", "I'm getting bored."]}
          - {id: 3, target: "On sort ce soir ?", en: ["Shall we go out tonight?", "Are we going out tonight?"]}
          - {id: 4, target: "Allons nous promener.", en: ["Let's go for a walk."]}
          - {id: 5, target: "J'aime faire des promenades.", en: ["I like going for walks.", "I like taking walks."]}
          - {id: 6, target: "Je vais sortir.", en: ["I am going out."]}
          - {id: 7, target: "Allez, dépêche-toi.", en: ["Come on, hurry up."]}
          - {id: 8, target: "Je préfère marcher.", en: ["I prefer to walk.", "I prefer walking."]}
      - id: fr.a2.u06.s04
        kind: function
        title: What I think of it
        cefr: A2
        can_do: I can say what I think of an activity and ask someone's opinion.
        requires: [fr.a2.u06.s03]
        grammar_note: >-
          To ask someone's opinion, say qu'est-ce que tu en penses ? or tu trouves ça drôle ?
          Give yours with je pense que or je crois que (I think that), je trouve ça génial (I
          think it's great), or just je pense que oui (I think so) and je ne crois pas (I
          don't think so). C'était (it was) looks back on something: c'était très amusant.
          Ennuyeux (boring) becomes ennuyeuse with a feminine noun. Pendant mon temps libre
          means in my free time.
        lemmas:
