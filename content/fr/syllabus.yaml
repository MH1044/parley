          - {lemma: billet, pos: noun, gender: m, en: [ticket], rank: 1486}
          - {lemma: valise, pos: noun, gender: f, en: [suitcase], rank: 1689}
          - {lemma: aéroport, pos: noun, gender: m, en: [airport], rank: 1497}
          - {lemma: passeport, pos: noun, gender: m, en: [passport], rank: 2331}
          - {lemma: vacances, pos: noun, gender: f, en: [holidays, vacation], rank: 941}
