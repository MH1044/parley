      - id: fr.a1.u08.s03
        kind: function
        title: At the hotel
        cefr: A1
        can_do: I can check in at a hotel, ask for a room and understand where it is.
        requires: [fr.a1.u08.s02]
        grammar_note: >-
          To check in, say j'ai une réservation and give your name: au nom de Paul. Ask
          for a room with je voudrais une chambre pour deux personnes, and say how long
