          - {lemma: entre, pos: prep, en: [between], rank: 475}
          - {lemma: à côté de, pos: expr, en: [next to, beside], rank: null}
          - {lemma: en face de, pos: expr, en: [opposite, across from], rank: null}
          - {lemma: là, pos: adv, en: [there, here], rank: 172}
        examples:
