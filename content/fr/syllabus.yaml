          - {lemma: tôt, pos: adv, en: [early], rank: 431}
          - {lemma: tard, pos: adv, en: [late], rank: 485}
        examples:
          - {id: 1, target: "Je me réveille à sept heures.", en: ["I wake up at seven o'clock.", "I wake up at seven."]}
          - {id: 2, target: "Je me lève tôt le matin.", en: ["I get up early in the morning."]}
          - {id: 3, target: "À quelle heure tu te lèves ?", en: ["What time do you get up?", "What time are you getting up?"]}
          - {id: 4, target: "Je m'habille.", en: ["I am getting dressed.", "I get dressed."]}
          - {id: 5, target: "Je prends une douche.", en: ["I am having a shower.", "I am taking a shower."]}
          - {id: 6, target: "Le bébé dort.", en: ["The baby is sleeping.", "The baby is asleep."]}
          - {id: 7, target: "Il est trop tard.", en: ["It is too late."]}
          - {id: 8, target: "Je me couche à onze heures.", en: ["I go to bed at eleven o'clock.", "I go to bed at eleven."]}
      - id: fr.a1.u07.s04
        kind: function
        title: How often
        cefr: A1
        can_do: I can say how often I do things.
        requires: [fr.a1.u07.s03]
        grammar_note: >-
          Words for how often usually come straight after the verb: je vais souvent au
          cinéma, je me lève toujours tôt. Jamais (never) works like pas, with ne before
          the verb: je ne mange jamais de viande. Tous les jours means every day, and tout
          agrees with its noun: tous les lundis, toutes les semaines. Une fois is once,
          deux fois twice, and the first time is la première fois. Toujours also means
          still.
        lemmas:
