          - {id: 2, target: "Il est une heure.", en: ["It is one o'clock."]}
          - {id: 3, target: "Il est huit heures et quart.", en: ["It is a quarter past eight.", "It is eight fifteen."]}
          - {id: 4, target: "Il est trois heures et demie.", en: ["It is half past three.", "It is three thirty."]}
          - {id: 5, target: "Le film commence à huit heures.", en: ["The film starts at eight o'clock.", "The movie starts at eight."]}
          - {id: 6, target: "Je travaille le matin.", en: ["I work in the morning.", "I work in the mornings."]}
          - {id: 7, target: "Que faites-vous cet après-midi ?", en: ["What are you doing this afternoon?"]}
          - {id: 8, target: "Je dîne après le travail.", en: ["I have dinner after work.", "I eat dinner after work."]}
      - id: fr.a1.u07.s03
        kind: grammar
        title: Daily routine
        cefr: A1
        can_do: I can describe my day from getting up to going to bed.
        requires: [fr.a1.u07.s02]
        grammar_note: >-
          Many routine verbs are reflexive: a small pronoun that matches the subject goes
          before the verb: je me lève, tu te lèves, il se lève, nous nous levons, vous vous
          levez, ils se lèvent. Me, te and se become m', t' and s' before a vowel: je
          m'habille. Se lever is to get up, se réveiller to wake up, se coucher to go to
          bed, se laver to wash and s'habiller to get dressed. Without the pronoun the
          verb acts on someone else: elle couche les enfants.
