  - id: fr.a1.u04
    title: Around town
    cefr: A1
    skills:
      - id: fr.a1.u04.s01
        kind: vocab
        title: Places in town
        cefr: A1
        can_do: I can name places in town and say where I am going.
        requires: [fr.a1.u03.s04]
        grammar_note: >-
          Aller (to go) is irregular: je vais, tu vas, il va, nous allons, vous allez, ils
          vont. To or at a place is à, and à le becomes au, à les becomes aux: au cinéma,
          au marché, but à la banque and à l'hôpital. En ville means in town or into town.
          The nous form without its pronoun means let's: allons au cinéma ! (let's go to
          the cinema!).
