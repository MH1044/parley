          - {id: 3, target: "Ce n'est pas loin.", en: ["It is not far."]}
          - {id: 4, target: "Y a-t-il un cinéma près d'ici ?", en: ["Is there a cinema near here?", "Is there a cinema nearby?", "Is there a movie theater near here?"]}
          - {id: 5, target: "Il habite à côté de moi.", en: ["He lives next to me.", "He lives next door to me."]}
          - {id: 6, target: "Regarde derrière toi.", en: ["Look behind you."]}
          - {id: 7, target: "Nous sommes maintenant devant le musée.", en: ["We are now in front of the museum.", "We're in front of the museum now."]}
          - {id: 8, target: "Il y a un marché devant la gare.", en: ["There is a market in front of the station."]}
      - id: fr.a1.u04.s03
        kind: function
        title: Asking the way
        cefr: A1
