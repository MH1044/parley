          - {lemma: banque, pos: noun, gender: f, en: [bank], rank: 1321}
          - {lemma: musée, pos: noun, gender: m, en: [museum], rank: 1731}
          - {lemma: parc, pos: noun, gender: m, en: [park], rank: 989}
          - {lemma: hôpital, pos: noun, gender: m, en: [hospital], rank: 993}
          - {lemma: cinéma, pos: noun, gender: m, en: [cinema, movie theater], rank: 1517}
