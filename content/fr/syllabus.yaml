          - {id: 8, target: "Mai vient après avril.", en: ["May comes after April."]}
      - id: fr.a2.u05.s04
        kind: grammar
        title: When I was a child
        cefr: A2
        can_do: I can describe what things were like and what I used to do.
        requires: [fr.a2.u05.s03]
        grammar_note: >-
          The imparfait describes how things were and what used to happen. Take the nous form
