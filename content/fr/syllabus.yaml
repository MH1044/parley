      - id: fr.a2.u08.s04
        kind: function
        title: How it felt
        cefr: A2
        can_do: I can say how I felt about an experience and react to someone else's news.
        requires: [fr.a2.u08.s03]
        grammar_note: >-
          To react, use c'est or c'était with an adjective: c'était incroyable, c'est génial.
          Adjectives of feeling agree: je suis surprise, il était déçu, elle est fière de toi.
          Avoir peur is to be afraid and avoir de la chance to be lucky; bonne chance ! means
          good luck. Un souvenir is a memory, and also a souvenir: ça rappelle des souvenirs
          (it brings back memories). Vraiment (really) adds weight: c'était vraiment génial.
        lemmas:
          - {lemma: chance, pos: noun, gender: f, en: [luck, chance], rank: 586}
          - {lemma: peur, pos: noun, gender: f, en: [fear], rank: 358}
          - {lemma: surpris, pos: adj, en: [surprised], rank: 647}
          - {lemma: incroyable, pos: adj, en: [incredible, amazing], rank: 2518}
          - {lemma: fier, pos: adj, en: [proud], rank: 670}
          - {lemma: déçu, pos: adj, en: [disappointed], rank: 1295}
          - {lemma: vraiment, pos: adv, en: [really, truly], rank: 152}
          - {lemma: souvenir, pos: noun, gender: m, en: [memory, souvenir], rank: 1364}
        examples:
          - {id: 1, target: "Tu as de la chance.", en: ["You're lucky.", "You are lucky."]}
          - {id: 2, target: "J'avais peur.", en: ["I was afraid.", "I was scared."]}
          - {id: 3, target: "Êtes-vous surpris ?", en: ["Are you surprised?"]}
