      - id: fr.a2.u03.s03
        kind: grammar
        title: Skills and experience
        cefr: A2
        can_do: I can say what I know how to do, what I have learnt and what experience I have.
        requires: [fr.a2.u03.s02]
        grammar_note: >-
          French has two verbs for to know. Savoir is to know a fact or how to do something,
          with an infinitive: je sais nager (I can swim), savez-vous conduire ? Connaître is
          to know a person, a place or a language well: je ne connais personne ici. Apprendre
          (to learn) goes like prendre: j'apprends, nous apprenons, j'ai appris; apprendre
          quelque chose à quelqu'un is to teach it. Expérience takes du, de la or de l' like
          other amounts: avez-vous de l'expérience ? Capable de is able to.
