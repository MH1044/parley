          - {lemma: mer, pos: noun, gender: f, en: [sea], rank: 1026}
          - {lemma: plage, pos: noun, gender: f, en: [beach], rank: 1133}
        examples:
          - {id: 1, target: "Faites un bon voyage !", en: ["Have a good trip!", "Have a nice trip!"]}
          - {id: 2, target: "Je suis en vacances.", en: ["I am on holiday.", "I am on vacation."]}
          - {id: 3, target: "Combien coûte le billet ?", en: ["How much is the ticket?", "How much does the ticket cost?"]}
          - {id: 4, target: "Où est ma valise ?", en: ["Where is my suitcase?"]}
          - {id: 5, target: "Je vais à l'aéroport.", en: ["I am going to the airport."]}
          - {id: 6, target: "J'aime voyager en train.", en: ["I like travelling by train.", "I like to travel by train."]}
          - {id: 7, target: "Allons à la plage.", en: ["Let's go to the beach."]}
          - {id: 8, target: "J'aime ton pays.", en: ["I like your country.", "I love your country."]}
      - id: fr.a1.u08.s02
        kind: grammar
        title: Plans
        cefr: A1
        can_do: I can say what I am going to do and when I leave or arrive.
        requires: [fr.a1.u08.s01]
        grammar_note: >-
          For plans, use aller in the present plus an infinitive: je vais partir demain (I
          am going to leave tomorrow), que vas-tu faire ce soir ? The present also works
          with a time word: je pars la semaine prochaine. Partir (to leave) is irregular:
          je pars, tu pars, il part, nous partons, vous partez, ils partent. Prochain
          (next) follows semaine, mois and an, but comes before most other nouns: le
          prochain train. Quand means when.
