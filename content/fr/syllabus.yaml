          - {id: 2, target: "Il porte un chapeau.", en: ["He is wearing a hat."]}
          - {id: 3, target: "Où sont mes chaussures ?", en: ["Where are my shoes?"]}
          - {id: 4, target: "J'adore ta robe.", en: ["I love your dress."]}
          - {id: 5, target: "Ce manteau est chaud.", en: ["This coat is warm."]}
          - {id: 6, target: "Je veux ce sac.", en: ["I want this bag.", "I want that bag."]}
          - {id: 7, target: "J'aime tes chaussures.", en: ["I like your shoes.", "I love your shoes."]}
          - {id: 8, target: "Je n'aime pas cette veste.", en: ["I do not like this jacket."]}
      - id: fr.a1.u05.s02
        kind: grammar
        title: Colours and sizes
        cefr: A1
        can_do: I can describe things by their colour and size.
        requires: [fr.a1.u05.s01]
        grammar_note: >-
          Adjectives agree with their noun: add -e for a feminine noun and -s for a
          plural: un sac noir, une robe noire, des chaussures noires. An adjective that
          already ends in -e, like rouge or jaune, does not change for a feminine noun.
          Blanc becomes blanche. Colours come after the noun: une voiture rouge. A few
          short, common adjectives such as grand and petit come before it: un petit
          chien. Grand means tall as well as big. Préféré (favourite) agrees too: ma
          couleur préférée.
