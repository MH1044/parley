          - {lemma: parti, pos: verb, en: [left, gone], rank: 343}
          - {lemma: resté, pos: verb, en: [stayed], rank: 921}
          - {lemma: rentré, pos: verb, en: [come home, returned], rank: 1318}
          - {lemma: né, pos: verb, en: [born], rank: 788}
        examples:
          - {id: 1, target: "Où es-tu allé ?", en: ["Where did you go?"]}
          - {id: 2, target: "Elles y sont allées.", en: ["They went there."]}
          - {id: 3, target: "Pourquoi êtes-vous venus ?", en: ["Why did you come?"]}
          - {id: 4, target: "Nous sommes arrivés.", en: ["We have arrived.", "We arrived."]}
          - {id: 5, target: "Elle est partie.", en: ["She left.", "She has left."]}
          - {id: 6, target: "Je suis restée à la maison.", en: ["I stayed at home.", "I stayed home."]}
          - {id: 7, target: "Il est rentré tard hier.", en: ["He came home late yesterday.", "He got back late yesterday."]}
          - {id: 8, target: "Où es-tu née ?", en: ["Where were you born?"]}
      - id: fr.a2.u01.s04
        kind: function
        title: First, then, already
        cefr: A2
        can_do: I can tell what happened in order and say what I have already done.
        requires: [fr.a2.u01.s03]
        grammar_note: >-
          Déjà (already) and pas encore (not yet) go between avoir or être and the
          participle: j'ai déjà dîné, elle n'est pas encore arrivée. Encore on its own
          means still or again. To tell a story in order, use tout d'abord or d'abord
          (first), puis or ensuite (then) and enfin (finally, at last). Avant de plus an
          infinitive means before doing something: mangeons avant de partir. Raconter is
          to tell a story or what happened.
