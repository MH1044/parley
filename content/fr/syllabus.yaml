units:
  - id: fr.a1.u01
    title: Hello
    cefr: A1
    skills:
      - id: fr.a1.u01.s01
        kind: function
        title: Greetings
        cefr: A1
        can_do: I can say hello and goodbye and ask how someone is.
        requires: []
        grammar_note: >-
          Bonjour works all day until the evening, when people switch to bonsoir; salut
          is the informal hello and goodbye between friends. Ask how someone is with ça
          va ? and answer ça va or ça va bien, merci. Tu is for friends, family and
          children; vous is for anyone else and for more than one person. A space goes
          before a question mark or an exclamation mark.
        lemmas:
          - {lemma: bonjour, pos: intj, en: [hello, good morning], rank: 1809}
          - {lemma: bonsoir, pos: intj, en: [good evening], rank: 10442}
          - {lemma: salut, pos: intj, en: [hi, bye], rank: 3108}
          - {lemma: au revoir, pos: expr, en: [goodbye], rank: null}
          - {lemma: merci, pos: intj, en: [thank you, thanks], rank: 476}
          - {lemma: aller, pos: verb, en: [to go], rank: 50}
          - {lemma: bien, pos: adv, en: [well, fine], rank: 86}
          - {lemma: très, pos: adv, en: [very], rank: 95}
          - {lemma: s'il vous plaît, pos: expr, en: [please], rank: null}
        examples:
          - {id: 1, target: "Bonjour, ça va ?", en: ["Hello, how are you?", "Hi, how is it going?"]}
          - {id: 2, target: "Salut, Marie !", en: ["Hi, Marie!"]}
          - {id: 3, target: "Ça va bien, merci. Et toi ?", en: ["I am fine, thank you. And you?", "Fine, thanks. And you?"]}
          - {id: 4, target: "Bonsoir, Paul.", en: ["Good evening, Paul."]}
          - {id: 5, target: "Au revoir et merci !", en: ["Goodbye and thank you!"]}
          - {id: 6, target: "Très bien, merci.", en: ["Very well, thank you.", "Very good, thanks."]}
          - {id: 7, target: "Comment allez-vous ?", en: ["How are you?"]}
          - {id: 8, target: "Oui, s'il vous plaît.", en: ["Yes, please."]}
          - {id: 9, target: "Salut ! Comment ça va ?", en: ["Hi! How are you?", "Hi! How is it going?"]}
          - {id: 10, target: "Comment ça va ?", en: ["How are you?", "How is it going?"]}
          - {id: 11, target: "Je vais bien.", en: ["I am fine.", "I am doing fine."]}
          - {id: 12, target: "Comment vas-tu ?", en: ["How are you?", "How are you doing?"]}
          - {id: 13, target: "Vous allez bien ?", en: ["Are you well?", "Are you OK?"]}
          - {id: 14, target: "Elle va bien.", en: ["She is fine.", "She is well."]}
      - id: fr.a1.u01.s02
        kind: function
        title: Names
        cefr: A1
        can_do: I can say my name and ask someone their name.
        requires: [fr.a1.u01.s01]
        grammar_note: >-
          S'appeler means to call oneself, so the small pronoun in front changes with the
          person: je m'appelle, tu t'appelles, il or elle s'appelle, vous vous appelez.
          Before a vowel, je, me, te and se lose their final e and take an apostrophe:
          j'habite, m'appelle. Monsieur and madame are used on their own, without a name,
          when you speak to someone politely.
        lemmas:
          - {lemma: "s'appeler", pos: verb, en: [to be called], rank: 875}
          - {lemma: nom, pos: noun, gender: m, en: [name], rank: 371}
          - {lemma: madame, pos: noun, gender: f, en: [madam, Mrs], rank: 3443}
          - {lemma: monsieur, pos: noun, gender: m, en: [sir, Mr], rank: 1299}
          - {lemma: enchanté, pos: adj, en: [pleased to meet you, delighted], rank: 5399}
          - {lemma: pardon, pos: intj, en: [sorry, excuse me], rank: 3095}
          - {lemma: appeler, pos: verb, en: [to call], rank: 256}
        examples:
          - {id: 1, target: "Je m'appelle Marie.", en: ["My name is Marie.", "I am called Marie."]}
          - {id: 2, target: "Comment tu t'appelles ?", en: ["What is your name?", "What are you called?"]}
          - {id: 3, target: "Comment vous appelez-vous ?", en: ["What is your name?"]}
          - {id: 4, target: "Il s'appelle Paul.", en: ["His name is Paul.", "He is called Paul."]}
          - {id: 5, target: "Enchantée, monsieur.", en: ["Pleased to meet you, sir."]}
          - {id: 6, target: "Pardon, madame. Vous vous appelez comment ?", en: ["Excuse me, madam. What is your name?"]}
          - {id: 7, target: "Et ton nom ?", en: ["And your name?", "And what is your name?"]}
          - {id: 8, target: "Bonjour, je m'appelle Paul. Enchanté.", en: ["Hello, my name is Paul. Pleased to meet you."]}
          - {id: 9, target: "Votre nom, s'il vous plaît.", en: ["Your name, please."]}
          - {id: 10, target: "Comment s'appelle-t-elle ?", en: ["What is her name?"]}
          - {id: 11, target: "Comment ça s'appelle ?", en: ["What is this called?", "What is it called?"]}
          - {id: 12, target: "Comment tu t'appelles, s'il te plaît ?", en: ["What's your name, please?", "What is your name, please?"]}
      - id: fr.a1.u01.s03
        kind: grammar
        title: Where you are from
        cefr: A1
        can_do: I can say where I am from and which languages I speak.
        requires: [fr.a1.u01.s02]
        grammar_note: >-
          Être is the verb to be: je suis, tu es, il est, nous sommes, vous êtes, ils
          sont. Regular -er verbs like parler and habiter follow one pattern: je parle,
          tu parles, il parle, nous parlons, vous parlez, ils parlent. Say where you are
          from with de (d' before a vowel): je suis de Lyon, tu es d'où ? Language names
          are not capitalised: français, anglais.
        lemmas:
          - {lemma: être, pos: verb, en: [to be], rank: 3}
          - {lemma: habiter, pos: verb, en: [to live], rank: 644}
          - {lemma: parler, pos: verb, en: [to speak, to talk], rank: 89}
          - {lemma: français, pos: noun, gender: m, en: [French], rank: 253}
          - {lemma: anglais, pos: noun, gender: m, en: [English], rank: 350}
          - {lemma: espagnol, pos: noun, gender: m, en: [Spanish], rank: 1652}
          - {lemma: allemand, pos: noun, gender: m, en: [German], rank: 924}
          - {lemma: aussi, pos: adv, en: [also, too], rank: 239}
          - {lemma: un peu, pos: expr, en: [a little, a bit], rank: null}
        examples:
          - {id: 1, target: "Je suis de Lyon.", en: ["I am from Lyon."]}
          - {id: 2, target: "Tu es d'où ?", en: ["Where are you from?"]}
          - {id: 3, target: "Marie est de Paris.", en: ["Marie is from Paris."]}
          - {id: 4, target: "J'habite à Lyon.", en: ["I live in Lyon."]}
          - {id: 5, target: "Je parle français et un peu anglais.", en: ["I speak French and a little English."]}
          - {id: 6, target: "Vous parlez anglais ?", en: ["Do you speak English?"]}
          - {id: 7, target: "Paul parle aussi l'allemand.", en: ["Paul also speaks German.", "Paul speaks German too."]}
          - {id: 8, target: "Vous êtes de Paris ?", en: ["Are you from Paris?"]}
          - {id: 9, target: "Elle parle espagnol.", en: ["She speaks Spanish."]}
          - {id: 10, target: "Nous sommes de France.", en: ["We are from France."]}
          - {id: 11, target: "J'habite en France.", en: ["I live in France."]}
          - {id: 12, target: "Je parle un peu espagnol.", en: ["I speak a little Spanish."]}
          - {id: 13, target: "Je parle anglais, français et espagnol.", en: ["I speak English, French and Spanish."]}
          - {id: 14, target: "Je suis français.", en: ["I am French."]}
      - id: fr.a1.u01.s04
        kind: grammar
        title: Numbers and age
        cefr: A1
        can_do: I can count to twenty and say how old I am.
        requires: [fr.a1.u01.s03]
        grammar_note: >-
          Age uses avoir (to have): j'ai vingt ans is literally I have twenty years. Avoir
          in the present: j'ai, tu as, il a, nous avons, vous avez, ils ont. Ask with tu
          as quel âge ? or, politely, quel âge avez-vous ? Seventy is soixante-dix
          (sixty-ten), eighty is quatre-vingts (four twenties) and ninety is
          quatre-vingt-dix.
        lemmas:
          - {lemma: avoir, pos: verb, en: [to have], rank: 8}
          - {lemma: an, pos: noun, gender: m, en: [year], rank: 316}
          - {lemma: âge, pos: noun, gender: m, en: [age], rank: 677}
          - {lemma: numéro, pos: noun, gender: m, en: [number], rank: 1121}
          - {lemma: téléphone, pos: noun, gender: m, en: [telephone, phone], rank: 530}
          - {lemma: deux, pos: num, en: [two], rank: 173}
          - {lemma: trois, pos: num, en: [three], rank: 308}
          - {lemma: quatre, pos: num, en: [four], rank: 770}
          - {lemma: cinq, pos: num, en: [five], rank: 714}
          - {lemma: six, pos: num, en: [six], rank: 1013}
          - {lemma: sept, pos: num, en: [seven], rank: 1256}
          - {lemma: huit, pos: num, en: [eight], rank: 1297}
          - {lemma: neuf, pos: num, en: [nine], rank: 1145}
          - {lemma: dix, pos: num, en: [ten], rank: 522}
        examples:
          - {id: 1, target: "J'ai vingt ans.", en: ["I am twenty years old.", "I am twenty."]}
          - {id: 2, target: "Tu as quel âge ?", en: ["How old are you?"]}
          - {id: 3, target: "Quel âge avez-vous ?", en: ["How old are you?"]}
          - {id: 4, target: "Marie a trente-deux ans.", en: ["Marie is thirty-two years old.", "Marie is thirty-two."]}
          - {id: 5, target: "Un, deux, trois, quatre, cinq.", en: ["One, two, three, four, five."]}
          - {id: 6, target: "Six, sept, huit, neuf et dix.", en: ["Six, seven, eight, nine and ten."]}
          - {id: 7, target: "C'est quoi, ton numéro de téléphone ?", en: ["What is your phone number?"]}
          - {id: 8, target: "Il a dix ans.", en: ["He is ten years old.", "He is ten."]}
          - {id: 9, target: "Quel est ton numéro de téléphone ?", en: ["What is your phone number?"]}
          - {id: 10, target: "J'ai son numéro de téléphone.", en: ["I have his phone number.", "I have her phone number."]}
          - {id: 11, target: "Tu es de mon âge.", en: ["You are my age.", "You are the same age as me."]}
  - id: fr.a1.u02
    title: Day to day
    cefr: A1
    skills:
      - id: fr.a1.u02.s01
        kind: grammar
        title: People and things
        cefr: A1
        can_do: I can name people, animals and everyday things with the right article.
        requires: [fr.a1.u01.s04]
        grammar_note: >-
          Every French noun is masculine or feminine. A or an is un before a masculine
          noun and une before a feminine one; the is le or la, and l' before a vowel or a
          silent h: l'ami, l'homme. In the plural, the is les and some is des: des
          enfants. Most nouns add an -s in writing, which is not pronounced. Learn each
          noun with its article, because the ending rarely shows the gender. Before a
          vowel, my is mon even for a feminine noun: mon amie. Femme means woman and wife,
          fille girl and daughter.
        lemmas:
          - {lemma: homme, pos: noun, gender: m, en: [man], rank: 242}
          - {lemma: femme, pos: noun, gender: f, en: [woman, wife], rank: 279}
          - {lemma: enfant, pos: noun, gender: m, en: [child], rank: 204}
          - {lemma: ami, pos: noun, gender: m, en: [friend], rank: 181}
          - {lemma: garçon, pos: noun, gender: m, en: [boy], rank: 436}
          - {lemma: fille, pos: noun, gender: f, en: [girl, daughter], rank: 286}
          - {lemma: chien, pos: noun, gender: m, en: [dog], rank: 269}
          - {lemma: chat, pos: noun, gender: m, en: [cat], rank: 357}
          - {lemma: livre, pos: noun, gender: m, en: [book], rank: 202}
          - {lemma: voiture, pos: noun, gender: f, en: [car], rank: 221}
        examples:
          - {id: 1, target: "J'ai un chat et un chien.", en: ["I have a cat and a dog."]}
          - {id: 2, target: "C'est mon livre.", en: ["This is my book.", "That is my book.", "It is my book."]}
          - {id: 3, target: "C'est mon amie.", en: ["She is my friend.", "She's my friend."]}
          - {id: 4, target: "Avez-vous une voiture ?", en: ["Do you have a car?", "Have you got a car?"]}
          - {id: 5, target: "Nous avons deux filles.", en: ["We have two daughters.", "We've got two daughters."]}
          - {id: 6, target: "Qui sont vos amis ?", en: ["Who are your friends?"]}
          - {id: 7, target: "Les enfants parlent.", en: ["The children are talking.", "The children are speaking."]}
          - {id: 8, target: "J'ai une femme et trois enfants.", en: ["I have a wife and three children."]}
      - id: fr.a1.u02.s02
        kind: grammar
        title: Everyday verbs
        cefr: A1
        can_do: I can say what I do every day and what I do not do.
        requires: [fr.a1.u02.s01]
        grammar_note: >-
          Most verbs end in -er and follow parler: drop -er and add -e, -es, -e, -ons,
          -ez, -ent. Only -ons and -ez are heard, so je travaille, tu travailles and ils
          travaillent sound the same. Je becomes j' before a vowel: j'écoute. To say not,
          put ne before the verb and pas after it: je ne travaille pas; ne becomes n'
          before a vowel. After a negative, un, une and des become de: vous n'avez pas de
          télévision ? The French present covers both I work and I am working.
        lemmas:
          - {lemma: travailler, pos: verb, en: [to work], rank: 245}
          - {lemma: étudier, pos: verb, en: [to study], rank: 345}
          - {lemma: regarder, pos: verb, en: [to watch, to look at], rank: 241}
          - {lemma: écouter, pos: verb, en: [to listen, to listen to], rank: 449}
          - {lemma: jouer, pos: verb, en: [to play], rank: 264}
          - {lemma: chanter, pos: verb, en: [to sing], rank: 500}
          - {lemma: télévision, pos: noun, gender: f, en: [television, TV], rank: 1034}
          - {lemma: musique, pos: noun, gender: f, en: [music], rank: 687}
          - {lemma: beaucoup, pos: adv, en: [a lot, much], rank: 135}
        examples:
          - {id: 1, target: "J'étudie le français.", en: ["I study French.", "I am studying French."]}
          - {id: 2, target: "Il regarde la télévision.", en: ["He is watching TV.", "He watches television."]}
          - {id: 3, target: "J'écoute de la musique.", en: ["I am listening to music.", "I listen to music."]}
          - {id: 4, target: "Il travaille beaucoup.", en: ["He works a lot.", "He works hard."]}
          - {id: 5, target: "Vous n'avez pas de télévision ?", en: ["Don't you have a television?", "You do not have a TV?"]}
          - {id: 6, target: "Le chat joue avec les enfants.", en: ["The cat is playing with the children."]}
          - {id: 7, target: "Elle chante très bien.", en: ["She sings very well."]}
          - {id: 8, target: "Où travaillez-vous ?", en: ["Where do you work?"]}
      - id: fr.a1.u02.s03
        kind: function
        title: Likes and dislikes
        cefr: A1
        can_do: I can say what I like, love, prefer and hate.
        requires: [fr.a1.u02.s02]
        grammar_note: >-
          Aimer means to like, and with people to love; adorer is to love something and
          détester to hate it. After these verbs French keeps the article where English
          has none: j'aime le sport, I like sport; je préfère les chiens, I prefer dogs.
          Add an infinitive to talk about an activity: j'aime lire. Préférer changes its
          accent where the ending is silent: je préfère, but nous préférons. Jouer à is to
          play a sport or a game, and à le becomes au: je joue au football.
        lemmas:
          - {lemma: aimer, pos: verb, en: [to like, to love], rank: 72}
          - {lemma: adorer, pos: verb, en: [to love, to adore], rank: 454}
          - {lemma: détester, pos: verb, en: [to hate], rank: 492}
          - {lemma: préférer, pos: verb, en: [to prefer], rank: 467}
          - {lemma: sport, pos: noun, gender: m, en: [sport, sports], rank: 1533}
          - {lemma: football, pos: noun, gender: m, en: [football, soccer], rank: 1487}
          - {lemma: film, pos: noun, gender: m, en: [film, movie], rank: 511}
          - {lemma: lire, pos: verb, en: [to read], rank: 207}
        examples:
          - {id: 1, target: "J'aime le sport.", en: ["I like sport.", "I like sports."]}
          - {id: 2, target: "J'adore la musique.", en: ["I love music."]}
          - {id: 3, target: "Je n'aime pas la musique.", en: ["I do not like music."]}
          - {id: 4, target: "Je déteste le football.", en: ["I hate football.", "I hate soccer."]}
          - {id: 5, target: "Je préfère les chiens.", en: ["I prefer dogs."]}
          - {id: 6, target: "J'aime lire.", en: ["I like reading.", "I like to read."]}
          - {id: 7, target: "Quel sport préfères-tu ?", en: ["Which sport do you prefer?", "Which sport do you like best?"]}
          - {id: 8, target: "J'aime ce film.", en: ["I like this film.", "I like this movie."]}
      - id: fr.a1.u02.s04
        kind: grammar
        title: Asking what people do
        cefr: A1
        can_do: I can ask and say what someone is doing today or now.
        requires: [fr.a1.u02.s03]
        grammar_note: >-
          Faire (to do, to make) is irregular: je fais, tu fais, il fait, nous faisons,
          vous faites, ils font. A yes or no question can be asked three ways: raise your
          voice at the end (vous travaillez ici ?), put est-ce que in front (est-ce que
          vous travaillez ici ?), or, more formally, put the pronoun after the verb with a
          hyphen (travaillez-vous ici ?). For what, use que before a verb with the pronoun
          after it (que fais-tu ?) and qu'est-ce que otherwise (qu'est-ce que tu fais ?).
        lemmas:
          - {lemma: faire, pos: verb, en: [to do, to make], rank: 31}
          - {lemma: travail, pos: noun, gender: m, en: [work, job], rank: 254}
          - {lemma: école, pos: noun, gender: f, en: [school], rank: 311}
          - {lemma: ici, pos: adv, en: [here], rank: 114}
          - {lemma: maintenant, pos: adv, en: [now], rank: 249}
          - {lemma: "aujourd'hui", pos: adv, en: [today], rank: 238}
        examples:
          - {id: 1, target: "Que faites-vous aujourd'hui ?", en: ["What are you doing today?"]}
          - {id: 2, target: "Qu'est-ce que tu fais maintenant ?", en: ["What are you doing now?"]}
          - {id: 3, target: "Est-ce que vous travaillez ici ?", en: ["Do you work here?"]}
          - {id: 4, target: "Je ne travaille pas aujourd'hui.", en: ["I am not working today.", "I don't work today."]}
          - {id: 5, target: "J'aime mon travail.", en: ["I like my job.", "I like my work."]}
          - {id: 6, target: "Aimes-tu l'école ?", en: ["Do you like school?"]}
          - {id: 7, target: "Je fais du sport.", en: ["I do sport.", "I play sports."]}
          - {id: 8, target: "Que fais-tu ?", en: ["What are you doing?", "What do you do?"]}
  - id: fr.a1.u03
    title: Food and drink
    cefr: A1
    skills:
      - id: fr.a1.u03.s01
        kind: vocab
        title: Food and drink
        cefr: A1
        can_do: I can name common food and drinks and say which I like.
        requires: [fr.a1.u02.s04]
        grammar_note: >-
          Learn each word with its article: le café, le thé, le lait, le vin, le pain, le
          fromage, le gâteau, le chocolat, but la bière and l'eau, which is feminine. Un
          café is a coffee and also a café. To talk about what you like in general, use
          le, la or les: j'aime le fromage. J'aimerais (I would like) is a polite way to
          ask for something: j'aimerais une bière.
        lemmas:
          - {lemma: café, pos: noun, gender: m, en: [coffee, café], rank: 491}
          - {lemma: thé, pos: noun, gender: m, en: [tea], rank: 849}
          - {lemma: eau, pos: noun, gender: f, en: [water], rank: 319}
          - {lemma: lait, pos: noun, gender: m, en: [milk], rank: 892}
          - {lemma: vin, pos: noun, gender: m, en: [wine], rank: 783}
          - {lemma: bière, pos: noun, gender: f, en: [beer], rank: 961}
          - {lemma: pain, pos: noun, gender: m, en: [bread], rank: 874}
          - {lemma: fromage, pos: noun, gender: m, en: [cheese], rank: 2010}
          - {lemma: gâteau, pos: noun, gender: m, en: [cake], rank: 886}
          - {lemma: chocolat, pos: noun, gender: m, en: [chocolate, hot chocolate], rank: 1586}
        examples:
          - {id: 1, target: "Café ou thé ?", en: ["Coffee or tea?"]}
          - {id: 2, target: "J'aime le fromage.", en: ["I like cheese."]}
          - {id: 3, target: "Avez-vous du vin ?", en: ["Do you have any wine?", "Have you got any wine?"]}
          - {id: 4, target: "J'aimerais une bière.", en: ["I would like a beer."]}
          - {id: 5, target: "Où est le pain ?", en: ["Where is the bread?"]}
          - {id: 6, target: "Les enfants adorent les gâteaux.", en: ["Children love cakes.", "Children love cake."]}
          - {id: 7, target: "Nous n'avons pas de lait.", en: ["We do not have any milk.", "We have no milk."]}
          - {id: 8, target: "Aimeriez-vous de l'eau ?", en: ["Would you like some water?"]}
      - id: fr.a1.u03.s02
        kind: grammar
        title: Some and any
        cefr: A1
        can_do: I can say what I eat and drink and ask if there is any.
        requires: [fr.a1.u03.s01]
        grammar_note: >-
          For an amount you do not count, French uses de with the article: du pain (de +
          le), de la viande, de l'eau, des fruits. English often says some or nothing at
          all: je mange de la viande, I eat meat. After a negative or beaucoup, use de
          alone: nous n'avons pas de sucre, beaucoup de légumes. Boire is irregular: je
          bois, tu bois, il boit, nous buvons, vous buvez, ils boivent. Manger keeps an e
          before -ons: nous mangeons.
        lemmas:
          - {lemma: manger, pos: verb, en: [to eat], rank: 154}
          - {lemma: boire, pos: verb, en: [to drink], rank: 208}
          - {lemma: viande, pos: noun, gender: f, en: [meat], rank: 1207}
          - {lemma: poisson, pos: noun, gender: m, en: [fish], rank: 797}
          - {lemma: légume, pos: noun, gender: m, en: [vegetable], rank: 1859}
          - {lemma: fruit, pos: noun, gender: m, en: [fruit], rank: 1101}
          - {lemma: œuf, pos: noun, gender: m, en: [egg], rank: 1118}
          - {lemma: sucre, pos: noun, gender: m, en: [sugar], rank: 1469}
          - {lemma: pomme, pos: noun, gender: f, en: [apple], rank: 711}
        examples:
