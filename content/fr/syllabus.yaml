          - {lemma: enfin, pos: adv, en: [finally, at last], rank: 1235}
          - {lemma: avant, pos: prep, en: [before], rank: 305}
          - {lemma: raconter, pos: verb, en: [to tell, to recount], rank: 1027}
        examples:
          - {id: 1, target: "J'ai déjà dîné.", en: ["I have already had dinner.", "I already ate dinner."]}
          - {id: 2, target: "Je n'ai pas encore mangé.", en: ["I haven't eaten yet.", "I have not eaten yet."]}
          - {id: 3, target: "Elle n'est pas encore arrivée.", en: ["She hasn't arrived yet.", "She still hasn't arrived."]}
          - {id: 4, target: "Tout d'abord, écrivez votre nom.", en: ["First of all, write your name."]}
          - {id: 5, target: "Qu'as-tu fait, ensuite ?", en: ["What did you do then?", "What did you do next?"]}
          - {id: 6, target: "Il est enfin arrivé.", en: ["He finally arrived.", "At last he arrived."]}
          - {id: 7, target: "Mangeons avant de partir.", en: ["Let's eat before we go.", "Let's eat before leaving."]}
          - {id: 8, target: "Je veux tout te raconter.", en: ["I want to tell you everything."]}
  - id: fr.a2.u02
    title: Health
    cefr: A2
    skills:
      - id: fr.a2.u02.s01
        kind: vocab
        title: The body
        cefr: A2
        can_do: I can name parts of the body and say where it hurts.
        requires: [fr.a2.u01.s04]
        grammar_note: >-
          To say where it hurts, use avoir mal à with the article, not my: j'ai mal à la tête
          (I have a headache), j'ai mal au dos, à l'oreille, aux dents. You can also make the
          body part the subject of faire mal: mon bras me fait mal (my arm hurts). Ask where
          it hurts with où as-tu mal ? or où avez-vous mal ? When it is clear whose body it
          is, French uses le, la or les rather than mon or ma: lève la main. Un bras is an arm
          and des bras the plural.
        lemmas:
          - {lemma: corps, pos: noun, gender: m, en: [body], rank: 1220}
          - {lemma: tête, pos: noun, gender: f, en: [head], rank: 558}
          - {lemma: bras, pos: noun, gender: m, en: [arm], rank: 1048}
          - {lemma: main, pos: noun, gender: f, en: [hand], rank: 372}
          - {lemma: jambe, pos: noun, gender: f, en: [leg], rank: 1275}
          - {lemma: dos, pos: noun, gender: m, en: [back], rank: 1285}
          - {lemma: ventre, pos: noun, gender: m, en: [stomach, belly], rank: 3615}
          - {lemma: gorge, pos: noun, gender: f, en: [throat], rank: 3439}
          - {lemma: dent, pos: noun, gender: f, en: [tooth], rank: 1058}
          - {lemma: oreille, pos: noun, gender: f, en: [ear], rank: 1407}
          - {lemma: mal, pos: noun, gender: m, en: [pain, ache, harm], rank: 293}
        examples:
          - {id: 1, target: "J'ai mal à la tête.", en: ["I have a headache.", "My head hurts."]}
          - {id: 2, target: "Où as-tu mal ?", en: ["Where does it hurt?", "Where do you have pain?"]}
          - {id: 3, target: "J'ai mal au dos.", en: ["My back hurts.", "I have a pain in my back."]}
          - {id: 4, target: "J'ai mal à la gorge.", en: ["I have a sore throat.", "My throat hurts."]}
          - {id: 5, target: "As-tu mal aux dents ?", en: ["Do you have a toothache?", "Do your teeth hurt?"]}
          - {id: 6, target: "Avez-vous mal au ventre ?", en: ["Do you have a stomach ache?", "Does your stomach hurt?"]}
          - {id: 7, target: "Mon bras gauche me fait mal.", en: ["My left arm hurts."]}
          - {id: 8, target: "Lave-toi les mains.", en: ["Wash your hands."]}
      - id: fr.a2.u02.s02
        kind: grammar
        title: Feeling ill
        cefr: A2
        can_do: I can say how I feel and what is wrong with me.
        requires: [fr.a2.u02.s01]
        grammar_note: >-
          Many verbs about health are pronominal: a pronoun that matches the subject comes
          before the verb. Je me sens mal is I feel unwell, il se sent mieux he feels better.
          In the passé composé they take être, and the participle agrees as with être (elle
          s'est blessée), except when a body part follows: je me suis cassé la jambe, elle
          s'est cassé le bras. Malade (ill) and fatigué (tired) agree like adjectives: elle
          est fatiguée. Avoir de la fièvre is to have a temperature, and avoir un rhume to
          have a cold.
        lemmas:
          - {lemma: sentir, pos: verb, en: [to feel, to smell], rank: 246}
          - {lemma: malade, pos: adj, en: [ill, sick], rank: 571}
          - {lemma: fatigué, pos: adj, en: [tired], rank: 505}
          - {lemma: fièvre, pos: noun, gender: f, en: [fever, temperature], rank: 3046}
          - {lemma: rhume, pos: noun, gender: m, en: [cold], rank: 1836}
          - {lemma: casser, pos: verb, en: [to break], rank: 843}
          - {lemma: blesser, pos: verb, en: [to hurt, to injure], rank: 853}
          - {lemma: mieux, pos: adv, en: [better], rank: 304}
        examples:
          - {id: 1, target: "Je me sens malade.", en: ["I feel ill.", "I feel sick."]}
          - {id: 2, target: "Il se sent fatigué.", en: ["He feels tired.", "He is feeling tired."]}
          - {id: 3, target: "Je me sens beaucoup mieux.", en: ["I feel much better.", "I'm feeling a lot better."]}
          - {id: 4, target: "Vous sentez-vous mieux ?", en: ["Do you feel better?", "Are you feeling better?"]}
          - {id: 5, target: "J'ai de la fièvre.", en: ["I have a fever.", "I have a temperature."]}
          - {id: 6, target: "J'ai un rhume.", en: ["I have a cold.", "I've got a cold."]}
          - {id: 7, target: "Je me suis cassé la jambe.", en: ["I broke my leg.", "I have broken my leg."]}
          - {id: 8, target: "Je me suis blessé.", en: ["I hurt myself.", "I got hurt."]}
      - id: fr.a2.u02.s03
        kind: grammar
        title: Since when
        cefr: A2
        can_do: I can say how long something has lasted and when it started.
        requires: [fr.a2.u02.s02]
        grammar_note: >-
          Depuis with the present says how long something has been going on and is still true:
          il est malade depuis une semaine (he has been ill for a week), je suis ici depuis
          samedi. English uses have been, French the present. Ask depuis quand ? (since when?)
          or depuis combien de temps ? (for how long?). Pendant is for a period that is over:
          il a été malade pendant une semaine. Il y a with an amount of time means ago: je
          l'ai acheté il y a un mois. Temps is time, and also the weather.
        lemmas:
          - {lemma: depuis, pos: prep, en: [since, for], rank: 340}
          - {lemma: pendant, pos: prep, en: [during, for], rank: 434}
          - {lemma: longtemps, pos: adv, en: [a long time, long], rank: 474}
          - {lemma: temps, pos: noun, gender: m, en: [time, weather], rank: 118}
          - {lemma: mois, pos: noun, gender: m, en: [month], rank: 618}
          - {lemma: il y a, pos: expr, en: [ago, there is], rank: null}
        examples:
          - {id: 1, target: "Depuis combien de temps êtes-vous malade ?", en: ["How long have you been ill?", "How long have you been sick?"]}
          - {id: 2, target: "Il est malade depuis une semaine.", en: ["He has been ill for a week.", "He's been sick for a week."]}
          - {id: 3, target: "J'ai mal à la tête depuis hier.", en: ["I have had a headache since yesterday.", "My head has been hurting since yesterday."]}
          - {id: 4, target: "J'habite ici depuis longtemps.", en: ["I have lived here for a long time."]}
          - {id: 5, target: "Je suis ici depuis samedi.", en: ["I have been here since Saturday."]}
          - {id: 6, target: "Il a été malade pendant une semaine.", en: ["He was ill for a week.", "He was sick for a week."]}
          - {id: 7, target: "Je l'ai acheté il y a un mois.", en: ["I bought it a month ago."]}
          - {id: 8, target: "Ça fait longtemps.", en: ["It's been a long time.", "Long time no see."]}
      - id: fr.a2.u02.s04
        kind: function
        title: At the doctor's
        cefr: A2
        can_do: I can understand a doctor's questions and advice and say what I should do.
        requires: [fr.a2.u02.s03]
        grammar_note: >-
          A doctor gives advice with the imperative, the vous form without its pronoun: prenez
          ce médicament, buvez beaucoup d'eau, restez au lit. With a reflexive verb the
          pronoun follows with a hyphen and te becomes toi: reposez-vous, repose-toi; in the
          negative it goes back in front: ne vous inquiétez pas. Tu devrais and vous devriez
          (you should) make advice softer: vous devriez arrêter de fumer. Arrêter de with an
          infinitive is to stop doing something. Ce n'est pas grave means it is nothing
          serious, or never mind.
        lemmas:
          - {lemma: médecin, pos: noun, gender: m, en: [doctor], rank: 625}
          - {lemma: médicament, pos: noun, gender: m, en: [medicine, drug], rank: 1204}
          - {lemma: reposer, pos: verb, en: [to rest, to put back], rank: 1263}
          - {lemma: arrêter, pos: verb, en: [to stop], rank: 240}
          - {lemma: fumer, pos: verb, en: [to smoke], rank: 617}
          - {lemma: grave, pos: adj, en: [serious], rank: 1991}
          - {lemma: inquiéter, pos: verb, en: [to worry], rank: 832}
          - {lemma: conseil, pos: noun, gender: m, en: [advice, piece of advice], rank: 851}
        examples:
          - {id: 1, target: "Tu devrais voir un médecin.", en: ["You should see a doctor."]}
          - {id: 2, target: "Prenez vos médicaments.", en: ["Take your medicine.", "Take your medication."]}
          - {id: 3, target: "Vous devez vous reposer.", en: ["You have to rest.", "You need to get some rest."]}
          - {id: 4, target: "Reposez-vous bien.", en: ["Get some good rest.", "Rest well."]}
          - {id: 5, target: "Vous devriez arrêter de fumer.", en: ["You should stop smoking.", "You should quit smoking."]}
          - {id: 6, target: "Est-ce grave ?", en: ["Is it serious?"]}
          - {id: 7, target: "Ne vous inquiétez pas.", en: ["Don't worry."]}
          - {id: 8, target: "Merci pour vos conseils.", en: ["Thank you for your advice.", "Thanks for your advice."]}
  - id: fr.a2.u03
    title: Work
    cefr: A2
    skills:
      - id: fr.a2.u03.s01
        kind: vocab
        title: Jobs
        cefr: A2
        can_do: I can say what job I do and ask others about theirs.
        requires: [fr.a2.u02.s04]
        grammar_note: >-
          A job takes no article after être: je suis professeur, elle est avocate. Use un or
          une after c'est, or when there is an adjective: c'est un avocat, je suis un bon
          cuisinier. Most job nouns have a feminine form: avocat, avocate; étudiant,
          étudiante; infirmier, infirmière; cuisinier, cuisinière; serveur, serveuse.
          Journaliste does not change, and professeur is also written professeure for a woman.
          Devenir (to become) goes like venir and takes être in the passé composé: il est
          devenu policier. Un métier is a trade or profession.
        lemmas:
          - {lemma: métier, pos: noun, gender: m, en: [job, trade, profession], rank: 4959}
          - {lemma: professeur, pos: noun, gender: m, en: [teacher, professor], rank: 658}
          - {lemma: avocat, pos: noun, gender: m, en: [lawyer], rank: 1156}
          - {lemma: infirmier, pos: noun, gender: m, en: [nurse], rank: 2472}
          - {lemma: policier, pos: noun, gender: m, en: [police officer], rank: 1362}
          - {lemma: cuisinier, pos: noun, gender: m, en: [cook, chef], rank: 2605}
          - {lemma: serveur, pos: noun, gender: m, en: [waiter], rank: 3461}
          - {lemma: journaliste, pos: noun, gender: m, en: [journalist], rank: 3324}
          - {lemma: étudiant, pos: noun, gender: m, en: [student], rank: 564}
          - {lemma: devenir, pos: verb, en: [to become], rank: 349}
        examples:
          - {id: 1, target: "C'est mon métier.", en: ["It's my job.", "This is my job."]}
          - {id: 2, target: "Je suis professeur.", en: ["I am a teacher."]}
          - {id: 3, target: "Êtes-vous avocat ?", en: ["Are you a lawyer?"]}
          - {id: 4, target: "Ma sœur est infirmière.", en: ["My sister is a nurse."]}
          - {id: 5, target: "Il est devenu policier.", en: ["He became a police officer.", "He became a policeman."]}
          - {id: 6, target: "Je suis un bon cuisinier.", en: ["I am a good cook."]}
          - {id: 7, target: "Elle est journaliste.", en: ["She is a journalist."]}
          - {id: 8, target: "Je suis étudiante.", en: ["I am a student."]}
      - id: fr.a2.u03.s02
        kind: vocab
        title: At work
        cefr: A2
        can_do: I can talk about where I work, who I work with and what I earn.
        requires: [fr.a2.u03.s01]
        grammar_note: >-
          Au bureau means at the office, en réunion in a meeting and en équipe as a team. You
          work dans or pour une entreprise. Gagner means to earn as well as to win: il gagne
          bien (he earns well). Un collègue and une collègue are a male and a female
          colleague, and the boss is le patron or la patronne. Un projet is a project at work
          and also a plan: j'ai des projets. A client is a customer in a shop as well as a
          client.
