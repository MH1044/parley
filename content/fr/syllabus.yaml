          - {id: 5, target: "Avez-vous une chambre libre ?", en: ["Do you have a room available?", "Do you have a free room?"]}
          - {id: 6, target: "Je vais prendre l'ascenseur.", en: ["I am going to take the lift.", "I am going to take the elevator."]}
          - {id: 7, target: "Avez-vous les clés ?", en: ["Do you have the keys?", "Have you got the keys?"]}
          - {id: 8, target: "Je reste dans cet hôtel.", en: ["I am staying at this hotel.", "I'm staying in this hotel."]}
      - id: fr.a1.u08.s04
        kind: grammar
        title: Needs and musts
        cefr: A1
        can_do: I can say what I need, what I have to do and that I do not know.
        requires: [fr.a1.u08.s03]
        grammar_note: >-
          Devoir (must, to have to) is irregular: je dois, tu dois, il doit, nous devons,
          vous devez, ils doivent, and takes an infinitive: je dois partir. Il faut plus an
          infinitive (from falloir) means it is necessary, one must; its subject is always
          il: il faut réserver. Avoir besoin de is to need: j'ai besoin d'un taxi. Savoir
          is to know a fact: je sais, tu sais, il sait; je ne sais pas (I do not know).
          Attendre means to wait for, with no word for for: attendez-moi.
        lemmas:
          - {lemma: devoir, pos: verb, en: [must, to have to], rank: 57}
          - {lemma: falloir, pos: verb, en: [to be necessary, must], rank: 187}
          - {lemma: besoin, pos: noun, gender: m, en: [need], rank: 155}
          - {lemma: savoir, pos: verb, en: [to know], rank: 63}
          - {lemma: oublier, pos: verb, en: [to forget], rank: 320}
          - {lemma: attendre, pos: verb, en: [to wait, to wait for], rank: 229}
        examples:
          - {id: 1, target: "J'ai besoin d'un taxi.", en: ["I need a taxi."]}
          - {id: 2, target: "J'ai besoin d'une chambre.", en: ["I need a room."]}
          - {id: 3, target: "Je dois partir maintenant.", en: ["I have to leave now.", "I must leave now."]}
          - {id: 4, target: "Il faut réserver.", en: ["You have to book.", "You need to book in advance."]}
          - {id: 5, target: "Il faut payer.", en: ["You have to pay.", "You must pay."]}
          - {id: 6, target: "Je ne sais pas.", en: ["I do not know.", "I don't know."]}
          - {id: 7, target: "N'oublie pas ton passeport.", en: ["Don't forget your passport.", "Do not forget your passport."]}
          - {id: 8, target: "Attendez-moi ici.", en: ["Wait for me here."]}
  - id: fr.a2.u01
    title: What I did
    cefr: A2
    skills:
      - id: fr.a2.u01.s01
        kind: grammar
        title: Yesterday
        cefr: A2
        can_do: I can say what I did yesterday and last week.
        requires: [fr.a1.u08.s04]
        grammar_note: >-
          The passé composé tells what happened: the present of avoir plus a past
          participle. Regular -er verbs end in -é (j'ai parlé), -ir verbs in -i (j'ai
          choisi) and -re verbs in -u (j'ai perdu, j'ai répondu). It covers both I spoke
          and I have spoken. In the negative, ne and pas go around avoir: elle n'a pas
          répondu. Hier soir means last night or yesterday evening, and passer is to
          spend time: j'ai passé une bonne soirée.
        lemmas:
          - {lemma: hier, pos: adv, en: [yesterday], rank: 276}
          - {lemma: passer, pos: verb, en: [to spend, to pass, to drop in], rank: 88}
          - {lemma: téléphoner, pos: verb, en: [to phone, to call], rank: 448}
          - {lemma: rencontrer, pos: verb, en: [to meet], rank: 388}
          - {lemma: perdre, pos: verb, en: [to lose], rank: 288}
          - {lemma: choisir, pos: verb, en: [to choose], rank: 774}
          - {lemma: répondre, pos: verb, en: [to answer, to reply], rank: 507}
          - {lemma: soirée, pos: noun, gender: f, en: [evening, party], rank: 1599}
        examples:
          - {id: 1, target: "Hier, j'ai rencontré Marie.", en: ["Yesterday I met Marie.", "I met Marie yesterday."]}
          - {id: 2, target: "Nous avons travaillé hier.", en: ["We worked yesterday."]}
          - {id: 3, target: "J'ai étudié hier soir.", en: ["I studied last night.", "I studied yesterday evening."]}
          - {id: 4, target: "Je lui ai téléphoné hier.", en: ["I phoned him yesterday.", "I called her yesterday."]}
          - {id: 5, target: "Tu as passé une bonne soirée ?", en: ["Did you have a nice evening?", "Did you have a good evening?"]}
          - {id: 6, target: "J'ai perdu mon téléphone.", en: ["I lost my phone.", "I have lost my phone."]}
          - {id: 7, target: "Tu as choisi ?", en: ["Have you chosen?", "Have you decided?"]}
          - {id: 8, target: "Elle n'a pas répondu.", en: ["She didn't answer.", "She did not reply."]}
      - id: fr.a2.u01.s02
        kind: grammar
        title: Seen, said and done
        cefr: A2
        can_do: I can say what I saw, said, wrote and did.
        requires: [fr.a2.u01.s01]
        grammar_note: >-
          Many common verbs have an irregular past participle: faire becomes fait, prendre
          pris, mettre mis, dire dit, écrire écrit, ouvrir ouvert, voir vu, lire lu, boire
          bu, recevoir reçu, avoir eu and être été. They still take avoir: j'ai vu, nous
          avons pris. When the pronoun comes after the verb in a question, it goes after
          avoir: as-tu vu ce film ? Prendre une photo is to take a picture, and mettre
          also means to put on clothes.
        lemmas:
          - {lemma: voir, pos: verb, en: [to see], rank: 83}
          - {lemma: dire, pos: verb, en: [to say, to tell], rank: 59}
          - {lemma: mettre, pos: verb, en: [to put, to put on], rank: 217}
          - {lemma: écrire, pos: verb, en: [to write], rank: 289}
          - {lemma: ouvrir, pos: verb, en: [to open], rank: 409}
          - {lemma: recevoir, pos: verb, en: [to receive, to get], rank: 646}
          - {lemma: lettre, pos: noun, gender: f, en: [letter], rank: 441}
          - {lemma: photo, pos: noun, gender: f, en: [photo, picture], rank: 515}
        examples:
          - {id: 1, target: "Vous avez vu ça ?", en: ["Did you see that?"]}
          - {id: 2, target: "As-tu vu ce film ?", en: ["Have you seen this film?", "Have you seen that movie?"]}
          - {id: 3, target: "Qu'est-ce que tu as dit ?", en: ["What did you say?"]}
          - {id: 4, target: "Où as-tu mis mes clés ?", en: ["Where did you put my keys?"]}
          - {id: 5, target: "J'ai écrit une lettre.", en: ["I wrote a letter.", "I have written a letter."]}
          - {id: 6, target: "Il a ouvert la fenêtre.", en: ["He opened the window."]}
          - {id: 7, target: "J'ai reçu ta lettre hier.", en: ["I received your letter yesterday.", "I got your letter yesterday."]}
          - {id: 8, target: "Nous avons pris beaucoup de photos.", en: ["We took a lot of photos.", "We took lots of pictures."]}
      - id: fr.a2.u01.s03
        kind: grammar
        title: Went, came and stayed
        cefr: A2
        can_do: I can say where I went, when I arrived and where I was born.
        requires: [fr.a2.u01.s02]
        grammar_note: >-
          A small group of verbs, mostly about coming and going, form the passé composé
          with être instead of avoir: aller, venir, arriver, partir, rester, rentrer,
          sortir, entrer, monter, descendre, tomber, naître and mourir, and every
          reflexive verb. With être the participle agrees with the subject like an
          adjective: il est allé, elle est allée, ils sont allés, elles sont allées. Je
          suis né means I was born. Y (there) goes before the verb: j'y suis allé.
        lemmas:
