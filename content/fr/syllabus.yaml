  - id: fr.a2.u04
    title: Plans
    cefr: A2
    skills:
      - id: fr.a2.u04.s01
        kind: vocab
        title: Parties and presents
        cefr: A2
        can_do: I can talk about a party or celebration I am going to have.
        requires: [fr.a2.u03.s04]
        grammar_note: >-
          To talk about plans, use aller with an infinitive (the futur proche): nous allons
          faire une fête samedi, les enfants vont ouvrir leurs cadeaux. In the negative, ne
          and pas go around aller: je ne vais pas venir. Faire la fête is to party, and fêter
          is to celebrate something: fêter un anniversaire. Bon anniversaire ! means happy
          birthday. Inviter is to invite and also to treat someone: je t'invite (it's on me).
        lemmas:
          - {lemma: fête, pos: noun, gender: f, en: [party, celebration, holiday], rank: 550}
          - {lemma: anniversaire, pos: noun, gender: m, en: [birthday, anniversary], rank: 1005}
          - {lemma: cadeau, pos: noun, gender: m, en: [present, gift], rank: 698}
          - {lemma: inviter, pos: verb, en: [to invite], rank: 1033}
          - {lemma: fêter, pos: verb, en: [to celebrate], rank: 525}
          - {lemma: préparer, pos: verb, en: [to prepare, to get ready], rank: 817}
          - {lemma: mariage, pos: noun, gender: m, en: [wedding, marriage], rank: 1090}
        examples:
          - {id: 1, target: "Nous allons faire une fête samedi soir.", en: ["We are going to have a party on Saturday evening.", "We're going to have a party on Saturday night."]}
          - {id: 2, target: "Est-ce que vous allez l'inviter à la fête ?", en: ["Are you going to invite her to the party?", "Are you going to invite him to the party?"]}
          - {id: 3, target: "C'est quand ton anniversaire ?", en: ["When is your birthday?"]}
          - {id: 4, target: "C'est bientôt mon anniversaire.", en: ["My birthday is coming soon.", "It's my birthday soon."]}
          - {id: 5, target: "Merci pour le cadeau.", en: ["Thank you for the present.", "Thanks for the gift."]}
          - {id: 6, target: "Nous préparons une fête.", en: ["We are preparing a party.", "We're planning a party."]}
          - {id: 7, target: "Nous devrions fêter ça.", en: ["We should celebrate that.", "We should celebrate."]}
          - {id: 8, target: "Les enfants vont ouvrir leurs cadeaux.", en: ["The children are going to open their presents."]}
      - id: fr.a2.u04.s02
        kind: grammar
        title: The future
        cefr: A2
        can_do: I can say what will happen and what I hope to do one day.
        requires: [fr.a2.u04.s01]
        grammar_note: >-
          The futur simple says what will happen. For most verbs, add -ai, -as, -a, -ons, -ez,
          -ont to the infinitive: je parlerai, tu finiras; verbs in -re drop the final e: il
          prendra. Common verbs have an irregular stem with the same endings: être gives je
          serai, avoir j'aurai, aller j'irai, faire je ferai, venir je viendrai, pouvoir je
          pourrai and voir je verrai. After espérer que and je suis sûr que, French uses the
          future where English often has the present: j'espère que tu gagneras. Tout le monde
          (everyone) takes a singular verb.
        lemmas:
          - {lemma: avenir, pos: noun, gender: m, en: [future], rank: 1360}
          - {lemma: espérer, pos: verb, en: [to hope], rank: 337}
          - {lemma: vie, pos: noun, gender: f, en: [life], rank: 252}
          - {lemma: changer, pos: verb, en: [to change], rank: 385}
          - {lemma: monde, pos: noun, gender: m, en: [world, people], rank: 196}
          - {lemma: sûr, pos: adj, en: [sure, safe], rank: 297}
        examples:
          - {id: 1, target: "J'espère qu'il viendra.", en: ["I hope he will come.", "I hope he comes."]}
          - {id: 2, target: "J'espère que tu gagneras !", en: ["I hope you win!", "I hope you will win!"]}
          - {id: 3, target: "Je suis sûr que tu aimeras ça.", en: ["I'm sure you will like it.", "I am sure you'll like that."]}
          - {id: 4, target: "Tout le monde sera heureux.", en: ["Everyone will be happy.", "Everybody will be happy."]}
          - {id: 5, target: "Ça ne changera jamais.", en: ["That will never change.", "It'll never change."]}
          - {id: 6, target: "Nous espérons vous revoir à l'avenir.", en: ["We hope to see you again in the future."]}
          - {id: 7, target: "Bien sûr que j'irai.", en: ["Of course I will go.", "Of course I'll go."]}
          - {id: 8, target: "Ça va changer ma vie.", en: ["This is going to change my life.", "It will change my life."]}
      - id: fr.a2.u04.s03
        kind: grammar
        title: Me, him, her, them
        cefr: A2
        can_do: I can use small words for me, him, her and them instead of repeating a name.
        requires: [fr.a2.u04.s02]
        grammar_note: >-
          Object pronouns replace a noun and go before the verb. Direct: me, te, le, la (l'
          before a vowel), nous, vous, les: je le connais. Indirect, for à and a person: me,
          te, lui, nous, vous, leur: je lui ai demandé (I asked him or her). Donner, montrer,
          envoyer, demander, prêter and offrir take à before the person, so they use lui and
          leur. In the passé composé the pronoun goes before avoir. In a positive command it
          follows with a hyphen and me becomes moi: montrez-moi. With two pronouns, me, te,
          nous and vous come first: je te le donnerai.
        lemmas:
          - {lemma: donner, pos: verb, en: [to give], rank: 193}
          - {lemma: montrer, pos: verb, en: [to show], rank: 368}
          - {lemma: envoyer, pos: verb, en: [to send], rank: 596}
          - {lemma: demander, pos: verb, en: [to ask, to ask for], rank: 180}
          - {lemma: rappeler, pos: verb, en: [to call back, to remind], rank: 601}
          - {lemma: prêter, pos: verb, en: [to lend], rank: 595}
          - {lemma: offrir, pos: verb, en: [to give, to offer], rank: 867}
        examples:
          - {id: 1, target: "Je lui ai demandé.", en: ["I asked him.", "I asked her."]}
          - {id: 2, target: "Je te le donnerai.", en: ["I will give it to you.", "I'll give it to you."]}
          - {id: 3, target: "Veuillez me montrer votre passeport.", en: ["Please show me your passport."]}
          - {id: 4, target: "Je leur ai envoyé une lettre.", en: ["I sent them a letter."]}
          - {id: 5, target: "Pouvez-vous me l'envoyer ?", en: ["Can you send it to me?", "Could you send it to me?"]}
          - {id: 6, target: "Je te prêterai ce livre.", en: ["I will lend you this book.", "I'll lend you that book."]}
          - {id: 7, target: "Il m'a offert un cadeau.", en: ["He gave me a present.", "He gave me a gift."]}
          - {id: 8, target: "Je te rappelle.", en: ["I'll call you back.", "I will call you back."]}
      - id: fr.a2.u04.s04
        kind: function
        title: Making arrangements
        cefr: A2
        can_do: I can invite someone, accept or refuse, and agree when and where to meet.
        requires: [fr.a2.u04.s03]
        grammar_note: >-
          To invite someone, ask tu veux ... ? or vous voulez ... ?, or suggest with the nous
          form: allons manger ensemble. Accept with oui, avec plaisir ! or d'accord (OK); être
          d'accord is to agree. Say no politely with désolé (sorry), which agrees like an
          adjective: désolée, je suis occupée. C'est dommage means that's a pity. Se retrouver
          is to meet up: on se retrouve devant la gare ? À plus tard means see you later.
        lemmas:
