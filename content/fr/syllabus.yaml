  - id: fr.a1.u07
    title: Time and routine
    cefr: A1
    skills:
      - id: fr.a1.u07.s01
        kind: vocab
        title: Days of the week
        cefr: A1
        can_do: I can name the days of the week and say what day it is.
        requires: [fr.a1.u06.s04]
        grammar_note: >-
          The days are masculine and take no capital letter. Samedi on its own means on
          Saturday (this coming one); le samedi means on Saturdays, every Saturday. Ask
          the day with quel jour sommes-nous ? and answer c'est lundi or nous sommes
          lundi. Demain is tomorrow, and the week starts on lundi.
