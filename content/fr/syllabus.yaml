          bedroom, and in a hotel a room. La cuisine is the kitchen and also cooking. At
          home is à la maison or chez moi; chez works with any person: chez toi, chez nous,
          chez Paul. Dans means in or into: je suis dans la cuisine. Je vais au lit means I
          am going to bed.
