  - id: fr.a1.u05
    title: Shopping
    cefr: A1
    skills:
      - id: fr.a1.u05.s01
        kind: vocab
        title: Clothes
        cefr: A1
        can_do: I can name clothes and say what someone is wearing.
        requires: [fr.a1.u04.s04]
        grammar_note: >-
          Ce, cet, cette and ces mean this or that, these or those: ce sac, cet homme
          (before a vowel), cette chemise, ces chaussures. Porter means to wear as well as
          to carry: il porte un chapeau. Un pantalon (trousers) is singular in French, and
          un vêtement is one item: clothes are des vêtements.
