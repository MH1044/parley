          - {lemma: jeudi, pos: noun, gender: m, en: [Thursday], rank: 4730}
          - {lemma: vendredi, pos: noun, gender: m, en: [Friday], rank: 2279}
          - {lemma: samedi, pos: noun, gender: m, en: [Saturday], rank: 2031}
          - {lemma: dimanche, pos: noun, gender: m, en: [Sunday], rank: 1020}
          - {lemma: semaine, pos: noun, gender: f, en: [week], rank: 375}
          - {lemma: jour, pos: noun, gender: m, en: [day], rank: 206}
          - {lemma: demain, pos: adv, en: [tomorrow], rank: 281}
        examples:
          - {id: 1, target: "Aujourd'hui, c'est lundi.", en: ["Today is Monday.", "It is Monday today."]}
          - {id: 2, target: "Demain, c'est dimanche.", en: ["Tomorrow is Sunday."]}
          - {id: 3, target: "Quel jour sommes-nous ?", en: ["What day is it?", "What day is it today?"]}
          - {id: 4, target: "La semaine a sept jours.", en: ["A week has seven days.", "The week has seven days."]}
          - {id: 5, target: "Que fais-tu samedi ?", en: ["What are you doing on Saturday?"]}
          - {id: 6, target: "Le jeudi, nous allons au cinéma.", en: ["On Thursdays we go to the cinema.", "On Thursdays we go to the movies."]}
          - {id: 7, target: "Que faites-vous le vendredi ?", en: ["What do you do on Fridays?"]}
          - {id: 8, target: "On va au marché le mardi.", en: ["We go to the market on Tuesdays."]}
      - id: fr.a1.u07.s02
        kind: grammar
        title: Telling the time
        cefr: A1
        can_do: I can ask and tell the time and say when something starts.
        requires: [fr.a1.u07.s01]
        grammar_note: >-
          Ask the time with quelle heure est-il ? and answer il est ... heure(s): il est
          une heure, il est trois heures. Add et quart for a quarter past, et demie for
          half past and moins le quart for a quarter to: il est huit heures et quart. Midi
          is noon and minuit midnight. At a time is à: à huit heures. Le matin,
          l'après-midi and le soir are the morning, the afternoon and the evening.
          Timetables use the 24-hour clock: vingt heures (8 pm).
        lemmas:
