          - {id: 5, target: "Quelle est ta couleur préférée ?", en: ["What is your favourite colour?", "What is your favorite color?"]}
          - {id: 6, target: "La pomme est verte.", en: ["The apple is green."]}
          - {id: 7, target: "Le noir te va bien.", en: ["Black suits you.", "Black looks good on you."]}
          - {id: 8, target: "Je cherche une chemise blanche.", en: ["I am looking for a white shirt."]}
      - id: fr.a1.u05.s03
        kind: function
        title: Buying things
        cefr: A1
        can_do: I can ask about the price and size, try something on and pay.
