          - {id: 2, target: "Le printemps est ma saison préférée.", en: ["Spring is my favourite season.", "Spring is my favorite season."]}
          - {id: 3, target: "Il fait très chaud ici en été.", en: ["It is very hot here in summer.", "It's very hot here in the summer."]}
          - {id: 4, target: "Nous avons beaucoup de neige en hiver.", en: ["We have a lot of snow in winter.", "We get a lot of snow in the winter."]}
          - {id: 5, target: "Il y a du vent en automne.", en: ["It is windy in autumn.", "It's windy in the fall."]}
          - {id: 6, target: "Ils iront en France au printemps.", en: ["They will go to France in the spring."]}
          - {id: 7, target: "Il fait frais aujourd'hui.", en: ["It is cool today."]}
          - {id: 8, target: "Il fait vingt degrés.", en: ["It is twenty degrees."]}
      - id: fr.a2.u05.s03
        kind: vocab
        title: Months and dates
        cefr: A2
        can_do: I can say the date and in which month something happens.
        requires: [fr.a2.u05.s02]
        grammar_note: >-
          The months are masculine and take no capital letter. In a month is en or au mois de:
