          - {id: 7, target: "Quelles langues connaissez-vous ?", en: ["What languages do you know?", "Which languages do you know?"]}
          - {id: 8, target: "Je ne connais personne ici.", en: ["I don't know anyone here.", "I don't know anybody here."]}
      - id: fr.a2.u03.s04
        kind: function
        title: The job interview
        cefr: A2
        can_do: I can answer simple questions in a job interview and ask about the job.
        requires: [fr.a2.u03.s03]
        grammar_note: >-
          In an interview both people say vous. Pourquoi ? (why?) is answered with parce que
          (because), which becomes parce qu' before a vowel. Intéresser works like English
          interest: ce poste m'intéresse (this job interests me). Sérieux, said of a person,
          means reliable and hard-working. Je suis disponible means I am available, and
          quelles sont vos qualités ? asks about your strengths. To thank someone politely,
          say je vous remercie.
