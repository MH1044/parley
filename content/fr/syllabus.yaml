      - id: fr.a1.u03.s04
        kind: grammar
        title: Hungry and thirsty
        cefr: A1
        can_do: I can say that I am hungry, thirsty, hot or cold and talk about meals.
        requires: [fr.a1.u03.s03]
        grammar_note: >-
          French uses avoir, not être, for hunger, thirst, heat and cold: j'ai faim (I am
          hungry), j'ai soif, j'ai chaud, j'ai froid. For food and drink, use être: le café
          est froid. Bon (good) becomes bonne before a feminine noun. The meals are le
          petit déjeuner (breakfast), le déjeuner (lunch) and le dîner (dinner);
          déjeuner and dîner are also verbs, to have lunch and to have dinner. To have a
          meal is prendre: prendre le petit déjeuner.
