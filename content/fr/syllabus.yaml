          - {lemma: occupé, pos: adj, en: [busy], rank: 429}
          - {lemma: avec plaisir, pos: expr, en: [with pleasure, I'd love to], rank: null}
          - {lemma: retrouver, pos: verb, en: [to meet up with, to find again], rank: 1664}
          - {lemma: dommage, pos: noun, gender: m, en: [pity, shame], rank: 2302}
          - {lemma: à plus tard, pos: expr, en: [see you later], rank: null}
          - {lemma: ensemble, pos: adv, en: [together], rank: 578}
        examples:
          - {id: 1, target: "Allons manger ensemble.", en: ["Let's go and eat together.", "Let's eat together."]}
          - {id: 2, target: "Oui, avec plaisir !", en: ["Yes, I'd love to!", "Yes, with pleasure!"]}
          - {id: 3, target: "Ce serait avec plaisir, mais je ne peux pas.", en: ["I'd love to, but I can't."]}
          - {id: 4, target: "Désolée, je suis occupée samedi.", en: ["Sorry, I'm busy on Saturday.", "Sorry, I am busy on Saturday."]}
          - {id: 5, target: "Retrouvons-nous demain.", en: ["Let's meet tomorrow.", "Let's get together tomorrow."]}
          - {id: 6, target: "On se retrouve devant la gare ?", en: ["Shall we meet in front of the station?", "Shall we meet outside the station?"]}
          - {id: 7, target: "C'est dommage.", en: ["That's a pity.", "It's a shame."]}
          - {id: 8, target: "D'accord, à plus tard !", en: ["OK, see you later!", "All right, see you later!"]}
  - id: fr.a2.u05
    title: Weather and seasons
    cefr: A2
    skills:
      - id: fr.a2.u05.s01
        kind: vocab
        title: The weather
        cefr: A2
        can_do: I can say what the weather is like and understand a simple forecast.
        requires: [fr.a2.u04.s04]
        grammar_note: >-
          Most weather phrases start with il, which here means it: il pleut (it is raining),
          il neige, il fait beau, il fait mauvais, il fait froid. Il y a du soleil, du vent or
          des nuages says that it is sunny, windy or cloudy. Pleuvoir and neiger have only an
          il form: il a plu, il va pleuvoir, il neigera. Quel temps fait-il ? asks what the
          weather is like; le temps is the weather here.
        lemmas:
          - {lemma: soleil, pos: noun, gender: m, en: [sun], rank: 701}
          - {lemma: pluie, pos: noun, gender: f, en: [rain], rank: 920}
          - {lemma: neige, pos: noun, gender: f, en: [snow], rank: 796}
          - {lemma: vent, pos: noun, gender: m, en: [wind], rank: 1138}
          - {lemma: nuage, pos: noun, gender: m, en: [cloud], rank: 1936}
          - {lemma: pleuvoir, pos: verb, en: [to rain], rank: 541}
          - {lemma: neiger, pos: verb, en: [to snow], rank: 645}
          - {lemma: ciel, pos: noun, gender: m, en: [sky], rank: 968}
          - {lemma: mauvais, pos: adj, en: [bad], rank: 329}
          - {lemma: parapluie, pos: noun, gender: m, en: [umbrella], rank: 1113}
        examples:
          - {id: 1, target: "Il fait mauvais temps.", en: ["The weather is bad."]}
          - {id: 2, target: "Il y a du soleil.", en: ["It is sunny."]}
          - {id: 3, target: "Il pleut aujourd'hui.", en: ["It is raining today."]}
          - {id: 4, target: "Il va pleuvoir.", en: ["It is going to rain."]}
          - {id: 5, target: "Il neige maintenant.", en: ["It is snowing now."]}
          - {id: 6, target: "Il y a du vent aujourd'hui.", en: ["It is windy today."]}
          - {id: 7, target: "Le ciel est bleu.", en: ["The sky is blue."]}
          - {id: 8, target: "Prends un parapluie.", en: ["Take an umbrella."]}
      - id: fr.a2.u05.s02
        kind: vocab
        title: Seasons
        cefr: A2
        can_do: I can talk about the seasons and the temperature.
        requires: [fr.a2.u05.s01]
        grammar_note: >-
          The seasons are masculine: le printemps, l'été, l'automne, l'hiver. In a season is
          en été, en automne and en hiver, but au printemps. Faire is used for temperature
          too: il fait frais (it is cool), il fait doux (it is mild), il fait vingt degrés.
          French temperatures are in degrees Celsius. Préféré (favourite) follows its noun and
          agrees: ma saison préférée.
