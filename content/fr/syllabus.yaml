          - {lemma: printemps, pos: noun, gender: m, en: [spring], rank: 1704}
          - {lemma: été, pos: noun, gender: m, en: [summer], rank: 101}
          - {lemma: automne, pos: noun, gender: m, en: [autumn, fall], rank: 2462}
          - {lemma: hiver, pos: noun, gender: m, en: [winter], rank: 1211}
          - {lemma: température, pos: noun, gender: f, en: [temperature], rank: 2262}
          - {lemma: degré, pos: noun, gender: m, en: [degree], rank: 3690}
          - {lemma: doux, pos: adj, en: [mild, soft, sweet], rank: 1785}
          - {lemma: frais, pos: adj, en: [cool, fresh], rank: 1418}
        examples:
