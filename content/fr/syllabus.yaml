          - {lemma: sérieux, pos: adj, en: [serious, reliable], rank: 1086}
          - {lemma: qualité, pos: noun, gender: f, en: [quality, strength], rank: 2617}
          - {lemma: remercier, pos: verb, en: [to thank], rank: 1154}
        examples:
