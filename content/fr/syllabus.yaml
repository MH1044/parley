      - id: fr.a1.u06.s04
        kind: grammar
        title: Floors and neighbours
        cefr: A1
        can_do: I can say which floor I live on and put things in order.
        requires: [fr.a1.u06.s03]
        grammar_note: >-
          Ordinal numbers add -ième to the number: deuxième, troisième, quatrième; a final
          e is dropped (quatre, quatrième), cinq becomes cinquième and neuf neuvième.
