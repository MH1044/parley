          - {lemma: minuit, pos: noun, gender: m, en: [midnight], rank: 2951}
          - {lemma: demi, pos: adj, en: [half], rank: 1518}
          - {lemma: quart, pos: noun, gender: m, en: [quarter], rank: 4346}
          - {lemma: matin, pos: noun, gender: m, en: [morning], rank: 423}
          - {lemma: soir, pos: noun, gender: m, en: [evening], rank: 336}
          - {lemma: après, pos: prep, en: [after], rank: 272}
          - {lemma: commencer, pos: verb, en: [to start, to begin], rank: 284}
          - {lemma: finir, pos: verb, en: [to finish, to end], rank: 424}
        examples:
