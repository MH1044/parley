          Adjectives for people agree like other adjectives: il est marié, elle est
          mariée. Some have a special feminine form: heureux becomes heureuse, gentil
          becomes gentille and vieux becomes vieille. For hair and eyes, French uses avoir
          and les: elle a les yeux bleus (she has blue eyes). Un œil is one eye and des
          yeux is the plural. Les cheveux (hair) is plural, so the verb is too: ses
          cheveux sont gris.
