  fr: {setting_en: the reception of a small hotel in Lyon in the evening, opening: "Bonsoir ! Vous avez une réservation ?", opening_en: "Good evening! Do you have a reservation?", skills: [fr.a1.u08.s01, fr.a1.u08.s02, fr.a1.u08.s03, fr.a1.u08.s04]}
  de: {setting_en: the reception of a small hotel in Berlin in the evening, opening: "Guten Abend! Wie ist Ihr Name, bitte?", opening_en: "Good evening! What is your name, please?", skills: [de.a1.u07.s02, de.a1.u08.s01, de.a1.u08.s02, de.a1.u08.s03, de.a1.u08.s04]}
