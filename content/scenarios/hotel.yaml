schema: parley.scenario/1
id: hotel
cefr: A1
title_en: "At the hotel reception"
partner_role_en: "the receptionist"
learner_role_en: "a guest"
turn_cap: 12
goals:
  - {id: greet, text_en: "Greet the receptionist"}
  - {id: booking, text_en: "Say you have a booking and give your name"}
  - {id: nights, text_en: "Say how many nights you are staying"}
  - {id: breakfast, text_en: "Ask what time breakfast is"}
  - {id: room, text_en: "Ask for your room number or key"}
languages:
