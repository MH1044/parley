  fr: {setting_en: a street in the centre of Paris in the afternoon, opening: "Bonjour ! Je peux vous aider ?", opening_en: "Hello! Can I help you?", skills: [fr.a1.u04.s01, fr.a1.u04.s02, fr.a1.u04.s03, fr.a1.u04.s04]}
  de: {setting_en: a street in the centre of Hamburg in the afternoon, opening: "Ja, bitte? Kann ich Ihnen helfen?", opening_en: "Yes? Can I help you?", skills: [de.a1.u04.s01, de.a1.u04.s02, de.a1.u04.s03, de.a1.u04.s04]}
