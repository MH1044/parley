schema: parley.scenario/1
id: directions
cefr: A1
title_en: "Asking the way"
partner_role_en: "a passer-by"
learner_role_en: "a visitor to the town"
turn_cap: 10
goals:
  - {id: attention, text_en: "Get the person's attention politely"}
  - {id: ask_place, text_en: "Ask where a place is"}
  - {id: check_way, text_en: "Check the way (left, right or straight on)"}
  - {id: ask_far, text_en: "Ask whether it is far"}
  - {id: thank, text_en: "Thank them and say goodbye"}
languages:
