          - {id: 7, target: "Ich habe nicht viel Geld.", en: ["I don't have much money.", "I don't have a lot of money."]}
          - {id: 8, target: "Gibt es hier ein Geschäft?", en: ["Is there a shop here?", "Is there a store here?"]}
      - id: de.a1.u05.s04
        kind: grammar
        title: Saying what you think
        cefr: A1
        can_do: I can say whether I like something and whether it fits.
        requires: [de.a1.u05.s03]
        grammar_note: >-
          Gefallen works the other way round from like: the thing is the subject and the
          person is in the dative. Das gefällt mir is literally that pleases me, so I like
          it; gefällt es dir? or gefällt es Ihnen? asks do you like it? Passen (to fit)
          works the same way: die Hose passt mir nicht. Finden gives an opinion: ich finde
