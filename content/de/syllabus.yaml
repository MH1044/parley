          - {lemma: Krankenhaus, pos: noun, gender: "n", en: [hospital], rank: 934}
          - {lemma: Ruhe, pos: noun, gender: f, en: [rest, quiet], rank: 1613}
          - {lemma: gute Besserung, pos: expr, en: [get well soon], rank: null}
        examples:
