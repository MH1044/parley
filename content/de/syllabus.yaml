          - {id: 4, target: "Am Sonntag arbeite ich nicht.", en: ["I don't work on Sunday.", "I'm not working on Sunday."]}
          - {id: 5, target: "Was machst du am Wochenende?", en: ["What are you doing at the weekend?", "What are you doing this weekend?"]}
          - {id: 6, target: "Eine Woche hat sieben Tage.", en: ["A week has seven days.", "There are seven days in a week."]}
          - {id: 7, target: "Wir sehen uns morgen!", en: ["See you tomorrow!"]}
          - {id: 8, target: "Am Dienstag und am Freitag spiele ich Fußball.", en: ["I play football on Tuesdays and Fridays.", "On Tuesday and Friday I play football."]}
      - id: de.a1.u07.s02
        kind: grammar
        title: Telling the time
        cefr: A1
        can_do: I can ask and tell the time and say when something starts.
        requires: [de.a1.u07.s01]
        grammar_note: >-
          Ask the time with wie spät ist es? and answer es ist acht Uhr. Halb looks forward
          to the next hour: halb acht is half past seven (7.30). Viertel nach zwei is a
          quarter past two and Viertel vor acht a quarter to eight. At a time is um: um acht
          Uhr. Timetables use the 24-hour clock: um 20 Uhr. Zu spät means late: Tom kommt
          immer zu spät. Beginnen (to begin) is regular in the present: der Film beginnt.
