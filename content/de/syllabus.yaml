          - {lemma: hinter, pos: prep, en: [behind], rank: 773}
          - {lemma: zwischen, pos: prep, en: [between], rank: 908}
          - {lemma: Wand, pos: noun, gender: f, en: [wall], rank: 1643}
          - {lemma: Bild, pos: noun, gender: "n", en: [picture], rank: 661}
          - {lemma: Sofa, pos: noun, gender: "n", en: [sofa, couch], rank: 1851}
          - {lemma: Schrank, pos: noun, gender: m, en: [cupboard, wardrobe], rank: 3699}
        examples:
          - {id: 1, target: "Das Bild hängt an der Wand.", en: ["The picture is hanging on the wall.", "The picture is on the wall."]}
          - {id: 2, target: "Er liegt auf dem Sofa.", en: ["He's lying on the sofa.", "He is lying on the couch."]}
          - {id: 3, target: "Leg das Buch auf den Tisch!", en: ["Put the book on the table!"]}
          - {id: 4, target: "Der Schrank steht neben dem Fenster.", en: ["The cupboard is next to the window.", "The wardrobe is beside the window."]}
          - {id: 5, target: "Die Katze schläft unter dem Tisch.", en: ["The cat is sleeping under the table.", "The cat sleeps under the table."]}
          - {id: 6, target: "Tom ist hinter dir.", en: ["Tom is behind you."]}
