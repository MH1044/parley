  - id: de.a2.u06
    title: Free time
    cefr: A2
    skills:
      - id: de.a2.u06.s01
        kind: vocab
        title: Hobbies
        cefr: A2
        can_do: I can talk about my hobbies and what I do in my free time.
        requires: [de.a2.u05.s04]
        grammar_note: >-
          Spielen is for games, sports and instruments, with no article before an
          instrument: ich spiele Gitarre, sie spielt Klavier. Gehen with a second verb says
          you go and do something: wir gehen wandern, gehen wir spazieren? (shall we go for
          a walk?). Gern after the verb says you like doing it: ich fotografiere gern;
          gerne is the same word. In deiner Freizeit means in your free time, and Ihr Hobby
          is your hobby, for Sie.
