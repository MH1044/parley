      - id: de.a1.u04.s04
        kind: grammar
        title: Getting around
        cefr: A1
        can_do: I can say how I get somewhere, by bus, train or bike or on foot.
        requires: [de.a1.u04.s03]
        grammar_note: >-
          Fahren (to go by vehicle, to drive, to ride) changes its vowel: du fährst, er
          fährt. Gehen is to go on foot: ich gehe zu Fuß. Mit (by, with) is always followed
          by the dative: der Bus becomes mit dem Bus, das Fahrrad mit dem Fahrrad. Zu takes
