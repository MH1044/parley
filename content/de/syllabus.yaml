      - id: de.a2.u06.s03
        kind: grammar
        title: Myself and yourself
        cefr: A2
        can_do: I can use reflexive verbs to talk about my routine, interests and feelings.
        requires: [de.a2.u06.s02]
        grammar_note: >-
          Reflexive verbs need a pronoun that refers back to the subject: ich beeile mich,
          du beeilst dich, er beeilt sich, wir beeilen uns, ihr beeilt euch, Sie beeilen
