          - {lemma: ähnlich, pos: adj, en: [similar, alike], rank: 2058}
        examples:
          - {id: 1, target: "Wie sieht er aus?", en: ["What does he look like?"]}
          - {id: 2, target: "Du siehst gut aus!", en: ["You look good!", "You're looking well!"]}
          - {id: 3, target: "Maria hat lange Haare.", en: ["Maria has long hair."]}
