          - {id: 7, target: "Maria sieht ihrer Mutter ähnlich.", en: ["Maria looks like her mother.", "Maria takes after her mother."]}
          - {id: 8, target: "Sie hat ein hübsches Gesicht.", en: ["She has a pretty face."]}
      - id: de.a2.u07.s04
        kind: grammar
        title: Where things are
        cefr: A2
        can_do: I can say where things are in a room and where I put them.
        requires: [de.a2.u07.s03]
        grammar_note: >-
          The nine two-way prepositions (in, an, auf, über, unter, vor, hinter, neben,
          zwischen) take the dative for where something is and the accusative for where it
          is put. German has pairs of verbs for this: liegen (to lie, to be lying) with the
          dative and legen (to lay, to put down) with the accusative: das Buch liegt auf dem
          Tisch, leg das Buch auf den Tisch! Stehen and stellen work the same way for
          upright things, and hängen covers both: das Bild hängt an der Wand, ich hänge das
          Bild an die Wand.
        lemmas:
