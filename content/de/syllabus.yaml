          - {id: 6, target: "Wir feiern am Samstag.", en: ["We're celebrating on Saturday.", "We're having a party on Saturday."]}
          - {id: 7, target: "Wann ist die Hochzeit?", en: ["When is the wedding?", "When's the wedding?"]}
          - {id: 8, target: "Herzlichen Glückwunsch zum Geburtstag!", en: ["Happy birthday!", "Many happy returns!"]}
      - id: de.a2.u04.s03
        kind: grammar
        title: Where to, and where
        cefr: A2
        can_do: I can say where I am going and where I am or was, in town or in the country.
        requires: [de.a2.u04.s02]
        grammar_note: >-
          Nine prepositions take the accusative for where to and the dative for where: in,
          an, auf, über, unter, vor, hinter, neben and zwischen. Wohin? (where to?) takes
          the accusative: wir gehen in die Berge, an den See, ins Ausland. Wo? (where?)
          takes the dative: ich war in den Bergen, am Strand, auf der Insel. Use an for
          water and its edge (am See, am Meer, am Fluss), auf for islands and the
          countryside (auf dem Land) and in for mountains, woods and villages.
        lemmas:
