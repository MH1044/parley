          - {id: 6, target: "Es ist an der Ecke.", en: ["It's at the corner.", "It's on the corner."]}
          - {id: 7, target: "Geradeaus und dann nach links!", en: ["Straight on and then left!", "Go straight ahead and then turn left."]}
