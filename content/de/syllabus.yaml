          - {lemma: schenken, pos: verb, en: [to give as a present], rank: 1035}
          - {lemma: feiern, pos: verb, en: [to celebrate, to party], rank: 892}
          - {lemma: Hochzeit, pos: noun, gender: f, en: [wedding], rank: 2440}
          - {lemma: herzlichen Glückwunsch, pos: expr, en: [congratulations], rank: null}
        examples:
          - {id: 1, target: "Ich möchte dich zu meiner Party einladen.", en: ["I'd like to invite you to my party."]}
          - {id: 2, target: "Danke für die Einladung!", en: ["Thanks for the invitation!", "Thank you for inviting me!"]}
          - {id: 3, target: "Was soll ich mitbringen?", en: ["What should I bring?", "What shall I bring?"]}
