          - {id: 3, target: "Was suchen Sie?", en: ["What are you looking for?"]}
          - {id: 4, target: "Ich kann das Hotel nicht finden.", en: ["I can't find the hotel.", "I cannot find the hotel."]}
          - {id: 5, target: "Wissen Sie, wo die Post ist?", en: ["Do you know where the post office is?"]}
          - {id: 6, target: "Ist es weit von hier?", en: ["Is it far from here?"]}
