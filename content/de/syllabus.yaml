          - {lemma: perfekt, pos: adj, en: [perfect], rank: 1769}
        examples:
          - {id: 1, target: "Das gefällt mir.", en: ["I like that.", "I like it."]}
          - {id: 2, target: "Gefällt es dir?", en: ["Do you like it?"]}
          - {id: 3, target: "Ich finde seinen Hut hässlich.", en: ["I think his hat is ugly.", "I find his hat ugly."]}
          - {id: 4, target: "Die Hose passt nicht.", en: ["The trousers don't fit.", "These trousers don't fit."]}
          - {id: 5, target: "Meine Schuhe passen mir nicht sehr gut.", en: ["My shoes don't fit me very well."]}
          - {id: 6, target: "Das ist sehr schön.", en: ["It's very beautiful.", "That's very nice."]}
