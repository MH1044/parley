      - id: de.a1.u04.s03
        kind: function
        title: Directions
        cefr: A1
        can_do: I can understand and give simple directions.
        requires: [de.a1.u04.s02]
        grammar_note: >-
          Directions use the polite imperative, with the verb first and then Sie: gehen Sie
          geradeaus! nehmen Sie die Straße links. With du, use the verb on its own: geh,
          nimm. Nach links and nach rechts mean to the left and to the right; links and
          rechts on their own mean on the left and on the right. Immer geradeaus is keep
          straight on, an der Ecke at the corner, dann then. Die erste Straße is the first
          street.
