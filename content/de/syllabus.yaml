        cefr: A2
        can_do: I can give my opinion and say what I hope or know.
        requires: [de.a2.u03.s02]
        grammar_note: >-
          Dass (that) also sends the verb to the end, after a comma: ich glaube, dass er
          recht hat. English often leaves out that; German can too, but then the verb stays
          second: ich glaube, er hat recht. Glauben, denken and meinen all give an opinion,
          and ich glaube nicht means I don't think so. Recht haben is to be right: du hast
          recht. Sicher means sure: bist du sicher? Danke, dass Sie gekommen sind thanks
          someone for coming.
