  - id: de.a2.u07
    title: Comparing and describing
    cefr: A2
    skills:
      - id: de.a2.u07.s01
        kind: grammar
        title: Bigger and better
        cefr: A2
        can_do: I can compare two people or things.
        requires: [de.a2.u06.s04]
        grammar_note: >-
          Add -er to an adjective to compare, and than is als: Tom ist älter als ich. Many
          short adjectives also add an umlaut: alt, älter; groß, größer; jung, jünger; kurz,
          kürzer. A few are irregular: gut, besser; viel, mehr; gern, lieber. Genauso ...
          wie (just as ... as) says two things are equal: ich bin genauso alt wie du. Viel
          before a comparative means much: das ist viel einfacher. Schwer means hard or
          heavy, leicht easy or light.
        lemmas:
          - {lemma: als, pos: conj, en: [than, as, when], rank: 92}
          - {lemma: genauso, pos: adv, en: [just as, exactly the same], rank: 1185}
          - {lemma: schwer, pos: adj, en: [hard, difficult, heavy], rank: 440}
          - {lemma: leicht, pos: adj, en: [easy, light], rank: 531}
          - {lemma: einfach, pos: adj, en: [simple, easy], rank: 276}
          - {lemma: langsam, pos: adj, en: [slow, slowly], rank: 776}
          - {lemma: kurz, pos: adj, en: [short], rank: 607}
        examples:
          - {id: 1, target: "Tom ist älter als ich.", en: ["Tom is older than me.", "Tom is older than I am."]}
          - {id: 2, target: "Ist Französisch schwerer als Englisch?", en: ["Is French harder than English?", "Is French more difficult than English?"]}
          - {id: 3, target: "Er schwimmt besser als ich.", en: ["He swims better than I do.", "He's a better swimmer than me."]}
          - {id: 4, target: "Können Sie langsamer sprechen?", en: ["Can you speak more slowly?", "Could you speak more slowly?"]}
          - {id: 5, target: "Das ist viel einfacher.", en: ["That's much easier.", "This is much simpler."]}
          - {id: 6, target: "Die Tage werden kürzer.", en: ["The days are getting shorter."]}
          - {id: 7, target: "Leichter gesagt als getan.", en: ["Easier said than done."]}
          - {id: 8, target: "Ich bin genauso alt wie du.", en: ["I'm just as old as you.", "I'm the same age as you."]}
      - id: de.a2.u07.s02
        kind: grammar
        title: The best of all
        cefr: A2
        can_do: I can say which is the biggest, the best or my favourite.
        requires: [de.a2.u07.s01]
        grammar_note: >-
          The superlative adds -st (-est after d, t, s or z) and the usual adjective ending:
          das höchste Gebäude, die schönste Stadt der Welt (in the world). After a verb,
          use am ...sten: wer läuft am schnellsten? Adjectives that take an umlaut in the
          comparative take it here too: alt, älter, am ältesten. Irregular ones: gut,
          besser, am besten; gern, lieber, am liebsten; viel, mehr, am meisten; hoch,
          höher, am höchsten. Was isst du am liebsten? asks what you like eating best.
        lemmas:
          - {lemma: beste, pos: adj, en: [best], rank: 888}
          - {lemma: hoch, pos: adj, en: [high, tall], rank: 630}
          - {lemma: Welt, pos: noun, gender: f, en: [world], rank: 460}
          - {lemma: Gebäude, pos: noun, gender: "n", en: [building], rank: 1274}
          - {lemma: berühmt, pos: adj, en: [famous], rank: 1206}
          - {lemma: Klasse, pos: noun, gender: f, en: [class], rank: 1321}
        examples:
          - {id: 1, target: "Wie heißt der höchste Berg der Welt?", en: ["What is the highest mountain in the world called?", "What's the name of the highest mountain in the world?"]}
          - {id: 2, target: "Das ist das höchste Gebäude der Stadt.", en: ["This is the tallest building in the city.", "That's the town's tallest building."]}
          - {id: 3, target: "Wer läuft in deiner Klasse am schnellsten?", en: ["Who runs fastest in your class?", "Who is the fastest runner in your class?"]}
          - {id: 4, target: "Das ist das berühmteste Museum in Berlin.", en: ["That's the most famous museum in Berlin."]}
          - {id: 5, target: "Was ist die schönste Stadt der Welt?", en: ["What is the most beautiful city in the world?"]}
          - {id: 6, target: "Sie ist meine beste Freundin.", en: ["She's my best friend.", "She is my best friend."]}
          - {id: 7, target: "Erfahrung ist der beste Lehrer.", en: ["Experience is the best teacher."]}
      - id: de.a2.u07.s03
        kind: vocab
        title: What people look like
        cefr: A2
        can_do: I can describe what someone looks like.
        requires: [de.a2.u07.s02]
        grammar_note: >-
          Aussehen (to look, to appear) is separable: wie sieht er aus? (what does he look
          like?), du siehst gut aus (you look good). Ähnlich sehen with the dative means to
          look like someone: Maria sieht ihrer Mutter ähnlich. Haare is usually plural for
          the hair on your head: sie hat lange Haare. Eine Brille is a pair of glasses,
          singular in German: er trägt eine Brille. Hübsch means pretty or good-looking.
