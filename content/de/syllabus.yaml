  - id: de.a1.u06
    title: Home and family
    cefr: A1
    skills:
      - id: de.a1.u06.s01
        kind: vocab
        title: Family
        cefr: A1
        can_do: I can name the people in my family.
        requires: [de.a1.u05.s04]
        grammar_note: >-
          Many family words add an umlaut in the plural: der Bruder, die Brüder; die
          Mutter, die Mütter; die Tochter, die Töchter. Das Kind becomes die Kinder. Mein
