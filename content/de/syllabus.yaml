      - id: de.a2.u08.s04
        kind: function
        title: Telling about an experience
        cefr: A2
        can_do: I can tell someone about something that happened to me and how I felt.
        requires: [de.a2.u08.s03]
        grammar_note: >-
          When you tell a story, use the Perfekt for what happened and war and hatte for how
          things were: ich hatte einen Unfall, ich hatte Angst, es war unglaublich. Sich
          erinnern an (to remember) is reflexive and takes the accusative: ich erinnere
          mich an alles. Vergessen (to forget) is not reflexive: ich habe es vergessen. Glück
          haben is to be lucky and Pech haben to be unlucky. Angst haben means to be
          afraid: hab keine Angst!
        lemmas:
          - {lemma: erinnern, pos: verb, en: [to remind, to remember], rank: 512}
          - {lemma: vergessen, pos: verb, en: [to forget], rank: 319}
          - {lemma: Unfall, pos: noun, gender: m, en: [accident], rank: 889}
          - {lemma: Angst, pos: noun, gender: f, en: [fear], rank: 407}
          - {lemma: Pech, pos: noun, gender: "n", en: [bad luck], rank: 4866}
          - {lemma: unglaublich, pos: adj, en: [unbelievable, incredible, amazing], rank: 2927}
          - {lemma: wunderbar, pos: adj, en: [wonderful], rank: 3030}
          - {lemma: gefährlich, pos: adj, en: [dangerous], rank: 1149}
        examples:
          - {id: 1, target: "Erinnerst du dich an mich?", en: ["Do you remember me?"]}
          - {id: 2, target: "Ich erinnere mich an alles.", en: ["I remember everything.", "I remember it all."]}
          - {id: 3, target: "Ich habe es vergessen.", en: ["I forgot.", "I've forgotten it."]}
