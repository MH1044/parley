          - {lemma: doch, pos: adv, en: [after all, why don't you], rank: 255}
          - {lemma: abholen, pos: verb, en: [to pick up, to collect], rank: 2240, separable: ab}
          - {lemma: absagen, pos: verb, en: [to cancel, to call off], rank: 2565, separable: ab}
          - {lemma: bis dann, pos: expr, en: [see you then, see you], rank: null}
        examples:
