  - id: de.a1.u07
    title: Time and routine
    cefr: A1
    skills:
      - id: de.a1.u07.s01
        kind: vocab
        title: Days of the week
        cefr: A1
        can_do: I can name the days of the week and say on which day something happens.
        requires: [de.a1.u06.s04]
        grammar_note: >-
          The days of the week are all der words: der Montag, der Sonntag. On a day is am
          (an dem): am Montag, am Wochenende. With a small letter and an -s, sonntags means
          on Sundays, every Sunday. Heute is today and morgen tomorrow; der Morgen, with a
          capital, is the morning. Wir sehen uns morgen! means see you tomorrow.
        lemmas:
