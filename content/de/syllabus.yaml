          - {id: 4, target: "Was soll ich tun?", en: ["What should I do?", "What am I supposed to do?"]}
          - {id: 5, target: "Der Arzt sagt, ich soll im Bett bleiben.", en: ["The doctor says I should stay in bed.", "The doctor says I'm supposed to stay in bed."]}
          - {id: 6, target: "Sie müssen sofort ins Krankenhaus.", en: ["You have to go to hospital immediately.", "You need to go to the hospital right away."]}
          - {id: 7, target: "Tom braucht jetzt Ruhe.", en: ["Tom needs rest now.", "Tom needs some rest now."]}
          - {id: 8, target: "Gute Besserung, Anna!", en: ["Get well soon, Anna!"]}
  - id: de.a2.u03
    title: Work
    cefr: A2
    skills:
      - id: de.a2.u03.s01
        kind: vocab
        title: Jobs and the workplace
        cefr: A2
        can_do: I can talk about jobs, the people I work with and where I have worked.
        requires: [de.a2.u02.s04]
        grammar_note: >-
          Von Beruf adds by profession: er ist von Beruf Arzt. Most job words add -in for a
          woman: der Chef, die Chefin; der Kollege, die Kollegin; der Kellner, die
          Kellnerin; der Polizist, die Polizistin. Bei says where you work: ich arbeite bei
          einer Bank, ich habe drei Jahre bei einer großen Firma gearbeitet. Die Stelle is a
          job or position you hold; die Arbeit is work in general. Verdienen means to earn:
          sie verdient gut.
        lemmas:
