  - id: de.a2.u08
    title: Experiences
    cefr: A2
    skills:
      - id: de.a2.u08.s01
        kind: grammar
        title: Already, not yet, never
        cefr: A2
        can_do: I can say what I have already done, not done yet or never done.
        requires: [de.a2.u07.s04]
        grammar_note: >-
          Schon (already) and noch nicht (not yet) often go with the Perfekt: hast du schon
          gegessen? ich habe noch nicht gefrühstückt. In a question, schon also means yet.
          Schon mal, short for schon einmal, asks about experience: warst du schon mal im
          Ausland? (have you ever been abroad?). Nie means never: das habe ich nie gesagt,
          and noch nie means never so far: ich war noch nie in Berlin. Das Mal is a time,
          an occasion: das erste Mal, jedes Mal.
        lemmas:
          - {lemma: schon, pos: adv, en: [already, yet], rank: 114}
          - {lemma: noch nicht, pos: expr, en: [not yet], rank: null}
          - {lemma: schon mal, pos: expr, en: [ever, before], rank: null}
          - {lemma: nie, pos: adv, en: [never], rank: 154}
          - {lemma: probieren, pos: verb, en: [to try, to taste], rank: 1671}
          - {lemma: Mal, pos: noun, gender: "n", en: [time, occasion], rank: 510}
        examples:
          - {id: 1, target: "Hast du schon gegessen?", en: ["Have you eaten yet?", "Have you already eaten?"]}
          - {id: 2, target: "Ich habe noch nicht gefrühstückt.", en: ["I haven't had breakfast yet.", "I haven't eaten breakfast yet."]}
          - {id: 3, target: "Sie sind noch nicht angekommen.", en: ["They haven't arrived yet."]}
          - {id: 4, target: "Warst du schon mal im Ausland?", en: ["Have you ever been abroad?", "Have you been abroad?"]}
          - {id: 5, target: "Haben wir uns schon mal getroffen?", en: ["Have we met before?"]}
          - {id: 6, target: "Das habe ich nie gesagt!", en: ["I never said that!", "I've never said that!"]}
          - {id: 7, target: "Wir haben schon alles probiert.", en: ["We've already tried everything.", "We have tried everything."]}
          - {id: 8, target: "Das ist mein erstes Mal.", en: ["It's my first time.", "This is my first time."]}
      - id: de.a2.u08.s02
        kind: grammar
        title: How long ago
        cefr: A2
        can_do: I can say how long ago something happened.
        requires: [de.a2.u08.s01]
        grammar_note: >-
          Vor with a time in the dative means ago, and it comes before the time: vor drei
          Tagen (three days ago), vor einer Stunde, vor einem Jahr. Plural nouns add -n:
          vor zwei Jahren. Vor kurzem means recently, and das ist lange her means that was
          a long time ago. Kennen is to know a person or a place (wissen is to know a fact);
          kennenlernen is to meet for the first time, to get to know: wir haben uns vor
          zwei Jahren kennengelernt. Heiraten is to get married.
        lemmas:
          - {lemma: vor, pos: prep, en: [ago, before, in front of], rank: 135}
          - {lemma: vor kurzem, pos: expr, en: [recently, not long ago], rank: null}
          - {lemma: her, pos: adv, en: [ago, here], rank: 887}
          - {lemma: kennen, pos: verb, en: [to know], rank: 211}
          - {lemma: kennenlernen, pos: verb, en: [to get to know, to meet], rank: 811, separable: kennen}
          - {lemma: heiraten, pos: verb, en: [to marry, to get married], rank: 542}
        examples:
          - {id: 1, target: "Das war vor drei Tagen.", en: ["That was three days ago.", "It was three days ago."]}
          - {id: 2, target: "Ich habe vor drei Jahren geheiratet.", en: ["I got married three years ago."]}
          - {id: 3, target: "Er ist vor einer Stunde gegangen.", en: ["He left an hour ago."]}
          - {id: 4, target: "Wir sind vor zwei Tagen angekommen.", en: ["We arrived two days ago."]}
          - {id: 5, target: "Wir sind vor kurzem umgezogen.", en: ["We moved recently.", "We've recently moved house."]}
          - {id: 6, target: "Wir haben uns vor zwei Jahren kennengelernt.", en: ["We met two years ago."]}
          - {id: 7, target: "Kennst du Tom?", en: ["Do you know Tom?"]}
          - {id: 8, target: "Das ist lange her.", en: ["That was a long time ago.", "That was a while ago."]}
      - id: de.a2.u08.s03
        kind: grammar
        title: School days
        cefr: A2
        can_do: I can say what I had to do, could do and wanted to do when I was younger.
        requires: [de.a2.u08.s02]
        grammar_note: >-
          To talk about the past, modal verbs use the simple past (Präteritum), not the
          Perfekt. They drop any umlaut and add -te: ich musste, ich konnte, ich durfte,
          ich wollte, ich sollte. The ich and er forms are the same: als Kind musste er früh
          ins Bett. Other persons add the usual endings: du musstest, wir mussten, Sie
          konnten. Als with a role means as: als Schüler (as a pupil). Eine Prüfung bestehen
          is to pass an exam; Hausaufgaben (homework) is plural.
