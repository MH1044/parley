      - id: de.a2.u06.s02
        kind: grammar
        title: Giving and showing
        cefr: A2
        can_do: I can say who gets, borrows or owns something.
        requires: [de.a2.u06.s01]
        grammar_note: >-
          The dative marks the person who receives something: ich gebe dem Kind einen Apfel.
          Der and das become dem, die becomes der, and plural die becomes den, with -n on
          the noun: den Kindern. Mein and ein add -em or -er: meinem Vater, meiner Mutter.
          The pronouns are mir, dir, ihm, ihr, uns, euch, ihnen and Ihnen. Geben, zeigen,
          schicken, leihen, erklären and schreiben take a person in the dative and a thing
          in the accusative; gehören takes only the dative: das gehört mir (that's mine).
