          Ask the price with wie viel kostet das? or was kostet das? For more than one
          thing the verb is plural: was kosten die? Euro takes no -s after a number: zwei
          Euro; drei Euro fünfzig is 3.50 euros. The waiter may say das macht drei Euro
          (that comes to three euros) and ask zusammen oder getrennt? (one bill or
          separate ones?). Zahlen and bezahlen both mean to pay; die Rechnung, bitte asks
          for the bill.
