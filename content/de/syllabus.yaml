      - id: de.a1.u04.s02
        kind: grammar
        title: Asking for help
        cefr: A1
        can_do: I can ask a stranger for help and say what I am looking for.
        requires: [de.a1.u04.s01]
        grammar_note: >-
          Können (can) is irregular: ich kann, du kannst, er or sie kann, wir können, Sie
          können. The second verb goes to the end of the sentence in the infinitive: ich
          kann das Hotel nicht finden. Wissen (to know a fact) is irregular too: ich weiß,
          du weißt, er weiß, Sie wissen. After wissen Sie, wo the verb also goes to the
          end: wissen Sie, wo die Post ist? Helfen takes mir and Ihnen, not mich and Sie:
          können Sie mir helfen? kann ich Ihnen helfen?
        lemmas:
