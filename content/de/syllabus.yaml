          - {lemma: Donnerstag, pos: noun, gender: m, en: [Thursday], rank: 4851}
          - {lemma: Freitag, pos: noun, gender: m, en: [Friday], rank: 2576}
          - {lemma: Samstag, pos: noun, gender: m, en: [Saturday], rank: 2833}
          - {lemma: Sonntag, pos: noun, gender: m, en: [Sunday], rank: 1258}
          - {lemma: Woche, pos: noun, gender: f, en: [week], rank: 347}
          - {lemma: Wochenende, pos: noun, gender: "n", en: [weekend], rank: 925}
          - {lemma: morgen, pos: adv, en: [tomorrow], rank: 199}
