          - {id: 2, target: "Im Januar schneit es.", en: ["It snows in January."]}
          - {id: 3, target: "Der Frühling beginnt im März.", en: ["Spring begins in March.", "Spring starts in March."]}
          - {id: 4, target: "Es ist der erste April.", en: ["It's the first of April.", "It's April the first."]}
          - {id: 5, target: "Ich bin im November geboren.", en: ["I was born in November."]}
          - {id: 6, target: "Er ist letzten August zurückgekommen.", en: ["He came back last August."]}
          - {id: 7, target: "Es regnet viel im Juni.", en: ["It rains a lot in June."]}
          - {id: 8, target: "Sie wird im Februar siebzehn.", en: ["She'll be seventeen in February.", "She turns seventeen in February."]}
      - id: de.a2.u05.s04
        kind: grammar
        title: If it rains
        cefr: A2
        can_do: I can say what I do when the weather is good or bad.
        requires: [de.a2.u05.s03]
        grammar_note: >-
          Wenn means if, and also when or whenever for something that happens again or in
          the future. Like weil and dass, it sends the verb to the end: wenn es regnet. When
          the wenn clause comes first, the main clause starts with its verb: wenn es
          regnet, bleiben wir zu Hause. For a single event in the past German uses als
          instead. Oft is often and manchmal sometimes; draußen is outside and drinnen
          inside. Mitnehmen (to take along) is separable: nimm einen Regenschirm mit!
        lemmas:
          - {lemma: wenn, pos: conj, en: [if, when, whenever], rank: 110}
          - {lemma: oft, pos: adv, en: [often], rank: 306}
          - {lemma: manchmal, pos: adv, en: [sometimes], rank: 880}
          - {lemma: draußen, pos: adv, en: [outside, outdoors], rank: 684}
          - {lemma: drinnen, pos: adv, en: [inside, indoors], rank: 1553}
          - {lemma: Regenschirm, pos: noun, gender: m, en: [umbrella], rank: 2071}
          - {lemma: mitnehmen, pos: verb, en: [to take along, to take with you], rank: 1995, separable: mit}
        examples:
          - {id: 1, target: "Wenn es regnet, bleiben wir zu Hause.", en: ["If it rains, we stay at home.", "If it rains, we'll stay home."]}
          - {id: 2, target: "Wenn er Zeit hat, kommt er.", en: ["If he has time, he'll come.", "When he has time, he comes."]}
          - {id: 3, target: "Iss, wenn du Hunger hast!", en: ["Eat if you're hungry!"]}
