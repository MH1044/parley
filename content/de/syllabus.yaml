          - {lemma: Insel, pos: noun, gender: f, en: [island], rank: 1675}
          - {lemma: Wald, pos: noun, gender: m, en: [forest, woods], rank: 1334}
          - {lemma: Dorf, pos: noun, gender: "n", en: [village], rank: 1359}
          - {lemma: Ausland, pos: noun, gender: "n", en: [abroad, foreign countries], rank: 1399}
        examples:
          - {id: 1, target: "Wir gehen in die Berge.", en: ["We're going to the mountains.", "We're going into the mountains."]}
          - {id: 2, target: "Ich war in den Bergen.", en: ["I was in the mountains."]}
          - {id: 3, target: "Wir gehen an den See.", en: ["We're going to the lake."]}
          - {id: 4, target: "Ich bin am Strand.", en: ["I'm at the beach.", "I'm on the beach."]}
          - {id: 5, target: "Gibt es Hotels auf der Insel?", en: ["Are there any hotels on the island?", "Are there hotels on the island?"]}
          - {id: 6, target: "Er wohnt in einem Dorf.", en: ["He lives in a village."]}
          - {id: 7, target: "Ich möchte ins Ausland.", en: ["I want to go abroad.", "I'd like to go abroad."]}
          - {id: 8, target: "Ich bin gern im Wald.", en: ["I like being in the woods.", "I like being in the forest."]}
      - id: de.a2.u04.s04
        kind: function
        title: Making arrangements
        cefr: A2
        can_do: I can make, accept and cancel arrangements with friends.
        requires: [de.a2.u04.s03]
        grammar_note: >-
          Vorhaben (to plan, to have on) is separable: was hast du am Wochenende vor?
          Abholen (to pick up) and absagen (to cancel) work the same way but stay whole
          after a modal verb: soll ich dich abholen? ich muss leider absagen. Doch makes a
          suggestion friendly: komm doch mit! (why don't you come along?). Lieber means
          rather: ich gehe lieber schwimmen (I'd rather go swimming). Bis dann! means see
          you then.
