  - id: de.a1.u04
    title: Around town
    cefr: A1
    skills:
      - id: de.a1.u04.s01
        kind: vocab
        title: Places in town
        cefr: A1
        can_do: I can name places in a town and ask whether there is one nearby.
        requires: [de.a1.u03.s04]
        grammar_note: >-
          Ask whether a place is near with gibt es in der Nähe ein Restaurant? (in der Nähe
          means nearby). After es gibt, der nouns take einen: gibt es einen Supermarkt in
          der Nähe? With in, a place where you are takes the dative (in der Stadt, im Park)
          and a place you go to takes the accusative (in die Stadt, in den Park). Wie komme
