          - {lemma: Hand, pos: noun, gender: f, en: [hand], rank: 467}
          - {lemma: Arm, pos: noun, gender: m, en: [arm], rank: 1014}
          - {lemma: Bein, pos: noun, gender: "n", en: [leg], rank: 1202}
          - {lemma: Fuß, pos: noun, gender: m, en: [foot], rank: 784}
          - {lemma: Auge, pos: noun, gender: "n", en: [eye], rank: 491}
          - {lemma: Zahn, pos: noun, gender: m, en: [tooth], rank: 1485}
          - {lemma: Nase, pos: noun, gender: f, en: [nose], rank: 1836}
          - {lemma: weh, pos: adj, en: [sore, aching], rank: 1291}
          - {lemma: tun, pos: verb, en: [to do], rank: 84}
        examples:
          - {id: 1, target: "Mein Kopf tut weh.", en: ["My head hurts.", "I have a headache."]}
          - {id: 2, target: "Mir tut der Rücken weh.", en: ["My back hurts.", "I have a pain in my back."]}
          - {id: 3, target: "Tut das weh?", en: ["Does that hurt?", "Does it hurt?"]}
          - {id: 4, target: "Meine Füße tun weh.", en: ["My feet hurt.", "I have sore feet."]}
          - {id: 5, target: "Welcher Zahn tut weh?", en: ["Which tooth hurts?"]}
          - {id: 6, target: "Mir tut der Hals weh.", en: ["My throat hurts.", "I have a sore throat."]}
          - {id: 7, target: "Mir läuft die Nase.", en: ["My nose is running.", "I have a runny nose."]}
          - {id: 8, target: "Schließen Sie die Augen.", en: ["Close your eyes.", "Shut your eyes."]}
      - id: de.a2.u02.s02
        kind: grammar
        title: Feeling ill
        cefr: A2
        can_do: I can say how I feel and that I have a cold or a fever.
        requires: [de.a2.u02.s01]
        grammar_note: >-
          Many verbs about how you feel are reflexive: a pronoun points back to the
          subject. Ich fühle mich, du fühlst dich, er or sie fühlt sich, wir fühlen uns,
          Sie fühlen sich. In the Perfekt the pronoun comes after haben: ich habe mich
          erkältet (I've caught a cold), while ich bin erkältet means I have a cold. After
          a modal verb the pronoun stays near the front: du musst dich ausruhen. Mir ist
          schlecht means I feel sick. Kopfschmerzen (a headache) is usually plural.
        lemmas:
          - {lemma: fühlen, pos: verb, en: [to feel], rank: 503}
          - {lemma: krank, pos: adj, en: [ill, sick], rank: 572}
          - {lemma: gesund, pos: adj, en: [healthy, well], rank: 1526}
          - {lemma: schlecht, pos: adj, en: [bad, unwell], rank: 431}
          - {lemma: Fieber, pos: noun, gender: "n", en: [fever, temperature], rank: 3159}
          - {lemma: Erkältung, pos: noun, gender: f, en: [cold], rank: 2376}
          - {lemma: erkälten, pos: verb, en: [to catch a cold], rank: 2773}
          - {lemma: Kopfschmerz, pos: noun, gender: m, en: [headache], rank: 2398}
          - {lemma: Schmerz, pos: noun, gender: m, en: [pain], rank: 1574}
          - {lemma: ausruhen, pos: verb, en: [to rest], rank: 3587, separable: aus}
        examples:
          - {id: 1, target: "Wie fühlen Sie sich?", en: ["How do you feel?", "How are you feeling?"]}
          - {id: 2, target: "Ich fühle mich krank.", en: ["I feel ill.", "I'm feeling sick."]}
          - {id: 3, target: "Ich habe mich erkältet.", en: ["I've caught a cold.", "I caught a cold."]}
          - {id: 4, target: "Haben Sie Fieber?", en: ["Do you have a temperature?", "Do you have a fever?"]}
          - {id: 5, target: "Hast du Kopfschmerzen?", en: ["Do you have a headache?", "Have you got a headache?"]}
          - {id: 6, target: "Mir ist schlecht.", en: ["I feel sick.", "I feel ill."]}
          - {id: 7, target: "Obst ist gesund.", en: ["Fruit is healthy.", "Fruit is good for you."]}
          - {id: 8, target: "Du musst dich ausruhen.", en: ["You need to rest.", "You have to rest."]}
      - id: de.a2.u02.s03
        kind: grammar
        title: Since when?
        cefr: A2
        can_do: I can say how long I have been ill or doing something.
        requires: [de.a2.u02.s02]
        grammar_note: >-
          Seit (since, for) says how long something has been going on, and German uses the
          present tense where English says has been: er ist seit einer Woche krank (he has
          been ill for a week). Seit takes the dative: seit einem Monat, seit einer Woche,
          and plural nouns add -n: seit drei Tagen, seit zwei Jahren. Ask seit wann? (how
          long, since when?). Immer noch means still: mein Hals tut immer noch weh. Wieder
          means again: jetzt geht es mir wieder gut.
        lemmas:
          - {lemma: seit, pos: prep, en: [since, for], rank: 364}
          - {lemma: Monat, pos: noun, gender: m, en: [month], rank: 529}
          - {lemma: immer noch, pos: expr, en: [still], rank: null}
          - {lemma: wieder, pos: adv, en: [again], rank: 232}
          - {lemma: schlimm, pos: adj, en: [bad, serious], rank: 1044}
        examples:
          - {id: 1, target: "Seit wann ist sie krank?", en: ["How long has she been ill?", "Since when has she been ill?"]}
          - {id: 2, target: "Mein Bruder ist seit gestern krank.", en: ["My brother has been ill since yesterday.", "My brother has been sick since yesterday."]}
          - {id: 3, target: "Er ist seit einer Woche krank.", en: ["He has been ill for a week.", "He's been sick for a week."]}
          - {id: 4, target: "Ich lerne seit zwei Jahren Deutsch.", en: ["I have been learning German for two years.", "I've been studying German for two years."]}
          - {id: 5, target: "Ich wohne seit einem Monat in Berlin.", en: ["I have been living in Berlin for a month.", "I've lived in Berlin for a month."]}
          - {id: 6, target: "Ist es schlimm?", en: ["Is it bad?", "Is it serious?"]}
          - {id: 7, target: "Mein Hals tut immer noch weh.", en: ["My throat still hurts.", "My neck still hurts."]}
          - {id: 8, target: "Jetzt geht es mir wieder gut.", en: ["I'm fine again now.", "Now I'm well again."]}
      - id: de.a2.u02.s04
        kind: function
        title: At the doctor's
        cefr: A2
        can_do: I can understand a doctor's advice and repeat what I should do.
        requires: [de.a2.u02.s03]
        grammar_note: >-
          The doctor gives advice with the Sie imperative, the verb first: nehmen Sie das
          Medikament dreimal am Tag, bleiben Sie im Bett. With du, drop -st from the du
          form: du trinkst, trink viel Wasser!; du nimmst, nimm das! Sollen (should, to be
