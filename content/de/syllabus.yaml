  - id: de.a1.u05
    title: Shopping
    cefr: A1
    skills:
      - id: de.a1.u05.s01
        kind: vocab
        title: Clothes
        cefr: A1
        can_do: I can name clothes and say what someone is wearing.
        requires: [de.a1.u04.s04]
        grammar_note: >-
          Tragen (to wear, to carry) changes its vowel: du trägst, er or sie trägt. As with
          every verb, one form covers wears and is wearing: Maria trägt ein Kleid. Clothes
          are the object, so der words take einen: er trägt einen Mantel. An adjective
          before a noun takes an ending: ein neues Kleid, eine neue Jacke, einen neuen
          Mantel. Die Hose (trousers) is singular in German: wie viel kostet die Hose?
        lemmas:
          - {lemma: tragen, pos: verb, en: [to wear, to carry], rank: 322}
          - {lemma: Hose, pos: noun, gender: f, en: [trousers, pants], rank: 2083}
          - {lemma: Hemd, pos: noun, gender: "n", en: [shirt], rank: 1327}
          - {lemma: Kleid, pos: noun, gender: "n", en: [dress], rank: 932}
          - {lemma: Schuh, pos: noun, gender: m, en: [shoe], rank: 762}
          - {lemma: Jacke, pos: noun, gender: f, en: [jacket], rank: 2530}
          - {lemma: Mantel, pos: noun, gender: m, en: [coat], rank: 1459}
          - {lemma: Pullover, pos: noun, gender: m, en: [jumper, sweater], rank: 2163}
          - {lemma: Hut, pos: noun, gender: m, en: [hat], rank: 1071}
        examples:
          - {id: 1, target: "Maria trägt ein neues Kleid.", en: ["Maria is wearing a new dress."]}
          - {id: 2, target: "Er trägt einen neuen Mantel.", en: ["He's wearing a new coat.", "He is wearing a new coat."]}
          - {id: 3, target: "Ich suche einen Pullover.", en: ["I'm looking for a sweater.", "I'm looking for a jumper."]}
          - {id: 4, target: "Wie viel kostet die Hose?", en: ["How much are the trousers?", "How much do the trousers cost?", "How much are these pants?"]}
          - {id: 5, target: "Ich kann meine Schuhe nicht finden.", en: ["I can't find my shoes."]}
          - {id: 6, target: "Ich habe eine neue Jacke.", en: ["I have a new jacket.", "I've got a new jacket."]}
          - {id: 7, target: "Ist das ein neues Hemd?", en: ["Is that a new shirt?"]}
          - {id: 8, target: "Tom hat immer einen Hut auf.", en: ["Tom always wears a hat.", "Tom always has a hat on."]}
      - id: de.a1.u05.s02
        kind: vocab
        title: Colours and sizes
        cefr: A1
        can_do: I can say which colour and size I want.
        requires: [de.a1.u05.s01]
        grammar_note: >-
          After sein a colour has no ending: mein Auto ist rot. Before a noun it takes an
          ending like any adjective: ein blauer Hut, einen blauen Hut, eine rote Jacke. Ask
          about colour with welche Farbe hat ...? (what colour is ...?). A colour used as a
          noun is capitalised: haben Sie das auch in Schwarz? Größe is size, of clothes
          and shoes too: das ist nicht meine Größe.
        lemmas:
