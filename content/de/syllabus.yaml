          - {id: 8, target: "Gut, bis dann!", en: ["OK, see you then!", "Alright, see you then."]}
  - id: de.a2.u05
    title: Weather and seasons
    cefr: A2
    skills:
      - id: de.a2.u05.s01
        kind: vocab
        title: The weather
        cefr: A2
        can_do: I can ask about the weather and say what it is like.
        requires: [de.a2.u04.s04]
        grammar_note: >-
          Weather verbs take es: es regnet (it's raining), es schneit (it's snowing), and in
          the Perfekt es hat geregnet. Die Sonne scheint means the sun is shining. Ask wie
          ist das Wetter? and answer das Wetter ist schön or heute ist schönes Wetter.
          Temperatures are in Celsius: hier haben wir 30 Grad (it's 30 degrees here). As
          with kalt and warm, mir ist heiß means I am hot, and es ist heiß means it is hot.
        lemmas:
          - {lemma: Wetter, pos: noun, gender: "n", en: [weather], rank: 890}
          - {lemma: Sonne, pos: noun, gender: f, en: [sun], rank: 989}
          - {lemma: Regen, pos: noun, gender: m, en: [rain], rank: 1000}
          - {lemma: Schnee, pos: noun, gender: m, en: [snow], rank: 1213}
          - {lemma: Wind, pos: noun, gender: m, en: [wind], rank: 1741}
          - {lemma: Wolke, pos: noun, gender: f, en: [cloud], rank: 2477}
          - {lemma: Himmel, pos: noun, gender: m, en: [sky], rank: 1109}
          - {lemma: regnen, pos: verb, en: [to rain], rank: 574}
          - {lemma: schneien, pos: verb, en: [to snow], rank: 1560}
          - {lemma: scheinen, pos: verb, en: [to shine, to seem], rank: 285}
          - {lemma: heiß, pos: adj, en: [hot], rank: 606}
          - {lemma: Grad, pos: noun, gender: m, en: [degree], rank: 3087}
        examples:
          - {id: 1, target: "Wie ist das Wetter?", en: ["What's the weather like?", "How's the weather?"]}
          - {id: 2, target: "Heute ist schönes Wetter.", en: ["The weather is nice today.", "It's a nice day today."]}
          - {id: 3, target: "Die Sonne scheint.", en: ["The sun is shining."]}
          - {id: 4, target: "Es regnet wieder!", en: ["It's raining again!"]}
          - {id: 5, target: "Heute schneit es.", en: ["It's snowing today."]}
          - {id: 6, target: "Hier haben wir 30 Grad.", en: ["It's thirty degrees here.", "It's 30 degrees here."]}
          - {id: 7, target: "Es ist keine Wolke am Himmel.", en: ["There isn't a cloud in the sky.", "There's not a cloud in the sky."]}
          - {id: 8, target: "Heute gibt es keinen Wind.", en: ["There's no wind today."]}
      - id: de.a2.u05.s02
        kind: vocab
        title: The seasons
        cefr: A2
        can_do: I can name the seasons and say what they are like.
        requires: [de.a2.u05.s01]
        grammar_note: >-
          The seasons are all der words: der Frühling, der Sommer, der Herbst, der Winter.
          In a season is im (in dem): im Sommer ist es heiß, im Winter schneit es. Es wird
          (it is getting) describes a change: es wird dunkel, es wird Winter, and the leaves
          turn yellow is die Blätter werden gelb. Die Jahreszeit is a season of the year.
          Kühl is cool and nass wet.
        lemmas:
          - {lemma: Jahreszeit, pos: noun, gender: f, en: [season], rank: 4588}
          - {lemma: Frühling, pos: noun, gender: m, en: [spring], rank: 1938}
          - {lemma: Sommer, pos: noun, gender: m, en: [summer], rank: 867}
          - {lemma: Herbst, pos: noun, gender: m, en: [autumn, fall], rank: 2439}
          - {lemma: Winter, pos: noun, gender: m, en: [winter], rank: 1233}
          - {lemma: Blatt, pos: noun, gender: "n", en: [leaf, sheet of paper], rank: 2266}
          - {lemma: kühl, pos: adj, en: [cool], rank: 3637}
          - {lemma: nass, pos: adj, en: [wet], rank: 2370}
          - {lemma: dunkel, pos: adj, en: [dark], rank: 1276}
        examples:
          - {id: 1, target: "Ein Jahr hat vier Jahreszeiten.", en: ["There are four seasons in a year.", "A year has four seasons."]}
          - {id: 2, target: "Der Frühling ist da.", en: ["Spring is here.", "Spring has come."]}
          - {id: 3, target: "Im Sommer ist es heiß.", en: ["It's hot in summer.", "In summer it is hot."]}
          - {id: 4, target: "Im Herbst werden die Blätter gelb.", en: ["In autumn the leaves turn yellow.", "The leaves turn yellow in the fall."]}
          - {id: 5, target: "Es wird Winter.", en: ["Winter is coming.", "It's getting wintry."]}
          - {id: 6, target: "Heute ist es kühl.", en: ["It's cool today.", "It's chilly today."]}
          - {id: 7, target: "Es wird dunkel.", en: ["It's getting dark."]}
          - {id: 8, target: "Die Straße ist nass.", en: ["The street is wet.", "The road is wet."]}
      - id: de.a2.u05.s03
        kind: vocab
        title: Months and dates
        cefr: A2
        can_do: I can name the months and say when my birthday is.
        requires: [de.a2.u05.s02]
        grammar_note: >-
          The months are der words and take im for in: im Mai, im Juli. Dates use am with
          an ordinal ending in -ten: am ersten Mai, am dritten Oktober; heute ist der erste
          April. In writing, a full stop after the number marks the ordinal: am 3. Oktober.
          Ask wann hast du Geburtstag? and answer im Juli or am zehnten Juli. Ich bin im
          November geboren means I was born in November.
        lemmas:
