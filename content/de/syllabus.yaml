units:
  - id: de.a1.u01
    title: Hello
    cefr: A1
    skills:
      - id: de.a1.u01.s01
        kind: function
        title: Greetings
        cefr: A1
        can_do: I can say hello and goodbye and ask how someone is.
        requires: []
        grammar_note: >-
          Guten Morgen is for the morning, guten Tag for the rest of the day and guten
          Abend for the evening; gute Nacht is only for bedtime. Hallo and tschüss work at
          any time with people you know. Ask how someone is with wie geht es dir? (du) or
          wie geht es Ihnen? (Sie) and answer gut, danke. Every noun starts with a capital
          letter: Tag, Nacht.
        lemmas:
          - {lemma: hallo, pos: intj, en: [hello, hi], rank: 2029}
          - {lemma: gut, pos: adj, en: [good], rank: 83}
          - {lemma: Tag, pos: noun, gender: m, en: [day], rank: 176}
          - {lemma: Morgen, pos: noun, gender: m, en: [morning], rank: 474}
          - {lemma: Abend, pos: noun, gender: m, en: [evening], rank: 429}
          - {lemma: Nacht, pos: noun, gender: f, en: [night], rank: 463}
          - {lemma: tschüss, pos: intj, en: [bye], rank: 11276}
          - {lemma: danke, pos: intj, en: [thank you, thanks], rank: 605}
          - {lemma: bitte, pos: intj, en: [please, you are welcome], rank: 147}
          - {lemma: auf Wiedersehen, pos: expr, en: [goodbye], rank: null}
          - {lemma: gehen, pos: verb, en: [to go], rank: 75}
        examples:
          - {id: 1, target: "Hallo, wie geht es dir?", en: ["Hello, how are you?", "Hi, how are you doing?"]}
          - {id: 2, target: "Guten Morgen, Anna!", en: ["Good morning, Anna!"]}
          - {id: 3, target: "Guten Tag! Wie geht es Ihnen?", en: ["Hello! How are you?", "Good day! How are you?"]}
          - {id: 4, target: "Gut, danke. Und dir?", en: ["Fine, thanks. And you?", "Good, thank you. And you?"]}
          - {id: 5, target: "Guten Abend, Paul.", en: ["Good evening, Paul."]}
          - {id: 6, target: "Gute Nacht und tschüss!", en: ["Good night and bye!"]}
          - {id: 7, target: "Mir geht es gut, danke.", en: ["I am fine, thank you.", "I am well, thanks."]}
          - {id: 8, target: "Auf Wiedersehen und danke!", en: ["Goodbye and thank you!"]}
          - {id: 9, target: "Danke. Bitte.", en: ["Thank you. You are welcome."]}
      - id: de.a1.u01.s02
        kind: grammar
        title: Names
        cefr: A1
        can_do: I can say my name and ask someone their name.
        requires: [de.a1.u01.s01]
        grammar_note: >-
          Two verbs introduce you: heißen (to be called) and sein (to be). Ich heiße Anna,
          du heißt, er or sie heißt, Sie heißen; ich bin, du bist, er or sie ist, wir sind,
          Sie sind. Sie with a capital letter is the polite you, for adults you do not
          know; du is for friends, family and children. Herr and Frau go before a surname
          when you address someone politely. Freut mich (pleased to meet you) is short for
          es freut mich, from freuen (to please).
        lemmas:
          - {lemma: heißen, pos: verb, en: [to be called], rank: 363}
          - {lemma: sein, pos: verb, en: [to be], rank: 12}
          - {lemma: Name, pos: noun, gender: m, en: [name], rank: 471}
          - {lemma: Herr, pos: noun, gender: m, en: [Mr, gentleman], rank: 616}
          - {lemma: Frau, pos: noun, gender: f, en: [Mrs, Ms, woman], rank: 280}
          - {lemma: freuen, pos: verb, en: [to please, to be glad], rank: 601}
          - {lemma: Entschuldigung, pos: intj, en: [excuse me, sorry], rank: 1755}
        examples:
          - {id: 1, target: "Ich heiße Anna.", en: ["My name is Anna.", "I am called Anna."]}
          - {id: 2, target: "Wie heißt du?", en: ["What is your name?", "What are you called?"]}
          - {id: 3, target: "Wie heißen Sie?", en: ["What is your name?"]}
          - {id: 4, target: "Mein Name ist Lukas.", en: ["My name is Lukas."]}
          - {id: 5, target: "Ich bin Paul. Freut mich.", en: ["I am Paul. Nice to meet you."]}
          - {id: 6, target: "Wer bist du?", en: ["Who are you?"]}
          - {id: 7, target: "Das ist Anna.", en: ["This is Anna.", "That is Anna."]}
          - {id: 8, target: "Entschuldigung, wie heißen Sie?", en: ["Excuse me, what is your name?"]}
          - {id: 9, target: "Wer ist die Frau da?", en: ["Who is that woman?", "Who is the woman there?"]}
          - {id: 10, target: "Der Herr heißt Paul.", en: ["The gentleman is called Paul.", "The man's name is Paul."]}
      - id: de.a1.u01.s03
        kind: grammar
        title: Where you are from
        cefr: A1
        can_do: I can say where I am from and which languages I speak.
        requires: [de.a1.u01.s02]
        grammar_note: >-
          Regular verbs in the present take -e, -st, -t and -en: ich komme, du kommst, er
          kommt, wir kommen, Sie kommen; wohnen works the same way. Sprechen changes its
          vowel in two forms: du sprichst, er spricht. Say where you are from with aus and
          where you live with in: ich komme aus Berlin, ich wohne in Hamburg. Ask with
          woher? (from where) and wo? (where). Language names are capitalised: Deutsch,
          Englisch. Ein bisschen means a little: ich spreche ein bisschen Deutsch.
        lemmas:
          - {lemma: kommen, pos: verb, en: [to come], rank: 90}
          - {lemma: wohnen, pos: verb, en: [to live], rank: 305}
          - {lemma: sprechen, pos: verb, en: [to speak], rank: 121}
          - {lemma: Deutsch, pos: noun, gender: "n", en: [German], rank: 926}
          - {lemma: Englisch, pos: noun, gender: "n", en: [English], rank: 442}
          - {lemma: Spanisch, pos: noun, gender: "n", en: [Spanish], rank: 2124}
          - {lemma: Französisch, pos: noun, gender: "n", en: [French], rank: 247}
          - {lemma: auch, pos: adv, en: [also, too], rank: 197}
          - {lemma: bisschen, pos: pron, en: [a bit, a little], rank: 591}
        examples:
          - {id: 1, target: "Ich komme aus Deutschland.", en: ["I come from Germany.", "I am from Germany."]}
          - {id: 2, target: "Woher kommst du?", en: ["Where are you from?", "Where do you come from?"]}
          - {id: 3, target: "Anna kommt aus Berlin.", en: ["Anna comes from Berlin.", "Anna is from Berlin."]}
          - {id: 4, target: "Ich wohne in Hamburg.", en: ["I live in Hamburg."]}
          - {id: 5, target: "Wo wohnen Sie?", en: ["Where do you live?"]}
          - {id: 6, target: "Ich spreche Deutsch und ein bisschen Englisch.", en: ["I speak German and a little English."]}
          - {id: 7, target: "Sprechen Sie Englisch?", en: ["Do you speak English?"]}
          - {id: 8, target: "Paul spricht auch Spanisch.", en: ["Paul also speaks Spanish.", "Paul speaks Spanish too."]}
          - {id: 9, target: "Sie spricht Französisch.", en: ["She speaks French."]}
      - id: de.a1.u01.s04
        kind: grammar
        title: Numbers and age
        cefr: A1
        can_do: I can count to twenty and say how old I am.
        requires: [de.a1.u01.s03]
        grammar_note: >-
          Age uses sein and alt: ich bin zwanzig Jahre alt is literally I am twenty years
          old; ask with wie alt bist du? or wie alt sind Sie? Haben (to have) is irregular
          in two forms: ich habe, du hast, er hat, wir haben. From twenty-one on, the units
          come first and the tens last, joined by und, all in one word: einundzwanzig,
          zweiunddreißig.
        lemmas:
          - {lemma: haben, pos: verb, en: [to have], rank: 19}
          - {lemma: Jahr, pos: noun, gender: "n", en: [year], rank: 186}
          - {lemma: alt, pos: adj, en: [old], rank: 196}
          - {lemma: Nummer, pos: noun, gender: f, en: [number], rank: 2092}
          - {lemma: Telefonnummer, pos: noun, gender: f, en: [phone number, telephone number], rank: 1945}
          - {lemma: eins, pos: num, en: [one], rank: 1534}
          - {lemma: zwei, pos: num, en: [two], rank: 303}
          - {lemma: drei, pos: num, en: [three], rank: 223}
          - {lemma: vier, pos: num, en: [four], rank: 939}
          - {lemma: fünf, pos: num, en: [five], rank: 704}
          - {lemma: sechs, pos: num, en: [six], rank: 1087}
          - {lemma: sieben, pos: num, en: [seven], rank: 1147}
          - {lemma: acht, pos: num, en: [eight], rank: 1383}
          - {lemma: neun, pos: num, en: [nine], rank: 1941}
          - {lemma: zehn, pos: num, en: [ten], rank: 626}
        examples:
          - {id: 1, target: "Ich bin zwanzig Jahre alt.", en: ["I am twenty years old.", "I am twenty."]}
          - {id: 2, target: "Wie alt bist du?", en: ["How old are you?"]}
          - {id: 3, target: "Wie alt sind Sie?", en: ["How old are you?"]}
          - {id: 4, target: "Anna ist dreißig Jahre alt.", en: ["Anna is thirty years old.", "Anna is thirty."]}
          - {id: 5, target: "Eins, zwei, drei, vier, fünf.", en: ["One, two, three, four, five."]}
          - {id: 6, target: "Sechs, sieben, acht, neun und zehn.", en: ["Six, seven, eight, nine and ten."]}
          - {id: 7, target: "Wie ist deine Telefonnummer?", en: ["What is your phone number?"]}
          - {id: 8, target: "Hast du meine Nummer?", en: ["Do you have my number?"]}
          - {id: 9, target: "Paul hat meine Telefonnummer.", en: ["Paul has my phone number."]}
  - id: de.a1.u02
    title: Day to day
    cefr: A1
    skills:
      - id: de.a1.u02.s01
        kind: grammar
        title: Things around you
        cefr: A1
        can_do: I can name everyday things with der, die or das and say what I do not have.
        requires: [de.a1.u01.s04]
        grammar_note: >-
          Every noun is masculine, feminine or neuter, and the article shows which: der
          Tisch, die Tür, das Buch. Learn each noun with its article. A or an is ein for der
          and das nouns and eine for die nouns. Kein (no, not a) works the same way: ich
          habe kein Auto, das ist keine Uhr. Plurals vary, so learn them too; all of them
          take die: das Buch, die Bücher; das Auto, die Autos. An adjective after sein
          never changes: das Auto ist neu, die Bücher sind klein.
        lemmas:
          - {lemma: Buch, pos: noun, gender: "n", en: [book], rank: 175}
          - {lemma: Tisch, pos: noun, gender: m, en: [table], rank: 638}
          - {lemma: Stuhl, pos: noun, gender: m, en: [chair], rank: 1470}
          - {lemma: Tür, pos: noun, gender: f, en: [door], rank: 392}
          - {lemma: Fenster, pos: noun, gender: "n", en: [window], rank: 603}
          - {lemma: Auto, pos: noun, gender: "n", en: [car], rank: 253}
          - {lemma: Uhr, pos: noun, gender: f, en: [clock, watch, o'clock], rank: 312}
          - {lemma: Tasche, pos: noun, gender: f, en: [bag], rank: 1065}
          - {lemma: groß, pos: adj, en: [big, tall], rank: 182}
          - {lemma: klein, pos: adj, en: [small, little], rank: 355}
          - {lemma: neu, pos: adj, en: [new], rank: 214}
        examples:
          - {id: 1, target: "Das ist ein Buch.", en: ["This is a book.", "That's a book.", "It is a book."]}
          - {id: 2, target: "Das Auto ist klein.", en: ["The car is small."]}
          - {id: 3, target: "Mein Auto ist neu.", en: ["My car is new."]}
          - {id: 4, target: "Wo ist der Tisch?", en: ["Where is the table?", "Where's the table?"]}
          - {id: 5, target: "Ich habe zwei Bücher.", en: ["I have two books.", "I've got two books."]}
          - {id: 6, target: "Ich habe kein Auto.", en: ["I don't have a car.", "I haven't got a car.", "I have no car."]}
          - {id: 7, target: "Das ist nicht meine Tasche.", en: ["This isn't my bag.", "That is not my bag."]}
          - {id: 8, target: "Es ist ein Stuhl.", en: ["It is a chair.", "It's a chair."]}
      - id: de.a1.u02.s02
        kind: grammar
        title: What people do
        cefr: A1
        can_do: I can say what I and other people are doing today.
        requires: [de.a1.u02.s01]
        grammar_note: >-
          Most verbs work like kommen: ich mache, du machst, er or sie macht, wir machen,
          ihr macht, sie and Sie machen. A stem ending in -t adds an e: du arbeitest, er
          arbeitet. Some verbs change their vowel with du and er or sie: lesen gives du
          liest, er liest; sehen gives du siehst, er sieht. German has one present tense
          for I read and I am reading. The verb comes second in a statement (heute arbeite
          ich nicht) and first in a yes or no question (liest du ein Buch?).
        lemmas:
          - {lemma: machen, pos: verb, en: [to do, to make], rank: 82}
          - {lemma: arbeiten, pos: verb, en: [to work], rank: 144}
          - {lemma: lernen, pos: verb, en: [to learn, to study], rank: 215}
          - {lemma: spielen, pos: verb, en: [to play], rank: 201}
          - {lemma: hören, pos: verb, en: [to hear, to listen to], rank: 142}
          - {lemma: lesen, pos: verb, en: [to read], rank: 233}
          - {lemma: schreiben, pos: verb, en: [to write], rank: 246}
          - {lemma: sehen, pos: verb, en: [to see], rank: 85}
          - {lemma: heute, pos: adv, en: [today], rank: 141}
          - {lemma: jetzt, pos: adv, en: [now], rank: 171}
        examples:
          - {id: 1, target: "Was machst du heute?", en: ["What are you doing today?"]}
          - {id: 2, target: "Wo arbeiten Sie?", en: ["Where do you work?"]}
          - {id: 3, target: "Ich arbeite heute nicht.", en: ["I'm not working today.", "I don't work today."]}
          - {id: 4, target: "Ich lerne jetzt Deutsch.", en: ["I'm learning German now.", "I am learning German now."]}
          - {id: 5, target: "Tom liest ein Buch.", en: ["Tom is reading a book.", "Tom reads a book."]}
          - {id: 6, target: "Er schreibt ein Buch.", en: ["He is writing a book.", "He's writing a book."]}
          - {id: 7, target: "Was siehst du?", en: ["What do you see?", "What can you see?"]}
          - {id: 8, target: "Was hörst du?", en: ["What do you hear?", "What are you listening to?"]}
      - id: de.a1.u02.s03
        kind: function
        title: Likes
        cefr: A1
        can_do: I can say what I like doing and what I do not like.
        requires: [de.a1.u02.s02]
        grammar_note: >-
          To say you like doing something, put gern after the verb: ich koche gern (I like
          cooking), ich schwimme nicht gern (I don't like swimming). Sehr gern means very
          much: ich lese sehr gern. To like a thing or a person, use mögen, which is
          irregular: ich mag, du magst, er or sie mag, wir mögen, Sie mögen. Ich mag Musik.
          Ask what someone likes doing with was machst du gern?
        lemmas:
          - {lemma: gern, pos: adv, en: [gladly, with pleasure], rank: 139}
          - {lemma: mögen, pos: verb, en: [to like], rank: 98}
          - {lemma: sehr, pos: adv, en: [very, very much], rank: 70}
          - {lemma: Musik, pos: noun, gender: f, en: [music], rank: 766}
          - {lemma: Film, pos: noun, gender: m, en: [film, movie], rank: 566}
          - {lemma: Fußball, pos: noun, gender: m, en: [football, soccer], rank: 1603}
          - {lemma: schwimmen, pos: verb, en: [to swim], rank: 483}
          - {lemma: kochen, pos: verb, en: [to cook], rank: 687}
          - {lemma: tanzen, pos: verb, en: [to dance], rank: 846}
          - {lemma: singen, pos: verb, en: [to sing], rank: 559}
        examples:
          - {id: 1, target: "Ich spiele gern Fußball.", en: ["I like playing football.", "I like to play football.", "I like to play soccer."]}
          - {id: 2, target: "Ich koche gern.", en: ["I like to cook.", "I like cooking."]}
          - {id: 3, target: "Singst du gern?", en: ["Do you like singing?", "Do you like to sing?"]}
          - {id: 4, target: "Ich schwimme nicht gern.", en: ["I don't like swimming.", "I don't like to swim."]}
          - {id: 5, target: "Was machst du gern?", en: ["What do you like to do?", "What do you like doing?"]}
          - {id: 6, target: "Magst du Musik?", en: ["Do you like music?"]}
          - {id: 7, target: "Ich mag Filme.", en: ["I like films.", "I like movies."]}
          - {id: 8, target: "Ich lese sehr gern.", en: ["I love reading.", "I really like reading.", "I love to read."]}
      - id: de.a1.u02.s04
        kind: vocab
        title: Work and study
        cefr: A1
        can_do: I can say what I do for a living and where I work or study.
        requires: [de.a1.u02.s02]
        grammar_note: >-
          After sein, a job takes no article: ich bin Lehrer (I am a teacher). Most jobs
          have a female form ending in -in: Lehrer and Lehrerin, Student and Studentin,
          Arzt and Ärztin. To say what you are not, use kein: ich bin kein Arzt. Zur Arbeit
          and zur Schule mean to work and to school; im Büro means in the office.
        lemmas:
          - {lemma: Arbeit, pos: noun, gender: f, en: [work, job], rank: 275}
          - {lemma: Lehrer, pos: noun, gender: m, en: [teacher], rank: 399}
          - {lemma: Lehrerin, pos: noun, gender: f, en: [teacher], rank: 413}
          - {lemma: Student, pos: noun, gender: m, en: [student], rank: 891}
          - {lemma: Studentin, pos: noun, gender: f, en: [student], rank: 1683}
          - {lemma: Arzt, pos: noun, gender: m, en: [doctor], rank: 481}
          - {lemma: Ärztin, pos: noun, gender: f, en: [doctor], rank: 523}
          - {lemma: Schule, pos: noun, gender: f, en: [school], rank: 301}
          - {lemma: Büro, pos: noun, gender: "n", en: [office], rank: 872}
          - {lemma: studieren, pos: verb, en: [to study, to be at university], rank: 761}
        examples:
          - {id: 1, target: "Ich bin Lehrerin.", en: ["I'm a teacher.", "I am a teacher."]}
          - {id: 2, target: "Tom ist Arzt.", en: ["Tom is a doctor.", "Tom's a doctor."]}
          - {id: 3, target: "Sie ist Ärztin.", en: ["She is a doctor.", "She's a doctor."]}
          - {id: 4, target: "Bist du Student?", en: ["Are you a student?"]}
          - {id: 5, target: "Ich bin kein Lehrer.", en: ["I'm not a teacher.", "I am not a teacher."]}
          - {id: 6, target: "Was studieren Sie?", en: ["What do you study?", "What are you studying?"]}
          - {id: 7, target: "Ich gehe zur Arbeit.", en: ["I'm going to work.", "I go to work."]}
          - {id: 8, target: "Tom ist im Büro.", en: ["Tom is in the office.", "Tom is in his office."]}
  - id: de.a1.u03
    title: Food and drink
    cefr: A1
    skills:
      - id: de.a1.u03.s01
        kind: vocab
        title: Drinks
        cefr: A1
        can_do: I can name common drinks and say what I drink and what I do not.
        requires: [de.a1.u02.s03]
        grammar_note: >-
          Most drinks are der words (der Kaffee, der Tee, der Wein), but it is das Wasser,
          das Bier and die Milch. After a verb such as trinken, ein and kein become einen
          and keinen with der nouns: ich trinke keinen Wein. Die and das nouns do not
          change: keine Milch, kein Bier. A cup of tea is eine Tasse Tee and a glass of
          water ein Glas Wasser, with no word for of. Ich habe Durst (I have thirst) means
          I am thirsty.
        lemmas:
          - {lemma: trinken, pos: verb, en: [to drink], rank: 287}
          - {lemma: Kaffee, pos: noun, gender: m, en: [coffee], rank: 468}
          - {lemma: Tee, pos: noun, gender: m, en: [tea], rank: 702}
          - {lemma: Wasser, pos: noun, gender: "n", en: [water], rank: 419}
          - {lemma: Milch, pos: noun, gender: f, en: [milk], rank: 943}
          - {lemma: Bier, pos: noun, gender: "n", en: [beer], rank: 911}
          - {lemma: Wein, pos: noun, gender: m, en: [wine], rank: 864}
          - {lemma: Glas, pos: noun, gender: "n", en: [glass], rank: 1032}
          - {lemma: Tasse, pos: noun, gender: f, en: [cup], rank: 1057}
          - {lemma: Flasche, pos: noun, gender: f, en: [bottle], rank: 1510}
          - {lemma: Durst, pos: noun, gender: m, en: [thirst], rank: 2693}
        examples:
          - {id: 1, target: "Ich trinke Kaffee.", en: ["I drink coffee.", "I'm drinking coffee."]}
          - {id: 2, target: "Trinkst du Tee?", en: ["Do you drink tea?"]}
          - {id: 3, target: "Was trinken Sie?", en: ["What would you like to drink?", "What are you drinking?"]}
          - {id: 4, target: "Ich trinke keinen Wein.", en: ["I don't drink wine."]}
          - {id: 5, target: "Ich trinke keine Milch.", en: ["I don't drink milk."]}
          - {id: 6, target: "Hast du Durst?", en: ["Are you thirsty?"]}
          - {id: 7, target: "Ein Glas Wasser, bitte!", en: ["A glass of water, please.", "I'd like a glass of water, please."]}
          - {id: 8, target: "Eine Tasse Tee, bitte.", en: ["A cup of tea, please."]}
      - id: de.a1.u03.s02
        kind: grammar
        title: Ordering
        cefr: A1
        can_do: I can order something to eat and drink in a café.
        requires: [de.a1.u03.s01]
        grammar_note: >-
          Order politely with möchten (would like): ich möchte, du möchtest, er or sie
          möchte, Sie möchten. Ich hätte gern means the same, and ich nehme (I'll have)
          works too; nehmen changes its vowel: du nimmst, er nimmt. What you order is the
          object of the verb, so ein becomes einen with der nouns (ich möchte einen
          Kaffee), while eine and ein stay the same (eine Suppe, ein Stück Kuchen). Noch
          ein means another: noch ein Bier. Etwas means something.
        lemmas:
          - {lemma: möchten, pos: verb, en: [would like], rank: 914}
          - {lemma: nehmen, pos: verb, en: [to take, to have], rank: 205}
          - {lemma: etwas, pos: pron, en: [something, anything], rank: 48}
          - {lemma: noch, pos: adv, en: [still, another, else], rank: 87}
          - {lemma: Brot, pos: noun, gender: "n", en: [bread], rank: 883}
          - {lemma: Kuchen, pos: noun, gender: m, en: [cake], rank: 1011}
          - {lemma: Käse, pos: noun, gender: m, en: [cheese], rank: 2212}
          - {lemma: Suppe, pos: noun, gender: f, en: [soup], rank: 1889}
          - {lemma: Pizza, pos: noun, gender: f, en: [pizza], rank: 1689}
          - {lemma: Stück, pos: noun, gender: "n", en: [piece, slice], rank: 1175}
        examples:
