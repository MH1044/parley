          - {lemma: schwarz, pos: adj, en: [black], rank: 930}
          - {lemma: weiß, pos: adj, en: [white], rank: 123}
          - {lemma: gelb, pos: adj, en: [yellow], rank: 2054}
          - {lemma: braun, pos: adj, en: [brown], rank: 2319}
          - {lemma: Größe, pos: noun, gender: f, en: [size], rank: 3429}
        examples:
          - {id: 1, target: "Welche Farbe hat dein Auto?", en: ["What colour is your car?", "What color is your car?"]}
          - {id: 2, target: "Ist dein Hemd weiß?", en: ["Is your shirt white?"]}
          - {id: 3, target: "Tom trägt einen blauen Hut.", en: ["Tom is wearing a blue hat."]}
          - {id: 4, target: "Haben Sie das auch in Schwarz?", en: ["Do you have this in black too?", "Do you also have this in black?"]}
          - {id: 5, target: "Seine Schuhe sind braun.", en: ["His shoes are brown."]}
          - {id: 6, target: "Das ist nicht meine Größe.", en: ["That's not my size.", "It's not my size."]}
          - {id: 7, target: "Wir haben Ihre Größe nicht.", en: ["We don't have your size."]}
          - {id: 8, target: "Äpfel sind grün, gelb oder rot.", en: ["Apples are green, yellow or red."]}
      - id: de.a1.u05.s03
        kind: function
        title: Buying things
        cefr: A1
        can_do: I can say what I need, talk about prices and pay in a shop.
        requires: [de.a1.u05.s02]
        grammar_note: >-
          Brauchen (to need) and kaufen (to buy) are regular and take the accusative: ich
          brauche einen Mantel. With möchten or können the infinitive goes to the end: ich
          möchte einen Hut kaufen; kann ich mit Karte zahlen? (mit Karte means by card). Zu
          before an adjective means too: das ist zu teuer, and das ist mir zu teuer is
          that's too expensive for me.
