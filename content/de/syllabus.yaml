  - id: de.a2.u04
    title: Plans
    cefr: A2
    skills:
      - id: de.a2.u04.s01
        kind: grammar
        title: What will happen
        cefr: A2
        can_do: I can talk about the future and say what will probably happen.
        requires: [de.a2.u03.s04]
        grammar_note: >-
          Werden with an infinitive at the end talks about the future: ich werde nächste
          Woche zurückkommen. It goes ich werde, du wirst, er or sie wird, wir werden, ihr
          werdet, Sie werden. When a time word already makes the future clear, German often
          uses the present instead: ich komme morgen. With wahrscheinlich (probably),
          werden makes a guess: er wird wahrscheinlich kommen. On its own, werden means to
          become or to get: ich möchte Arzt werden, nächste Woche werde ich dreißig.
        lemmas:
          - {lemma: werden, pos: verb, en: [will, to become, to get], rank: 41}
          - {lemma: nächste, pos: adj, en: [next], rank: 874}
          - {lemma: bald, pos: adv, en: [soon], rank: 402}
          - {lemma: wahrscheinlich, pos: adv, en: [probably], rank: 734}
          - {lemma: Zukunft, pos: noun, gender: f, en: [future], rank: 1294}
          - {lemma: Plan, pos: noun, gender: m, en: [plan], rank: 707}
        examples:
          - {id: 1, target: "Ich werde nächste Woche zurückkommen.", en: ["I will come back next week.", "I'll be back next week."]}
          - {id: 2, target: "Was wirst du nächste Woche machen?", en: ["What are you going to do next week?", "What will you do next week?"]}
          - {id: 3, target: "Er wird bald kommen.", en: ["He will come soon.", "He'll be here soon."]}
          - {id: 4, target: "Tom wird wahrscheinlich nicht kommen.", en: ["Tom probably won't come.", "Tom probably isn't coming."]}
          - {id: 5, target: "Wir werden sehen.", en: ["We'll see.", "We shall see."]}
          - {id: 6, target: "Ich möchte in Zukunft Arzt werden.", en: ["I want to become a doctor in the future.", "I'd like to be a doctor one day."]}
          - {id: 7, target: "Der Plan wird funktionieren.", en: ["The plan will work.", "The plan will work out."]}
          - {id: 8, target: "Nächste Woche werde ich 17.", en: ["I'll be seventeen next week.", "I'm turning seventeen next week."]}
      - id: de.a2.u04.s02
        kind: vocab
        title: Parties and presents
        cefr: A2
        can_do: I can invite someone, accept an invitation and congratulate people.
        requires: [de.a2.u04.s01]
        grammar_note: >-
          Einladen (to invite) and mitbringen (to bring along) are separable: ich lade dich
          ein, er bringt Wein mit. After a modal verb they stay whole: ich möchte dich zu
          meiner Party einladen, was soll ich mitbringen? Their participles are eingeladen
          and mitgebracht. Schenken is to give as a present: was willst du Tom schenken?
          Herzlichen Glückwunsch! means congratulations; add zum Geburtstag for happy
          birthday. Danke für takes the accusative: danke für die Einladung.
