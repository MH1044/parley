  - id: de.a2.u01
    title: What I did
    cefr: A2
    skills:
      - id: de.a2.u01.s01
        kind: grammar
        title: Yesterday
        cefr: A2
        can_do: I can say what I did yesterday and last week.
        requires: [de.a1.u08.s04]
        grammar_note: >-
          The Perfekt is the usual past tense in speech: haben in second place and a past
          participle at the end. Regular verbs make the participle with ge- and -t: machen,
          gemacht; spielen, gespielt; arbeiten, gearbeitet. Verbs that begin with be-, er-
          or ver- and verbs ending in -ieren take no ge-: besucht, erzählt, studiert. Ich
          habe gearbeitet covers I worked, I have worked and I was working. Letzte agrees
          with its noun: letzte Woche, letzten Montag, letztes Jahr. Gestern Nachmittag is
          yesterday afternoon.
        lemmas:
          - {lemma: gestern, pos: adv, en: [yesterday], rank: 273}
          - {lemma: letzte, pos: adj, en: [last], rank: 251}
          - {lemma: Nachmittag, pos: noun, gender: m, en: [afternoon], rank: 1188}
          - {lemma: sagen, pos: verb, en: [to say, to tell], rank: 63}
          - {lemma: fragen, pos: verb, en: [to ask], rank: 150}
          - {lemma: warten, pos: verb, en: [to wait], rank: 209}
          - {lemma: besuchen, pos: verb, en: [to visit], rank: 452}
          - {lemma: erzählen, pos: verb, en: [to tell], rank: 393}
        examples:
          - {id: 1, target: "Was hast du gestern gemacht?", en: ["What did you do yesterday?"]}
          - {id: 2, target: "Wir haben gestern Nachmittag Fußball gespielt.", en: ["We played football yesterday afternoon.", "We played soccer yesterday afternoon."]}
          - {id: 3, target: "Wo hast du letztes Jahr gearbeitet?", en: ["Where did you work last year?", "Where were you working last year?"]}
          - {id: 4, target: "Was hast du gesagt?", en: ["What did you say?"]}
          - {id: 5, target: "Ich habe Tom gefragt.", en: ["I asked Tom.", "I've asked Tom."]}
          - {id: 6, target: "Er hat lange gewartet.", en: ["He waited for a long time.", "He was waiting for a long time."]}
          - {id: 7, target: "Tom hat Maria gestern besucht.", en: ["Tom visited Maria yesterday."]}
          - {id: 8, target: "Er hat mir alles erzählt.", en: ["He told me everything.", "He's told me everything."]}
      - id: de.a2.u01.s02
        kind: grammar
        title: Went, came and stayed
        cefr: A2
        can_do: I can say where I went, when I arrived and where I was born.
        requires: [de.a2.u01.s01]
        grammar_note: >-
          Verbs that mean moving from one place to another or a change of state make the
          Perfekt with sein instead of haben: ich bin gegangen, du bist gefahren, wir sind
          angekommen. Sein, bleiben and passieren take sein too: ich bin dort gewesen, was
          ist passiert? Many of these participles end in -en: gegangen, gekommen, gelaufen.
          In a separable verb, ge goes between the prefix and the verb: angekommen,
          eingeschlafen, zurückgekommen. Wo bist du geboren? (where were you born?) uses the
          present of sein. Laufen means to walk or to run.
        lemmas:
          - {lemma: ankommen, pos: verb, en: [to arrive], rank: 677, separable: an}
          - {lemma: zurückkommen, pos: verb, en: [to come back, to return], rank: 1309, separable: zurück}
          - {lemma: passieren, pos: verb, en: [to happen], rank: 317}
          - {lemma: laufen, pos: verb, en: [to walk, to run, to go], rank: 457}
          - {lemma: einschlafen, pos: verb, en: [to fall asleep], rank: 1746, separable: ein}
          - {lemma: umziehen, pos: verb, en: [to move house, to move], rank: 3082, separable: um}
          - {lemma: geboren, pos: adj, en: [born], rank: 913}
        examples:
          - {id: 1, target: "Wann bist du angekommen?", en: ["When did you arrive?", "When did you get here?"]}
          - {id: 2, target: "Was ist passiert?", en: ["What happened?", "What's happened?"]}
          - {id: 3, target: "Wir sind viel gelaufen.", en: ["We walked a lot.", "We did a lot of walking."]}
          - {id: 4, target: "Ich bin schnell eingeschlafen.", en: ["I fell asleep quickly.", "I quickly fell asleep."]}
          - {id: 5, target: "Wann bist du zurückgekommen?", en: ["When did you get back?", "When did you come back?", "When did you return?"]}
          - {id: 6, target: "Wo sind Sie geboren?", en: ["Where were you born?"]}
          - {id: 7, target: "Wir sind letztes Jahr umgezogen.", en: ["We moved house last year.", "We moved last year."]}
          - {id: 8, target: "Wie ist es gestern gelaufen?", en: ["How did it go yesterday?"]}
      - id: de.a2.u01.s03
        kind: grammar
        title: Was and had
        cefr: A2
        can_do: I can say how I was, what I had and how things used to be.
        requires: [de.a2.u01.s02]
        grammar_note: >-
          With sein and haben, German prefers the simple past (Präteritum) to the Perfekt,
          in speech too: ich war, du warst, er or sie war, wir waren, Sie waren; ich hatte,
          du hattest, er or sie hatte, wir hatten, Sie hatten. The ich and er forms are the
          same. German says ich hatte Glück (I was lucky) and ich hatte Geburtstag (it was
          my birthday). Früher means in the past and often translates used to: früher war
          hier eine Schule. Damals means at that time. Mir war langweilig is I was bored.
        lemmas:
          - {lemma: müde, pos: adj, en: [tired], rank: 594}
          - {lemma: langweilig, pos: adj, en: [boring], rank: 1550}
          - {lemma: Glück, pos: noun, gender: "n", en: [luck, happiness], rank: 847}
          - {lemma: Spaß, pos: noun, gender: m, en: [fun], rank: 699}
          - {lemma: Party, pos: noun, gender: f, en: [party], rank: 1119}
          - {lemma: Geburtstag, pos: noun, gender: m, en: [birthday], rank: 1096}
          - {lemma: früher, pos: adv, en: [in the past, formerly, earlier], rank: 466}
          - {lemma: damals, pos: adv, en: [at that time, back then], rank: 1707}
        examples:
          - {id: 1, target: "Ich war sehr müde.", en: ["I was very tired.", "I was really tired."]}
          - {id: 2, target: "Wie war die Party?", en: ["How was the party?", "How did the party go?"]}
          - {id: 3, target: "Ich hatte viel Spaß auf der Party.", en: ["I had a lot of fun at the party.", "I had a good time at the party."]}
          - {id: 4, target: "Wir hatten Glück.", en: ["We were lucky.", "We got lucky."]}
          - {id: 5, target: "Ich hatte gestern Geburtstag.", en: ["Yesterday was my birthday.", "It was my birthday yesterday."]}
          - {id: 6, target: "Damals war ich noch Student.", en: ["At that time I was still a student.", "Back then I was still a student."]}
          - {id: 7, target: "Früher war hier eine Schule.", en: ["There used to be a school here."]}
          - {id: 8, target: "Mir war langweilig.", en: ["I was bored.", "I felt bored."]}
      - id: de.a2.u01.s04
        kind: function
        title: First, then, finally
        cefr: A2
        can_do: I can tell what happened in order.
        requires: [de.a2.u01.s03]
        grammar_note: >-
          Put events in order with zuerst (first), dann (then), danach (after that), später
          (later) and endlich or schließlich (finally, at last). When one of these words
          starts the sentence, the verb still comes second: zuerst bin ich nach Hause
          gegangen, dann habe ich gegessen. Plötzlich means suddenly. Erst with a time means
          not until: Tom kommt erst morgen; with a number it means only: ich bin erst
          achtzehn. Eine Geschichte is a story, and also history.
        lemmas:
          - {lemma: zuerst, pos: adv, en: [first, at first], rank: 1450}
          - {lemma: danach, pos: adv, en: [after that, afterwards], rank: 1853}
          - {lemma: später, pos: adv, en: [later], rank: 738}
          - {lemma: plötzlich, pos: adv, en: [suddenly], rank: 1135}
          - {lemma: endlich, pos: adv, en: [finally, at last], rank: 1010}
          - {lemma: schließlich, pos: adv, en: [finally, in the end, after all], rank: 2388}
          - {lemma: erst, pos: adv, en: [not until, only], rank: 697}
          - {lemma: Geschichte, pos: noun, gender: f, en: [story, history], rank: 560}
        examples:
          - {id: 1, target: "Wir sind zuerst angekommen.", en: ["We arrived first.", "We got here first."]}
          - {id: 2, target: "Wohin gehen wir danach?", en: ["Where are we going after this?", "Where do we go after that?"]}
          - {id: 3, target: "Wir sehen uns später.", en: ["See you later.", "I'll see you later."]}
          - {id: 4, target: "Ich bin plötzlich müde.", en: ["I'm suddenly tired.", "I feel tired all of a sudden."]}
          - {id: 5, target: "Tom ist endlich eingeschlafen.", en: ["Tom has finally fallen asleep.", "Tom is finally asleep."]}
          - {id: 6, target: "Das ist eine lange Geschichte.", en: ["It's a long story.", "That's a long story."]}
          - {id: 7, target: "Tom kommt erst morgen.", en: ["Tom isn't coming until tomorrow.", "Tom won't come until tomorrow."]}
          - {id: 8, target: "Schließlich habe ich ihn getroffen.", en: ["In the end I met him.", "I finally met him."]}
  - id: de.a2.u02
    title: Health
    cefr: A2
    skills:
      - id: de.a2.u02.s01
        kind: vocab
        title: The body
        cefr: A2
        can_do: I can name parts of the body and say where it hurts.
        requires: [de.a2.u01.s04]
        grammar_note: >-
          Say what hurts with weh tun: mein Kopf tut weh (my head hurts), and with a plural,
          meine Füße tun weh. German often puts the person in the dative and uses the
          article, not my, for parts of the body: mir tut der Rücken weh (my back hurts),
          tut Ihnen der Hals weh? Mir läuft die Nase means my nose is running. Learn the
          plurals too: die Hände, die Füße, die Zähne, die Augen. On its own, tun means to
          do: was tust du?
