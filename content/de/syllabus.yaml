          When the verb already has an object, the pronoun is dative, so mich becomes mir
          and dich becomes dir: ich putze mir die Zähne. Sich interessieren für is to be
          interested in: ich interessiere mich für Musik. Darf ich mich vorstellen? means
          may I introduce myself?
