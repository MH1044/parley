          - {id: 8, target: "Tom kommt immer zu spät.", en: ["Tom is always late."]}
      - id: de.a1.u07.s03
        kind: grammar
        title: My day
        cefr: A1
        can_do: I can describe my daily routine.
        requires: [de.a1.u07.s02]
        grammar_note: >-
          Many routine verbs are separable: a prefix such as auf, ein, fern or an goes to
          the end of the sentence while the verb itself stands second. Aufstehen gives ich
          stehe um sieben Uhr auf; fernsehen gives ich sehe jeden Abend fern. With a second
          verb such as können, the verb stays whole at the end: wann kann ich Sie anrufen?
          Dictionaries list these verbs as one word. Stehen on its own means to stand.
          Schlafen changes its vowel: du schläfst, er schläft.
