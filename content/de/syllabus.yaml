          - {id: 6, target: "Ich sehe jeden Abend fern.", en: ["I watch TV every evening.", "I watch television every evening."]}
          - {id: 7, target: "Wann kann ich Sie anrufen?", en: ["When can I call you?", "When can I phone you?"]}
          - {id: 8, target: "Tom schläft noch.", en: ["Tom is still asleep.", "Tom is still sleeping."]}
      - id: de.a1.u07.s04
        kind: function
        title: Making plans
        cefr: A1
        can_do: I can suggest doing something together and accept or say no.
        requires: [de.a1.u07.s03]
        grammar_note: >-
          Müssen (must, to have to) and wollen (to want) are modal verbs like können, with
