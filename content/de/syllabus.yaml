          - {lemma: Kollege, pos: noun, gender: m, en: [colleague], rank: 3628}
          - {lemma: Kunde, pos: noun, gender: m, en: [customer, client], rank: 2471}
          - {lemma: Kellner, pos: noun, gender: m, en: [waiter], rank: 3404}
          - {lemma: Polizist, pos: noun, gender: m, en: [police officer, policeman], rank: 1469}
          - {lemma: Stelle, pos: noun, gender: f, en: [job, position, place], rank: 789}
          - {lemma: verdienen, pos: verb, en: [to earn, to deserve], rank: 839}
        examples:
          - {id: 1, target: "Was ist Ihr Beruf?", en: ["What do you do for a living?", "What is your job?"]}
          - {id: 2, target: "Er ist von Beruf Arzt.", en: ["He is a doctor by profession.", "He's a doctor."]}
          - {id: 3, target: "Ich habe drei Jahre bei einer großen Firma gearbeitet.", en: ["I worked for a big company for three years.", "I worked at a large company for three years."]}
          - {id: 4, target: "Meine Chefin ist sehr nett.", en: ["My boss is very nice."]}
          - {id: 5, target: "Tom ist mein Kollege.", en: ["Tom is my colleague."]}
          - {id: 6, target: "Sind Sie Kellner?", en: ["Are you a waiter?"]}
          - {id: 7, target: "Sie verdient gut.", en: ["She earns well.", "She makes a good living."]}
          - {id: 8, target: "Wollen Sie die Stelle?", en: ["Do you want the job?"]}
      - id: de.a2.u03.s02
        kind: grammar
        title: Because
        cefr: A2
        can_do: I can give reasons with weil and deshalb.
        requires: [de.a2.u03.s01]
        grammar_note: >-
          Weil (because) sends the verb to the end of its clause: ich bleibe zu Hause, weil
          ich krank bin. With two verbs, the one that changes goes last: weil er arbeiten
          muss. A comma always comes before weil, and warum? (why?) is answered with weil.
          Deshalb (that's why, so) works differently: it is an adverb, so the verb comes
          straight after it: deshalb lerne ich Deutsch. Der Mensch is a person or human
          being; die Menschen are people.
        lemmas:
