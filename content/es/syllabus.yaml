          - {id: 6, target: "¡Ahí viene el autobús!", en: ["Here comes the bus!", "There comes the bus!"]}
          - {id: 7, target: "¿Tomamos un taxi?", en: ["Shall we take a taxi?", "Shall we get a taxi?"]}
          - {id: 8, target: "No tengo coche.", en: ["I don't have a car.", "I haven't got a car."]}
      - id: es.a1.u04.s04
        kind: function
        title: Asking the way
        cefr: A1
        can_do: I can ask the way and understand simple directions.
        requires: [es.a1.u04.s03]
        grammar_note: >-
          Get a stranger's attention with perdone or disculpe, the usted forms, or
          perdona and disculpa with tú. Directions are usually commands. The usted
          command uses the other vowel: gire and tome from -ar verbs, siga from seguir.
          The tú command looks like the él form of the present: gira, toma, sigue.
          Straight on is todo recto, on the right a la derecha, on the left a la
          izquierda. Poder (can) changes its stem: puedo, puedes, puede, podemos,
          podéis, pueden, so ¿puede ayudarme? means can you help me?
