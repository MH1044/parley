  - id: es.a2.u01
    title: What I did
    cefr: A2
    skills:
      - id: es.a2.u01.s01
        kind: grammar
        title: Yesterday
        cefr: A2
        can_do: I can say what I did yesterday and last week.
        requires: [es.a1.u08.s04]
        grammar_note: >-
          The preterite tells what happened at a particular time in the past: ayer
          trabajé, el año pasado viajamos. Regular -ar verbs take -é, -aste, -ó, -amos,
          -asteis, -aron: hablé, hablaste, habló, hablamos, hablasteis, hablaron. The
          written accent matters: hablo is I speak, habló is he or she spoke. The
          nosotros form is the same as in the present, so the context tells you the
          time. In the yo form, verbs in -gar, -car and -zar change their spelling:
          llegué, busqué, empecé. Pasado agrees with its noun: el año pasado, la semana
          pasada. After no, nada means anything: no compré nada.
        lemmas:
          - {lemma: ayer, pos: adv, en: [yesterday], rank: 269}
          - {lemma: anoche, pos: adv, en: [last night], rank: 615}
          - {lemma: pasado, pos: adj, en: [last, past], rank: 302}
          - {lemma: escuchar, pos: verb, en: [to listen, to listen to, to hear], rank: 331}
          - {lemma: mirar, pos: verb, en: [to look, to look at, to watch], rank: 291}
          - {lemma: pasar, pos: verb, en: [to happen, to spend, to pass], rank: 111}
          - {lemma: olvidar, pos: verb, en: [to forget], rank: 317}
          - {lemma: encontrar, pos: verb, en: [to find], rank: 181}
          - {lemma: algo, pos: pron, en: [something, anything], rank: 143}
          - {lemma: nada, pos: pron, en: [nothing, anything], rank: 137}
        examples:
          - {id: 1, target: "Ayer estudiamos inglés.", en: ["Yesterday we studied English.", "We studied English yesterday."]}
          - {id: 2, target: "Anoche llegué tarde.", en: ["I arrived late last night.", "Last night I got in late."]}
          - {id: 3, target: "¿Anoche escuchaste música?", en: ["Did you listen to music last night?"]}
          - {id: 4, target: "¿Qué pasó anoche?", en: ["What happened last night?"]}
          - {id: 5, target: "Encontré mis zapatos.", en: ["I found my shoes."]}
          - {id: 6, target: "No olvidé nada.", en: ["I didn't forget anything.", "I did not forget anything."]}
          - {id: 7, target: "Lo compré la semana pasada.", en: ["I bought it last week."]}
          - {id: 8, target: "Ella me miró.", en: ["She looked at me."]}
      - id: es.a2.u01.s02
        kind: grammar
        title: Writing, learning, losing
        cefr: A2
        can_do: I can say what I wrote, received, learnt or lost.
        requires: [es.a2.u01.s01]
        grammar_note: >-
          Regular -er and -ir verbs share one set of preterite endings: -í, -iste, -ió,
          -imos, -isteis, -ieron. So comer gives comí, comiste, comió, comimos,
          comisteis, comieron, and escribir gives escribí, escribiste, escribió,
          escribimos, escribisteis, escribieron. For -ir verbs the nosotros form is the
          same as in the present (vivimos); for -er verbs it is not (comemos, comimos).
          Stem-changing -er verbs such as volver and perder keep their stem in the
          preterite: volví, perdí. Nacer, to be born, is used in the preterite: nací en
          1990. Perder also means to miss a train or a bus.
        lemmas:
          - {lemma: escribir, pos: verb, en: [to write], rank: 233}
          - {lemma: recibir, pos: verb, en: [to receive, to get], rank: 620}
          - {lemma: aprender, pos: verb, en: [to learn], rank: 251}
          - {lemma: perder, pos: verb, en: [to lose, to miss], rank: 225}
          - {lemma: decidir, pos: verb, en: [to decide], rank: 564}
          - {lemma: nacer, pos: verb, en: [to be born], rank: 688}
          - {lemma: mensaje, pos: noun, gender: m, en: [message], rank: 1293}
        examples:
          - {id: 1, target: "Escribí una carta.", en: ["I wrote a letter."]}
          - {id: 2, target: "Recibí tu mensaje.", en: ["I got your message.", "I received your message."]}
          - {id: 3, target: "Perdieron el tren.", en: ["They missed the train."]}
          - {id: 4, target: "¿Dónde aprendiste alemán?", en: ["Where did you learn German?"]}
          - {id: 5, target: "¿Dónde nació usted?", en: ["Where were you born?"]}
          - {id: 6, target: "Ella decidió ir.", en: ["She decided to go."]}
          - {id: 7, target: "No aprendimos nada.", en: ["We didn't learn anything.", "We did not learn anything."]}
          - {id: 8, target: "Perdí mi llave.", en: ["I lost my key.", "I've lost my key."]}
      - id: es.a2.u01.s03
        kind: grammar
        title: Where I went
        cefr: A2
        can_do: I can say where I went, what I did and what someone said, using the common irregular verbs.
        requires: [es.a2.u01.s02]
        grammar_note: >-
          The most common verbs are irregular in the preterite. Ir and ser share the
          same forms: fui, fuiste, fue, fuimos, fuisteis, fueron, so fui a Madrid is I
          went to Madrid and fue una fiesta is it was a party. Many others take a new
          stem and the endings -e, -iste, -o, -imos, -isteis, -ieron, with no written
          accent: estar gives estuve, tener tuve, hacer hice (but hizo), poder pude,
          poner puse, venir vine, querer quise. Decir and traer drop the i in the ellos
          form: dijeron, trajeron. Dar and ver are short: di, dio; vi, vio.
        lemmas:
          - {lemma: decir, pos: verb, en: [to say, to tell], rank: 79}
          - {lemma: dar, pos: verb, en: [to give], rank: 101}
          - {lemma: fiesta, pos: noun, gender: f, en: [party, holiday], rank: 484}
          - {lemma: verdad, pos: noun, gender: f, en: [truth], rank: 200}
          - {lemma: gente, pos: noun, gender: f, en: [people], rank: 273}
        examples:
          - {id: 1, target: "Fui a su fiesta.", en: ["I went to her party.", "I went to his party."]}
          - {id: 2, target: "¿Cómo estuvo la fiesta?", en: ["How was the party?", "How did the party go?"]}
          - {id: 3, target: "Anoche tuvimos una fiesta.", en: ["We had a party last night."]}
          - {id: 4, target: "¿Qué te dijo?", en: ["What did he say to you?", "What did she tell you?"]}
          - {id: 5, target: "Te dije la verdad.", en: ["I told you the truth."]}
          - {id: 6, target: "Me dio una manzana.", en: ["She gave me an apple.", "He gave me an apple."]}
          - {id: 7, target: "Vino mucha gente.", en: ["A lot of people came.", "Lots of people came."]}
          - {id: 8, target: "Fue una gran fiesta.", en: ["It was a great party.", "That was a great party."]}
      - id: es.a2.u01.s04
        kind: function
        title: Telling a story
        cefr: A2
        can_do: I can tell a short story in order and say what happened in the end.
        requires: [es.a2.u01.s03]
        grammar_note: >-
          To tell a story in order, use primero (first), luego or después (then,
          afterwards), entonces (then, at that moment, or so) and al final (in the
          end). Por fin means at last, after a wait: por fin llegó. De repente means
          suddenly. Contar changes o to ue in the present: cuento, cuentas, cuenta; it
          means to tell a story and also to count. A pronoun joins the end of a
          command: cuéntame (tell me). Alguien means someone; nadie means no one, and
          after the verb it needs no in front: no vino nadie, but nadie vino.
        lemmas:
          - {lemma: luego, pos: adv, en: [then, later, afterwards], rank: 1519}
          - {lemma: entonces, pos: adv, en: [then, so], rank: 779}
