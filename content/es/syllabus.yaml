      - id: es.a1.u04.s03
        kind: grammar
        title: Getting around
        cefr: A1
        can_do: I can say where I am going and how I get there.
        requires: [es.a1.u04.s02]
        grammar_note: >-
          Ir (to go) is irregular: voy, vas, va, vamos, vais, van. It takes a before the
          place, and a followed by el becomes al: voy al banco, vamos a la estación.
          Venir (to come) changes its stem in most forms: vengo, vienes, viene, venimos,
          venís, vienen. Say how you travel with en: en coche, en tren, en autobús, en
          metro; on foot is a pie. In Spain el metro is the underground railway, and it
          also means a metre.
