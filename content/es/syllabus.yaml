          - {lemma: recto, pos: adv, en: [straight, straight on], rank: 5712}
          - {lemma: seguir, pos: verb, en: [to follow, to carry on], rank: 284}
          - {lemma: girar, pos: verb, en: [to turn], rank: 1814}
