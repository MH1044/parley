          - {id: 2, target: "Recuerdo aquellos tiempos.", en: ["I remember those times.", "I remember those days."]}
          - {id: 3, target: "Me acuerdo de aquel día.", en: ["I remember that day."]}
          - {id: 4, target: "¿No te acuerdas?", en: ["Don't you remember?"]}
