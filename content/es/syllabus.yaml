          - {id: 6, target: "No duermo bien.", en: ["I don't sleep well.", "I do not sleep well."]}
          - {id: 7, target: "Estoy muy cansada.", en: ["I'm very tired.", "I am very tired."]}
          - {id: 8, target: "La madre despierta a su hija.", en: ["The mother wakes her daughter up.", "The mother is waking up her daughter."]}
      - id: es.a1.u07.s02
