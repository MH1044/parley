          - {lemma: época, pos: noun, gender: f, en: [time, period], rank: 3186}
          - {lemma: recordar, pos: verb, en: [to remember, to remind], rank: 442}
          - {lemma: acordar, pos: verb, en: [to remember, to agree], rank: 412}
          - {lemma: colegio, pos: noun, gender: m, en: [school], rank: 861}
          - {lemma: vecino, pos: noun, gender: m, en: [neighbour, neighbor], rank: 1177}
        examples:
