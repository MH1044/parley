      - id: es.a2.u07.s03
        kind: grammar
        title: The best in the world
        cefr: A2
        can_do: I can say which is the biggest, the best or the most famous.
        requires: [es.a2.u07.s02]
        grammar_note: >-
          The superlative puts the article before the noun and más or menos after it:
          el edificio más alto (the tallest building), la persona más amable. After a
          superlative, in or of is de: el mejor trabajo del mundo, el museo más famoso
          de Madrid. Mejor and peor usually go before the noun: el mejor restaurante.
          For very or extremely, add -ísimo after dropping a final vowel: alto,
          altísimo; caro, carísimo; it agrees like any adjective: una casa grandísima.
          Persona is always feminine, even for a man.
        lemmas:
