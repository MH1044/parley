          - {id: 6, target: "Suelo levantarme tarde.", en: ["I usually get up late."]}
          - {id: 7, target: "¿Qué sueles desayunar?", en: ["What do you usually have for breakfast?", "What do you usually eat for breakfast?"]}
          - {id: 8, target: "Voy al cine de vez en cuando.", en: ["I go to the cinema from time to time.", "I go to the movies now and then."]}
      - id: es.a2.u06.s03
        kind: grammar
        title: When I was a child
        cefr: A2
        can_do: I can say what I used to do and what life was like when I was young.
        requires: [es.a2.u06.s02]
        grammar_note: >-
          The imperfect also tells what used to happen again and again: cuando era
          pequeño, iba al colegio a pie; jugaba con mis vecinos. Soler in the imperfect
          says the same: solía jugar. Recordar (o to ue) and acordarse de both mean to
          remember: recuerdo aquellos tiempos, me acuerdo de aquel día. Aquel, aquella,
          aquellos and aquellas mean that or those, for things far away in space or in
          time: en aquella época (at that time). In Spain el colegio is a school for
          children.
        lemmas:
