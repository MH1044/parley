          - {id: 6, target: "Cuando era niña, jugaba con mis vecinos.", en: ["When I was a girl, I used to play with my neighbours.", "When I was a child, I played with my neighbors."]}
          - {id: 7, target: "Recuerdo cómo era él.", en: ["I remember how he used to be.", "I remember what he was like."]}
          - {id: 8, target: "En aquella época vivíamos en un pueblo.", en: ["At that time we lived in a village.", "Back then we lived in a small town."]}
      - id: es.a2.u06.s04
        kind: grammar
        title: Giving and lending
        cefr: A2
        can_do: I can talk about giving, lending and showing things to people without repeating their names.
        requires: [es.a2.u06.s03]
        grammar_note: >-
          Object pronouns go before a conjugated verb. Direct objects are lo, la, los,
          las (it, him, her, them); indirect objects, to or for someone, are me, te,
          le, nos, os, les: le pedí ayuda. When both appear, the indirect one comes
          first: me lo prestaron. Le and les become se before lo, la, los and las: se
          lo regalé (I gave it to him or her). With an infinitive or a positive
          command the pronouns join the end: quiero mostrarte algo, dámelo. In Spain le
          is also used for him as a direct object: le vi.
        lemmas:
          - {lemma: regalar, pos: verb, en: [to give as a present], rank: 725}
          - {lemma: prestar, pos: verb, en: [to lend], rank: 682}
          - {lemma: enseñar, pos: verb, en: [to teach, to show], rank: 459}
          - {lemma: mostrar, pos: verb, en: [to show], rank: 700}
          - {lemma: devolver, pos: verb, en: [to give back, to return], rank: 1289}
          - {lemma: pedir, pos: verb, en: [to ask for, to order], rank: 281}
        examples:
          - {id: 1, target: "Se lo regalé.", en: ["I gave it to him as a present.", "I gave it to her as a gift."]}
          - {id: 2, target: "¿Qué le regalaste?", en: ["What did you give him?", "What did you get her as a present?"]}
          - {id: 3, target: "Me lo prestaron.", en: ["They lent it to me."]}
          - {id: 4, target: "¿Me prestas tu bicicleta?", en: ["Will you lend me your bicycle?", "Can I borrow your bike?"]}
          - {id: 5, target: "Te enseñaré francés.", en: ["I'll teach you French.", "I will teach you French."]}
          - {id: 6, target: "Le pedí ayuda.", en: ["I asked him for help.", "I asked her for help."]}
          - {id: 7, target: "Nos lo devolvieron.", en: ["They gave it back to us.", "They returned it to us."]}
          - {id: 8, target: "Quiero mostrarte algo.", en: ["I want to show you something."]}
  - id: es.a2.u07
    title: Comparing and describing
    cefr: A2
    skills:
      - id: es.a2.u07.s01
        kind: grammar
        title: Comparing
        cefr: A2
        can_do: I can compare people and things and say that they are the same or different.
        requires: [es.a2.u06.s04]
        grammar_note: >-
          To compare, use más ... que (more ... than) and menos ... que (less ...
          than): soy más alto que tú, trabajas menos que yo. Tan ... como means as ...
          as: soy tan viejo como tú. Four adjectives have their own forms: bueno gives
          mejor, malo gives peor, and for age grande gives mayor and pequeño gives
          menor, so mi hermano menor is my younger brother. El mismo (the same) agrees
          with its noun and lo mismo means the same thing; igual and diferente change
          only for number: son iguales.
        lemmas:
          - {lemma: tan, pos: adv, en: [so, as], rank: 131}
          - {lemma: como, pos: conj, en: [as, like], rank: 104}
          - {lemma: peor, pos: adj, en: [worse, worst], rank: 1119}
          - {lemma: menor, pos: adj, en: [younger, smaller], rank: 1630}
          - {lemma: mismo, pos: adj, en: [same], rank: 227}
          - {lemma: igual, pos: adj, en: [the same, equal], rank: 1106}
          - {lemma: diferente, pos: adj, en: [different], rank: 931}
        examples:
          - {id: 1, target: "Soy tan viejo como tú.", en: ["I'm as old as you.", "I am as old as you are."]}
          - {id: 2, target: "Mi hermana es menor que yo.", en: ["My sister is younger than me.", "My sister is younger than I am."]}
          - {id: 3, target: "Mañana será peor.", en: ["It will be worse tomorrow.", "Tomorrow will be worse."]}
          - {id: 4, target: "¿Tienes hermanos menores?", en: ["Do you have younger brothers?", "Do you have any younger brothers or sisters?"]}
          - {id: 5, target: "Tenemos el mismo problema.", en: ["We have the same problem."]}
          - {id: 6, target: "Todos son iguales.", en: ["They are all the same.", "They're all the same."]}
          - {id: 7, target: "Esta vez es diferente.", en: ["This time is different.", "This time it's different."]}
          - {id: 8, target: "Sé tan poco como tú.", en: ["I know as little as you do.", "I know as little as you."]}
      - id: es.a2.u07.s02
        kind: vocab
        title: Describing things
        cefr: A2
        can_do: I can describe what people, places and things are like.
        requires: [es.a2.u07.s01]
        grammar_note: >-
          Some adjectives change their meaning with ser and estar: ser aburrido is to be
          boring, estar aburrido is to be bored; ser rico is to be rich, but la comida
          está rica means the food tastes good. Antiguo means old in the sense of from
          long ago: una ciudad antigua, un edificio antiguo. Fuerte is strong and also
          loud: habla más fuerte. ¡Qué! with an adjective makes an exclamation: ¡qué
          bonito! (how pretty!), ¡qué gato tan feo! (what an ugly cat!).
