          - {id: 3, target: "El hotel está al lado del cine.", en: ["The hotel is next to the cinema.", "The hotel is next to the movie theater."]}
          - {id: 4, target: "¿Dónde está el museo?", en: ["Where is the museum?", "Where's the museum?"]}
          - {id: 5, target: "Hay muchos hoteles en el centro.", en: ["There are many hotels in the town centre.", "There are a lot of hotels downtown."]}
          - {id: 6, target: "Me gusta tu ciudad.", en: ["I like your city.", "I like your town."]}
