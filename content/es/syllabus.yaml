          command: espere (wait), hable (speak), repita (repeat). A pronoun joins the
          end of the command: repítalo (repeat it). Add por favor to sound polite.
          Entender changes e to ie: entiendo, entiendes, entiende, so no entiendo means
          I don't understand. Funcionar is to work, for machines and plans: el ascensor
          no funciona. Problema ends in -a but is masculine: un problema, no hay
          problema.
