        examples:
          - {id: 1, target: "¿Qué haces en tu tiempo libre?", en: ["What do you do in your free time?", "What do you do in your spare time?"]}
          - {id: 2, target: "Me encanta leer.", en: ["I love reading.", "I love to read."]}
          - {id: 3, target: "¿Te gusta bailar?", en: ["Do you like dancing?", "Do you like to dance?"]}
          - {id: 4, target: "No sé cantar.", en: ["I can't sing.", "I don't know how to sing."]}
          - {id: 5, target: "¿Tocas la guitarra?", en: ["Do you play the guitar?"]}
