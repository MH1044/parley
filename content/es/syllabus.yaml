          - {lemma: zapato, pos: noun, gender: m, en: [shoe], rank: 665}
          - {lemma: vestido, pos: noun, gender: m, en: [dress], rank: 889}
          - {lemma: falda, pos: noun, gender: f, en: [skirt], rank: 2206}
          - {lemma: chaqueta, pos: noun, gender: f, en: [jacket], rank: 2508}
          - {lemma: abrigo, pos: noun, gender: m, en: [coat], rank: 1415}
