          - {lemma: feo, pos: adj, en: [ugly], rank: 2250}
          - {lemma: limpio, pos: adj, en: [clean], rank: 1360}
          - {lemma: sucio, pos: adj, en: [dirty], rank: 1614}
          - {lemma: moderno, pos: adj, en: [modern], rank: 2112}
          - {lemma: antiguo, pos: adj, en: [old, ancient, antique], rank: 1264}
          - {lemma: cómodo, pos: adj, en: [comfortable], rank: 2037}
