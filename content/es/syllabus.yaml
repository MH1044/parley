  - id: es.a1.u05
    title: Shopping
    cefr: A1
    skills:
      - id: es.a1.u05.s01
        kind: vocab
        title: Clothes
        cefr: A1
        can_do: I can name clothes and say what someone is wearing.
        requires: [es.a1.u04.s04]
        grammar_note: >-
          Llevar means to wear as well as to carry: llevo un abrigo (I am wearing a
          coat). For putting clothes on, use ponerse: ponte el abrigo (put your coat
          on). When it is clear whose clothes they are, Spanish uses the article rather
          than a possessive: me pongo los zapatos (I put my shoes on). Trousers are el
          pantalón or los pantalones; both are normal in Spain. A clothes shop is una
          tienda de ropa.
        lemmas:
          - {lemma: ropa, pos: noun, gender: f, en: [clothes, clothing], rank: 788}
          - {lemma: camisa, pos: noun, gender: f, en: [shirt], rank: 1122}
