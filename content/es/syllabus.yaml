  - id: es.a1.u07
    title: Time and routine
    cefr: A1
    skills:
      - id: es.a1.u07.s01
        kind: grammar
        title: My daily routine
        cefr: A1
        can_do: I can describe my morning and evening routine.
        requires: [es.a1.u06.s04]
        grammar_note: >-
          Many routine verbs are reflexive: they take me, te, se, nos or os when you do
          the action to yourself. Levantar means to raise, and levantarse means to get
          up: me levanto a las siete. In the same way you have despertarse (to wake up),
          acostarse (to go to bed) and ducharse (to have a shower). Compare la madre
          despierta a su hija (wakes her daughter) with me despierto (I wake up). Some
          change their stem: me acuesto, me despierto, and dormir gives duermo, duermes,
          duerme, dormimos, dormís, duermen.
        lemmas:
          - {lemma: levantar, pos: verb, en: [to raise, to lift], rank: 444}
          - {lemma: despertar, pos: verb, en: [to wake, to wake up], rank: 666}
          - {lemma: acostar, pos: verb, en: [to put to bed, to lay down], rank: 1287}
          - {lemma: duchar, pos: verb, en: [to shower], rank: 1728}
          - {lemma: dormir, pos: verb, en: [to sleep], rank: 255}
          - {lemma: temprano, pos: adv, en: [early], rank: 639}
          - {lemma: cansado, pos: adj, en: [tired], rank: 521}
        examples:
          - {id: 1, target: "Me levanto a las siete.", en: ["I get up at seven."]}
