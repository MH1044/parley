          - {lemma: por fin, pos: expr, en: [at last, finally], rank: null}
          - {lemma: de repente, pos: expr, en: [suddenly], rank: null}
          - {lemma: contar, pos: verb, en: [to tell, to count], rank: 249}
          - {lemma: historia, pos: noun, gender: f, en: [story, history], rank: 463}
          - {lemma: alguien, pos: pron, en: [someone, somebody, anyone], rank: 287}
          - {lemma: nadie, pos: pron, en: [no one, nobody, anyone], rank: 205}
        examples:
          - {id: 1, target: "Primero fui al banco y luego al museo.", en: ["First I went to the bank and then to the museum."]}
          - {id: 2, target: "¿Entonces qué pasó?", en: ["Then what happened?", "So what happened?"]}
          - {id: 3, target: "Pasó de repente.", en: ["It happened suddenly."]}
          - {id: 4, target: "Por fin llegó el autobús.", en: ["At last the bus arrived.", "The bus finally came."]}
          - {id: 5, target: "Al final no fuimos a la playa.", en: ["In the end we didn't go to the beach.", "In the end we did not go to the beach."]}
          - {id: 6, target: "Cuéntame la historia.", en: ["Tell me the story."]}
          - {id: 7, target: "No vino nadie.", en: ["Nobody came.", "No one came."]}
          - {id: 8, target: "¿Me llamó alguien?", en: ["Did anyone call me?", "Did somebody call me?"]}
  - id: es.a2.u02
    title: Health
    cefr: A2
    skills:
      - id: es.a2.u02.s01
        kind: vocab
        title: Where it hurts
        cefr: A2
        can_do: I can name the parts of the body and say where it hurts.
        requires: [es.a2.u01.s04]
        grammar_note: >-
          Doler (to hurt) works like gustar: the part of the body is the subject, so me
          duele la cabeza is literally the head hurts me. One thing takes duele and
          several take duelen: me duelen los pies. Doler changes o to ue: duele,
          duelen. Spanish uses the article, not a possessive, for parts of your own
          body: me duele el brazo (my arm hurts). Tener dolor de is another way to say
          it: tengo dolor de cabeza (I have a headache). Mano ends in -o but is
          feminine: la mano.
        lemmas:
          - {lemma: doler, pos: verb, en: [to hurt, to ache], rank: 863}
          - {lemma: dolor, pos: noun, gender: m, en: [pain, ache], rank: 793}
          - {lemma: cabeza, pos: noun, gender: f, en: [head], rank: 724}
          - {lemma: brazo, pos: noun, gender: m, en: [arm], rank: 1150}
          - {lemma: pierna, pos: noun, gender: f, en: [leg], rank: 1278}
          - {lemma: mano, pos: noun, gender: f, en: [hand], rank: 375}
          - {lemma: pie, pos: noun, gender: m, en: [foot], rank: 734}
          - {lemma: espalda, pos: noun, gender: f, en: [back], rank: 1627}
          - {lemma: estómago, pos: noun, gender: m, en: [stomach], rank: 2205}
          - {lemma: diente, pos: noun, gender: m, en: [tooth], rank: 1073}
          - {lemma: garganta, pos: noun, gender: f, en: [throat], rank: 3670}
          - {lemma: dedo, pos: noun, gender: m, en: [finger, toe], rank: 1314}
        examples:
          - {id: 1, target: "Me duele la cabeza.", en: ["I have a headache.", "My head hurts."]}
          - {id: 2, target: "¿Dónde le duele?", en: ["Where does it hurt?"]}
          - {id: 3, target: "Me duelen los pies.", en: ["My feet hurt.", "I have sore feet."]}
          - {id: 4, target: "Tengo dolor de espalda.", en: ["I have a backache.", "I have a pain in my back."]}
          - {id: 5, target: "¿Te duele el estómago?", en: ["Does your stomach hurt?"]}
          - {id: 6, target: "Me duele la garganta.", en: ["I have a sore throat.", "My throat hurts."]}
          - {id: 7, target: "Me duele la pierna.", en: ["My leg hurts.", "My leg is aching."]}
          - {id: 8, target: "Levante los brazos.", en: ["Lift up your arms.", "Raise your arms."]}
      - id: es.a2.u02.s02
        kind: grammar
        title: How I feel
        cefr: A2
        can_do: I can say how I feel and describe a small accident.
        requires: [es.a2.u02.s01]
        grammar_note: >-
          Reflexive verbs are common when you talk about health. Sentirse (to feel)
          changes e to ie: me siento mal, ¿cómo te sientes? In the preterite it is me
          sentí, se sintió. With a part of the body, the reflexive pronoun shows whose
          it is and the body part takes the article: me rompí la pierna (I broke my
          leg), me corté el dedo (I cut my finger). Caerse (to fall over) has a y in
          some forms: se cayó. Hacerse daño means to hurt yourself. Use estar for how
          someone is now: estoy enfermo, está mejor.
        lemmas:
          - {lemma: sentir, pos: verb, en: [to feel, to be sorry], rank: 192}
          - {lemma: romper, pos: verb, en: [to break], rank: 493}
          - {lemma: cortar, pos: verb, en: [to cut], rank: 549}
          - {lemma: caer, pos: verb, en: [to fall], rank: 472}
          - {lemma: daño, pos: noun, gender: m, en: [harm, damage, hurt], rank: 1363}
          - {lemma: enfermo, pos: adj, en: [ill, sick], rank: 630}
          - {lemma: mal, pos: adv, en: [bad, badly, ill], rank: 272}
          - {lemma: mejor, pos: adj, en: [better, best], rank: 184}
        examples:
          - {id: 1, target: "Me siento mal.", en: ["I feel ill.", "I feel bad.", "I feel sick."]}
          - {id: 2, target: "¿Cómo te sientes?", en: ["How do you feel?", "How are you feeling?"]}
          - {id: 3, target: "¿Te sientes mejor?", en: ["Are you feeling better?", "Do you feel better?"]}
          - {id: 4, target: "Ella está enferma.", en: ["She is ill.", "She is sick."]}
          - {id: 5, target: "Me rompí la pierna.", en: ["I broke my leg."]}
          - {id: 6, target: "Me corté el dedo.", en: ["I cut my finger.", "I've cut my finger."]}
          - {id: 7, target: "El niño se cayó.", en: ["The child fell.", "The boy fell over."]}
          - {id: 8, target: "¿Alguien se hizo daño?", en: ["Did anybody get hurt?", "Did anyone get hurt?"]}
      - id: es.a2.u02.s03
        kind: grammar
        title: Since when
        cefr: A2
        can_do: I can say how long ago something happened and how long I have been ill.
        requires: [es.a2.u02.s02]
        grammar_note: >-
          Hace with a length of time after a past tense means ago: se fue hace un
          minuto. For something that started in the past and is still going on,
          Spanish uses the present tense, not a past one, with desde (since) or desde
          hace (for): está enfermo desde el domingo, trabajo aquí desde hace un año.
          Hace ... que at the start of the sentence works the same way: hace tres días
          que tengo tos. Ask ¿desde cuándo...? (since when?). Tener goes with fiebre,
          tos and gripe, often with no article: tengo fiebre; a cold is un resfriado.
        lemmas:
          - {lemma: desde, pos: prep, en: [since, from], rank: 368}
          - {lemma: minuto, pos: noun, gender: m, en: [minute], rank: 531}
          - {lemma: fiebre, pos: noun, gender: f, en: [fever, temperature], rank: 2514}
          - {lemma: tos, pos: noun, gender: f, en: [cough], rank: 4205}
          - {lemma: gripe, pos: noun, gender: f, en: [flu, influenza], rank: 4950}
          - {lemma: resfriado, pos: noun, gender: m, en: [cold], rank: 2100}
        examples:
          - {id: 1, target: "Él se fue hace un minuto.", en: ["He left a minute ago."]}
          - {id: 2, target: "Mi hermano está enfermo desde ayer.", en: ["My brother has been ill since yesterday.", "My brother has been sick since yesterday."]}
          - {id: 3, target: "Tiene fiebre desde hace días.", en: ["He has had a fever for days.", "She has had a temperature for days."]}
          - {id: 4, target: "Trabajo aquí desde hace un año.", en: ["I have been working here for a year.", "I've worked here for a year."]}
          - {id: 5, target: "¿Desde cuándo hablas francés?", en: ["How long have you been speaking French?", "How long have you spoken French?"]}
          - {id: 6, target: "Tengo un resfriado.", en: ["I have a cold.", "I've got a cold."]}
          - {id: 7, target: "Tengo gripe y estoy cansado.", en: ["I have the flu and I'm tired.", "I've got flu and I'm tired."]}
          - {id: 8, target: "Hace tres días que tengo tos.", en: ["I have had a cough for three days.", "I've had a cough for three days."]}
      - id: es.a2.u02.s04
        kind: function
        title: The doctor's advice
        cefr: A2
        can_do: I can understand and give simple advice about health.
        requires: [es.a2.u02.s03]
        grammar_note: >-
          Advice often comes as a command. The tú command looks like the él form of the
          present: descansa, toma, bebe. The usted command swaps the vowel: descanse,
          tome, beba. Negative commands always use the swapped vowel, and tú adds -s:
          no fumes, no bebas; for usted, no fume, no beba. A pronoun joins the end of a
          positive command (cuídate, cuídese) but goes before a negative one (no te
          levantes). Softer advice uses deberías (you should) or tener que (to have
          to): deberías descansar, tienes que descansar. Demasiado means too much.
        lemmas:
