          Add un or una only when you describe the person: es un médico muy bueno. Most
          professions have a feminine form: profesor, profesora; médico, médica.
          Trabajar and estudiar are regular -ar verbs: trabajo, trabajas, trabaja,
          trabajamos, trabajáis, trabajan. Voy al trabajo means I go to work. With days,
          el lunes means on Monday and los lunes means on Mondays.
