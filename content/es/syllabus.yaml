          - {id: 3, target: "Por favor, ¿me trae otra taza de café?", en: ["Could I have another cup of coffee, please?", "Could you bring me another cup of coffee, please?"]}
          - {id: 4, target: "Tráigame la cuenta, por favor.", en: ["Bring me the bill, please.", "Bring the bill, please."]}
          - {id: 5, target: "Me gustaría más café.", en: ["I'd like some more coffee.", "I would like more coffee."]}
          - {id: 6, target: "¿Quieres un poco más?", en: ["Would you like some more?", "Would you like a little more?"]}
          - {id: 7, target: "¿Me pone un café con leche?", en: ["Can I have a white coffee?", "Could I have a coffee with milk?"]}
          - {id: 8, target: "¿Qué le pongo?", en: ["What can I get you?", "What would you like?"]}
  - id: es.a1.u04
    title: Around town
    cefr: A1
    skills:
      - id: es.a1.u04.s01
        kind: grammar
        title: Where things are
        cefr: A1
        can_do: I can say where something is and whether there is one nearby.
        requires: [es.a1.u03.s04]
        grammar_note: >-
          Spanish has two verbs for to be. Ser says who or what something is; estar says
          where something is and how someone feels: el banco está aquí, estoy bien.
          Estar is irregular: estoy, estás, está, estamos, estáis, están. Hay (from
          haber) means there is or there are and never changes: hay un hotel, hay dos
          bancos. Use hay to say that something exists, usually with un, una or no
          article, and está for where a particular thing is: ¿hay un banco cerca? ¿dónde
          está el banco? Aquí is here, ahí is there near you, allí is over there.
        lemmas:
          - {lemma: estar, pos: verb, en: [to be], rank: 14}
          - {lemma: haber, pos: verb, en: [there is, there are], rank: 23}
          - {lemma: cerca, pos: adv, en: [near, nearby, close], rank: 576}
          - {lemma: lejos, pos: adv, en: [far, far away], rank: 812}
          - {lemma: allí, pos: adv, en: [there, over there], rank: 376}
          - {lemma: ahí, pos: adv, en: [there], rank: 432}
        examples:
          - {id: 1, target: "Barcelona está en España.", en: ["Barcelona is in Spain."]}
          - {id: 2, target: "Está muy cerca.", en: ["It's very close.", "It is very near."]}
          - {id: 3, target: "No está lejos de aquí.", en: ["It's not far from here.", "It is not far from here."]}
          - {id: 4, target: "¿Qué hay para comer?", en: ["What is there to eat?", "What's there to eat?"]}
          - {id: 5, target: "Estoy bien, ¿y tú?", en: ["I'm fine, and you?", "I am fine, and you?"]}
          - {id: 6, target: "No hay café.", en: ["There's no coffee.", "There is no coffee."]}
          - {id: 7, target: "Ellos están allí.", en: ["They're there.", "They are over there."]}
          - {id: 8, target: "¿Quién está ahí?", en: ["Who's there?", "Who is there?"]}
      - id: es.a1.u04.s02
        kind: vocab
        title: Places in town
        cefr: A1
        can_do: I can name the main places in a town.
        requires: [es.a1.u04.s01]
        grammar_note: >-
          Place nouns take el or la like any other noun: la estación, el museo, la
          calle. De followed by el becomes del: el hotel está al lado del cine, delante
          del museo; with la it stays apart: al lado de la estación. To ask whether
          there is a place nearby, use hay with un or una: ¿hay un banco cerca de aquí?
          To ask where a particular place is, use está: ¿dónde está la estación? Banco
          means a bank and also a bench in a park.
