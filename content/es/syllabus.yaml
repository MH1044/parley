          - {id: 2, target: "¿Puedo probarme esto?", en: ["Can I try this on?", "May I try this on?"]}
          - {id: 3, target: "Pruébate esa camisa.", en: ["Try on that shirt.", "Try that shirt on."]}
          - {id: 4, target: "¿Qué busca usted?", en: ["What are you looking for?"]}
          - {id: 5, target: "¿Tiene esta camisa en una talla más grande?", en: ["Do you have this shirt in a bigger size?", "Do you have this shirt in a larger size?"]}
          - {id: 6, target: "Esas manzanas son grandes.", en: ["Those apples are big."]}
          - {id: 7, target: "Este libro es pequeño.", en: ["This book is small."]}
          - {id: 8, target: "¿Te gusta eso?", en: ["Do you like that?"]}
      - id: es.a1.u05.s04
        kind: function
        title: Prices and paying
        cefr: A1
        can_do: I can ask what something costs and pay for it.
        requires: [es.a1.u05.s03]
        grammar_note: >-
          Costar changes its stem: cuesta for one thing and cuestan for several: ¿cuánto
