          - {lemma: paraguas, pos: noun, gender: m, en: [umbrella], rank: 1236}
          - {lemma: coger, pos: verb, en: [to take, to catch, to get], rank: 730}
          - {lemma: fuera, pos: adv, en: [outside, out], rank: 379}
          - {lemma: dentro, pos: adv, en: [inside, in], rank: 1049}
        examples:
          - {id: 1, target: "Si llueve, llámame.", en: ["If it rains, call me.", "Call me if it rains."]}
          - {id: 2, target: "Coge un paraguas.", en: ["Take an umbrella.", "Grab an umbrella."]}
          - {id: 3, target: "Fuera está lloviendo.", en: ["It's raining outside.", "It is raining outside."]}
          - {id: 4, target: "Si quieres, puedes ir.", en: ["You can go if you want.", "If you want, you can go."]}
          - {id: 5, target: "Puedo coger el autobús.", en: ["I can take the bus.", "I can catch the bus."]}
          - {id: 6, target: "Si hace buen tiempo, iremos a la playa.", en: ["If the weather is good, we'll go to the beach.", "If it's nice, we will go to the beach."]}
          - {id: 7, target: "Si llueve, nos quedamos en casa.", en: ["If it rains, we stay at home.", "If it rains, we'll stay in."]}
          - {id: 8, target: "¿Hay alguien ahí dentro?", en: ["Is anybody in there?", "Is someone in there?"]}
  - id: es.a2.u06
    title: Free time
    cefr: A2
    skills:
      - id: es.a2.u06.s01
        kind: vocab
        title: Free time
        cefr: A2
        can_do: I can say what I do in my free time and what I like doing.
        requires: [es.a2.u05.s04]
        grammar_note: >-
          Jugar (to play a game or a sport) changes u to ue: juego, juegas, juega,
          jugamos, jugáis, juegan. In Spain it takes a and the article before the
          sport: juego al fútbol, jugamos al tenis. Tocar is to play an instrument, and
          also to touch: toco la guitarra. Ver la televisión means to watch television.
          With gustar and encantar an activity is an infinitive and the verb stays
          singular: me encanta leer, nos gusta bailar. Leer has a y in the preterite:
          leyó, leyeron.
        lemmas:
          - {lemma: tiempo libre, pos: expr, en: [free time, spare time], rank: null}
          - {lemma: jugar, pos: verb, en: [to play], rank: 226}
          - {lemma: nadar, pos: verb, en: [to swim], rank: 118}
          - {lemma: correr, pos: verb, en: [to run], rank: 424}
          - {lemma: bailar, pos: verb, en: [to dance], rank: 876}
          - {lemma: cantar, pos: verb, en: [to sing], rank: 485}
          - {lemma: leer, pos: verb, en: [to read], rank: 206}
          - {lemma: tocar, pos: verb, en: [to play, to touch], rank: 369}
          - {lemma: guitarra, pos: noun, gender: f, en: [guitar], rank: 1186}
