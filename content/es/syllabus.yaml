schema: parley.syllabus/1
lang: es
name: Spanish for English speakers
variety: Spain Spanish; usted and tú both taught
version: 1
function_words: [el, la, los, las, un, una, unos, unas, "y", e, o, pero, de, a, en, con, sin,
  por, para, "no", sí, yo, tú, él, ella, usted, nosotros, nosotras, vosotros, vosotras, ellos,
  ellas, ustedes, me, te, se, nos, os, lo, le, les, mí, ti, que, qué, mi, mis, tu, tus, su, sus,
  cómo, dónde, cuánto, cuánta, cuántos, cuántas, cuál, quién]
names: [Ana, Luis, Carmen, Pablo, María, Juan, Carlos, Pedro, Lucía, José, Laura, Madrid, Sevilla,
  España, Barcelona, Valencia]
units:
  - id: es.a1.u01
    title: Hello
    cefr: A1
    skills:
      - id: es.a1.u01.s01
        kind: function
        title: Greetings
        cefr: A1
        can_do: I can say hello and goodbye and ask how someone is.
        requires: []
        grammar_note: >-
          Questions and exclamations open with an upside-down mark: ¿Qué tal? ¡Hola!
          Say buenos días until lunch, buenas tardes until dark, then buenas noches.
          The adjective changes with the noun it describes: buenos goes with días,
          buenas with tardes and noches.
        lemmas:
          - {lemma: hola, pos: intj, en: [hello, hi], rank: 1672}
          - {lemma: adiós, pos: intj, en: [goodbye, bye], rank: 2659}
          - {lemma: bueno, pos: adj, en: [good], rank: 102}
          - {lemma: día, pos: noun, gender: m, en: [day], rank: 127}
          - {lemma: tarde, pos: noun, gender: f, en: [afternoon, evening], rank: 253}
          - {lemma: noche, pos: noun, gender: f, en: [night], rank: 252}
          - {lemma: tal, pos: adv, en: [such], rank: 584}
          - {lemma: gracias, pos: intj, en: [thank you, thanks], rank: 470}
          - {lemma: bien, pos: adv, en: [well, fine], rank: 94}
          - {lemma: muy, pos: adv, en: [very], rank: 90}
        examples:
          - {id: 1, target: "Hola, ¿qué tal?", en: ["Hi, how are you?", "Hello, how are you?"]}
          - {id: 2, target: "Buenos días.", en: ["Good morning."]}
          - {id: 3, target: "Buenas noches, Ana.", en: ["Good night, Ana.", "Good evening, Ana."]}
          - {id: 4, target: "Adiós, gracias.", en: ["Goodbye, thank you.", "Bye, thanks."]}
          - {id: 5, target: "Buenas tardes, Luis.", en: ["Good afternoon, Luis.", "Good evening, Luis."]}
          - {id: 6, target: "Muy bien, gracias. ¿Y tú?", en: ["Very well, thank you. And you?", "Fine, thanks. And you?"]}
          - {id: 7, target: "Hola, buenos días.", en: ["Hello, good morning."]}
      - id: es.a1.u01.s02
        kind: function
        title: Names
        cefr: A1
        can_do: I can say my name and ask someone their name.
        requires: [es.a1.u01.s01]
        grammar_note: >-
          Llamarse means to call oneself, so the small pronoun in front changes with the
          person: me llamo (I am called), te llamas (you are called, with tú), se llama
          (he, she or usted is called). Use usted with people you do not know well and
          with anyone clearly older than you; use tú with friends and family.
        lemmas:
          - {lemma: llamarse, pos: verb, en: [to be called], rank: 860}
          - {lemma: llamar, pos: verb, en: [to call], rank: 177}
          - {lemma: nombre, pos: noun, gender: m, en: [name], rank: 378}
          - {lemma: señor, pos: noun, gender: m, en: [sir, Mr, gentleman], rank: 760}
          - {lemma: señora, pos: noun, gender: f, en: [madam, Mrs, lady], rank: 705}
          - {lemma: mucho gusto, pos: expr, en: [nice to meet you, pleased to meet you], rank: null}
          - {lemma: encantado, pos: adj, en: [pleased to meet you, delighted], rank: 3117}
          - {lemma: perdón, pos: intj, en: [sorry, excuse me], rank: 1916}
        examples:
          - {id: 1, target: "Me llamo Ana.", en: ["My name is Ana.", "I am called Ana."]}
          - {id: 2, target: "¿Cómo te llamas?", en: ["What is your name?", "What are you called?"]}
          - {id: 3, target: "¿Cómo se llama usted?", en: ["What is your name?"]}
          - {id: 4, target: "Él se llama Pablo.", en: ["His name is Pablo.", "He is called Pablo."]}
          - {id: 5, target: "Mucho gusto, señora.", en: ["Nice to meet you, madam.", "Pleased to meet you, madam."]}
          - {id: 6, target: "Encantada, señor.", en: ["Pleased to meet you, sir."]}
          - {id: 7, target: "Perdón, ¿cómo se llama?", en: ["Sorry, what is your name?", "Excuse me, what is your name?"]}
          - {id: 8, target: "¿Y tu nombre?", en: ["And your name?", "And what is your name?"]}
          - {id: 9, target: "Gracias por llamar.", en: ["Thanks for calling.", "Thank you for calling."]}
      - id: es.a1.u01.s03
        kind: grammar
        title: Where you are from
        cefr: A1
        can_do: I can say where I am from and which languages I speak.
        requires: [es.a1.u01.s02]
        grammar_note: >-
          Ser is the verb to be for who you are and where you are from: soy, eres, es,
          somos, sois, son. Spanish usually drops the subject pronoun, so soy de Madrid
          is a full sentence; add yo or usted only for contrast or politeness. Regular
          -ar verbs like hablar follow one pattern: hablo, hablas, habla, hablamos,
          habláis, hablan. Language names are not capitalised: español, inglés.
        lemmas:
          - {lemma: ser, pos: verb, en: [to be], rank: 4}
          - {lemma: hablar, pos: verb, en: [to speak, to talk], rank: 92}
          - {lemma: español, pos: noun, gender: m, en: [Spanish], rank: 808}
          - {lemma: inglés, pos: noun, gender: m, en: [English], rank: 267}
          - {lemma: francés, pos: noun, gender: m, en: [French], rank: 258}
          - {lemma: alemán, pos: noun, gender: m, en: [German], rank: 906}
          - {lemma: también, pos: adv, en: [also, too], rank: 359}
          - {lemma: aquí, pos: adv, en: [here], rank: 105}
        examples:
          - {id: 1, target: "Soy de Madrid.", en: ["I am from Madrid."]}
          - {id: 2, target: "¿De dónde eres?", en: ["Where are you from?"]}
          - {id: 3, target: "Ana es de Sevilla.", en: ["Ana is from Seville."]}
          - {id: 4, target: "Hablo español y francés.", en: ["I speak Spanish and French."]}
          - {id: 5, target: "¿Hablas inglés?", en: ["Do you speak English?"]}
          - {id: 6, target: "¿Es usted de aquí?", en: ["Are you from here?"]}
          - {id: 7, target: "Luis también habla alemán.", en: ["Luis also speaks German.", "Luis speaks German too."]}
          - {id: 8, target: "Somos de España.", en: ["We are from Spain."]}
      - id: es.a1.u01.s04
        kind: grammar
        title: Numbers and age
        cefr: A1
        can_do: I can count to twenty and say how old I am.
        requires: [es.a1.u01.s03]
        grammar_note: >-
          Age uses tener (to have), not ser: tengo veinte años is literally I have twenty
          years. Tener changes its stem in most forms: tengo, tienes, tiene, tenemos,
          tenéis, tienen. Numbers from sixteen to twenty-nine are written as one word
          (dieciséis, veintiuno); from thirty-one on they use y: treinta y uno.
        lemmas:
          - {lemma: tener, pos: verb, en: [to have], rank: 21}
          - {lemma: año, pos: noun, gender: m, en: [year], rank: 151}
          - {lemma: número, pos: noun, gender: m, en: [number], rank: 691}
          - {lemma: teléfono, pos: noun, gender: m, en: [telephone, phone], rank: 539}
          - {lemma: uno, pos: num, en: [one], rank: 36}
          - {lemma: dos, pos: num, en: [two], rank: 163}
          - {lemma: tres, pos: num, en: [three], rank: 257}
          - {lemma: cuatro, pos: num, en: [four], rank: 742}
          - {lemma: cinco, pos: num, en: [five], rank: 481}
          - {lemma: seis, pos: num, en: [six], rank: 796}
          - {lemma: siete, pos: num, en: [seven], rank: 1012}
          - {lemma: ocho, pos: num, en: [eight], rank: 1404}
          - {lemma: nueve, pos: num, en: [nine], rank: 1551}
          - {lemma: diez, pos: num, en: [ten], rank: 462}
        examples:
          - {id: 1, target: "Tengo veinte años.", en: ["I am twenty years old.", "I am twenty."]}
          - {id: 2, target: "¿Cuántos años tienes?", en: ["How old are you?"]}
          - {id: 3, target: "¿Cuál es tu número de teléfono?", en: ["What is your phone number?"]}
          - {id: 4, target: "Uno, dos, tres, cuatro, cinco.", en: ["One, two, three, four, five."]}
          - {id: 5, target: "Ana tiene treinta y dos años.", en: ["Ana is thirty-two years old.", "Ana is thirty-two."]}
          - {id: 6, target: "¿Cuántos años tiene usted?", en: ["How old are you?"]}
          - {id: 7, target: "Seis, siete, ocho, nueve y diez.", en: ["Six, seven, eight, nine and ten."]}
  - id: es.a1.u02
    title: Day to day
    cefr: A1
    skills:
      - id: es.a1.u02.s01
        kind: vocab
        title: Family
        cefr: A1
        can_do: I can talk about the people in my family.
        requires: [es.a1.u01.s04]
        grammar_note: >-
          Possessives agree in number with the thing owned, not with the owner: mi
          hermano, mis hermanos; tu hija, tus hijas; su padre means his, her, their or
          your (usted) father. A masculine plural can include women: mis hermanos can
          mean my brothers or my brothers and sisters.
        lemmas:
          - {lemma: familia, pos: noun, gender: f, en: [family], rank: 508}
          - {lemma: madre, pos: noun, gender: f, en: [mother], rank: 121}
          - {lemma: padre, pos: noun, gender: m, en: [father], rank: 120}
          - {lemma: hermano, pos: noun, gender: m, en: [brother], rank: 165}
          - {lemma: hermana, pos: noun, gender: f, en: [sister], rank: 208}
          - {lemma: hijo, pos: noun, gender: m, en: [son], rank: 242}
          - {lemma: hija, pos: noun, gender: f, en: [daughter], rank: 246}
          - {lemma: amigo, pos: noun, gender: m, en: [friend], rank: 185}
        examples:
          - {id: 1, target: "Tengo una hermana.", en: ["I have a sister.", "I have one sister."]}
          - {id: 2, target: "Mi madre se llama Carmen.", en: ["My mother's name is Carmen.", "My mother is called Carmen."]}
          - {id: 3, target: "¿Tienes hermanos?", en: ["Do you have brothers or sisters?", "Do you have any siblings?"]}
          - {id: 4, target: "Mi padre es de Sevilla.", en: ["My father is from Seville."]}
          - {id: 5, target: "Mi familia es de Madrid.", en: ["My family is from Madrid."]}
          - {id: 6, target: "Tengo dos hijos y una hija.", en: ["I have two sons and a daughter."]}
          - {id: 7, target: "Pablo es mi hermano.", en: ["Pablo is my brother."]}
          - {id: 8, target: "Luis es mi amigo.", en: ["Luis is my friend."]}
      - id: es.a1.u02.s02
        kind: function
        title: At the café
        cefr: A1
        can_do: I can order a drink and something to eat and ask for the bill.
        requires: [es.a1.u02.s01]
        grammar_note: >-
          To order, name the thing and add por favor: un café, por favor. Quiero (I want)
          is normal and polite in a café. Agua is feminine, but it takes el and un in the
          singular because it starts with a stressed a: el agua, un agua. Ask the price
          with ¿cuánto es? and answer with son plus the amount: son tres euros.
        lemmas:
          - {lemma: café, pos: noun, gender: m, en: [coffee, café], rank: 435}
          - {lemma: agua, pos: noun, gender: f, article: el, en: [water], rank: 307}
          - {lemma: té, pos: noun, gender: m, en: [tea], rank: 764}
          - {lemma: cerveza, pos: noun, gender: f, en: [beer], rank: 1072}
          - {lemma: bocadillo, pos: noun, gender: m, en: [sandwich, filled roll], rank: 11228}
          - {lemma: querer, pos: verb, en: [to want], rank: 53}
          - {lemma: por favor, pos: expr, en: [please], rank: null}
          - {lemma: de nada, pos: expr, en: [you are welcome, not at all], rank: null}
          - {lemma: cuenta, pos: noun, gender: f, en: [bill, check], rank: 476}
          - {lemma: euro, pos: noun, gender: m, en: [euro], rank: 3595}
        examples:
          - {id: 1, target: "Un café, por favor.", en: ["A coffee, please."]}
          - {id: 2, target: "Quiero una cerveza.", en: ["I want a beer.", "I would like a beer."]}
          - {id: 3, target: "¿Qué quiere usted?", en: ["What would you like?", "What do you want?"]}
          - {id: 4, target: "Un agua y un bocadillo, por favor.", en: ["A water and a sandwich, please."]}
          - {id: 5, target: "La cuenta, por favor.", en: ["The bill, please.", "The check, please."]}
          - {id: 6, target: "Gracias. De nada.", en: ["Thank you. You are welcome.", "Thanks. Not at all."]}
          - {id: 7, target: "¿Cuánto es el café?", en: ["How much is the coffee?"]}
          - {id: 8, target: "Son tres euros.", en: ["That is three euros.", "It is three euros."]}
          - {id: 9, target: "¿Quieres un té?", en: ["Do you want a tea?", "Would you like a tea?"]}
      - id: es.a1.u02.s03
        kind: vocab
        title: Days and time
        cefr: A1
        can_do: I can name the days of the week and say what time it is.
        requires: [es.a1.u02.s02]
        grammar_note: >-
          Days of the week are masculine and not capitalised; el lunes means on Monday.
          Ask the time with ¿qué hora es? and answer with es la una for one o'clock and
          son las dos, son las tres and so on for the other hours; add y media for half
          past.
        lemmas:
          - {lemma: lunes, pos: noun, gender: m, en: [Monday], rank: 690}
          - {lemma: martes, pos: noun, gender: m, en: [Tuesday], rank: 3174}
          - {lemma: miércoles, pos: noun, gender: m, en: [Wednesday], rank: 4366}
          - {lemma: jueves, pos: noun, gender: m, en: [Thursday], rank: 4166}
          - {lemma: viernes, pos: noun, gender: m, en: [Friday], rank: 1876}
          - {lemma: sábado, pos: noun, gender: m, en: [Saturday], rank: 1807}
          - {lemma: domingo, pos: noun, gender: m, en: [Sunday], rank: 833}
          - {lemma: hora, pos: noun, gender: f, en: [hour, time], rank: 211}
          - {lemma: hoy, pos: adv, en: [today], rank: 195}
          - {lemma: mañana, pos: noun, gender: f, en: [morning, tomorrow], rank: 170}
          - {lemma: semana, pos: noun, gender: f, en: [week], rank: 324}
          - {lemma: medio, pos: adj, en: [half], rank: 486}
        examples:
          - {id: 1, target: "¿Qué hora es?", en: ["What time is it?"]}
          - {id: 2, target: "Hoy es lunes.", en: ["Today is Monday."]}
          - {id: 3, target: "Mañana es martes.", en: ["Tomorrow is Tuesday."]}
          - {id: 4, target: "Son las tres y media.", en: ["It is half past three.", "It is three thirty."]}
          - {id: 5, target: "La semana tiene siete días.", en: ["The week has seven days.", "A week has seven days."]}
          - {id: 6, target: "Hoy es sábado y mañana es domingo.", en: ["Today is Saturday and tomorrow is Sunday."]}
          - {id: 7, target: "¿Qué día es hoy?", en: ["What day is it today?"]}
          - {id: 8, target: "El viernes a las diez de la mañana.", en: ["On Friday at ten in the morning.", "Friday at ten in the morning."]}
          - {id: 9, target: "El miércoles y el jueves.", en: ["On Wednesday and Thursday.", "Wednesday and Thursday."]}
      - id: es.a1.u02.s04
        kind: grammar
        title: Likes
        cefr: A1
        can_do: I can say what I like and what I do not like.
        requires: [es.a1.u02.s03]
        grammar_note: >-
          Gustar works backwards: me gusta el café is literally coffee pleases me. The
          verb agrees with the thing liked, so one thing takes gusta and several take
          gustan: me gusta el cine, me gustan los libros. The person is a pronoun before
          the verb: me, te, le (usted, él, ella), nos, os, les. For a name, add a: a Luis
          le gusta el fútbol.
        lemmas:
          - {lemma: gustar, pos: verb, en: [to like, to please], rank: 84}
          - {lemma: música, pos: noun, gender: f, en: [music], rank: 520}
          - {lemma: libro, pos: noun, gender: m, en: [book], rank: 134}
          - {lemma: cine, pos: noun, gender: m, en: [cinema, movies], rank: 1209}
          - {lemma: deporte, pos: noun, gender: m, en: [sport], rank: 1382}
          - {lemma: fútbol, pos: noun, gender: m, en: [football, soccer], rank: 990}
          - {lemma: mucho, pos: adv, en: [a lot, much], rank: 87}
        examples:
          - {id: 1, target: "Me gusta el café.", en: ["I like coffee."]}
          - {id: 2, target: "No me gusta el fútbol.", en: ["I do not like football.", "I don't like soccer."]}
          - {id: 3, target: "¿Te gusta la música?", en: ["Do you like music?"]}
          - {id: 4, target: "Me gustan los libros.", en: ["I like books."]}
          - {id: 5, target: "A Luis le gusta mucho el cine.", en: ["Luis likes the cinema a lot.", "Luis really likes the movies."]}
          - {id: 6, target: "Nos gusta el deporte.", en: ["We like sport.", "We like sports."]}
          - {id: 7, target: "¿Le gusta el té, señora?", en: ["Do you like tea, madam?"]}
  - id: es.a1.u03
    title: Food and drink
    cefr: A1
    skills:
      - id: es.a1.u03.s01
        kind: vocab
        title: Food
        cefr: A1
        can_do: I can name everyday food and say what I like to eat.
        requires: [es.a1.u02.s04]
        grammar_note: >-
          Spanish uses the article when it talks about a food in general: me gusta el
          pan (I like bread), no me gusta la carne (I do not like meat). With quiero or
          tengo and no particular amount, leave the article out: quiero pan, ¿tienes
          leche? Pescado is fish as food; a live fish is un pez. Comida means food or a
          meal, and in Spain also lunch, the main meal of the day.
        lemmas:
          - {lemma: comida, pos: noun, gender: f, en: [food, meal, lunch], rank: 410}
          - {lemma: pan, pos: noun, gender: m, en: [bread], rank: 950}
          - {lemma: leche, pos: noun, gender: f, en: [milk], rank: 668}
          - {lemma: carne, pos: noun, gender: f, en: [meat], rank: 887}
          - {lemma: pescado, pos: noun, gender: m, en: [fish], rank: 1369}
          - {lemma: pollo, pos: noun, gender: m, en: [chicken], rank: 2370}
          - {lemma: huevo, pos: noun, gender: m, en: [egg], rank: 811}
          - {lemma: queso, pos: noun, gender: m, en: [cheese], rank: 1581}
          - {lemma: arroz, pos: noun, gender: m, en: [rice], rank: 1647}
          - {lemma: fruta, pos: noun, gender: f, en: [fruit], rank: 1174}
          - {lemma: manzana, pos: noun, gender: f, en: [apple], rank: 720}
          - {lemma: sopa, pos: noun, gender: f, en: [soup], rank: 1407}
        examples:
          - {id: 1, target: "Me gusta el pescado.", en: ["I like fish."]}
          - {id: 2, target: "¿Carne o pescado?", en: ["Meat or fish?"]}
          - {id: 3, target: "No me gusta mucho el queso.", en: ["I don't like cheese very much.", "I do not like cheese much."]}
          - {id: 4, target: "¿Quieres una manzana?", en: ["Do you want an apple?", "Would you like an apple?"]}
          - {id: 5, target: "¿Cómo quiere los huevos?", en: ["How would you like your eggs?", "How do you want your eggs?"]}
          - {id: 6, target: "Me gustan el pan y la leche.", en: ["I like bread and milk."]}
          - {id: 7, target: "Me gusta la fruta.", en: ["I like fruit."]}
          - {id: 8, target: "Hoy tenemos mucha comida.", en: ["Today we have a lot of food.", "We have a lot of food today."]}
      - id: es.a1.u03.s02
        kind: grammar
        title: Eating and drinking
        cefr: A1
        can_do: I can say what I eat and drink and say that I am hungry or thirsty.
        requires: [es.a1.u03.s01]
        grammar_note: >-
          Regular -er verbs such as comer and beber end in -o, -es, -e, -emos, -éis,
          -en: como, comes, come, comemos, coméis, comen. Tomar is the everyday verb for
          having something to eat or drink: ¿tomas café? Hunger and thirst use tener
          with a noun: tengo hambre (I am hungry), tengo mucha sed (I am very thirsty).
          Hambre is feminine but takes el, like agua, so it is el hambre but mucha
          hambre. Nunca before the verb means never; after the verb it needs no in
          front: nunca bebo vino, no bebo vino nunca.
        lemmas:
          - {lemma: comer, pos: verb, en: [to eat], rank: 83}
          - {lemma: beber, pos: verb, en: [to drink], rank: 256}
          - {lemma: tomar, pos: verb, en: [to have, to take, to drink], rank: 114}
          - {lemma: vino, pos: noun, gender: m, en: [wine], rank: 438}
          - {lemma: zumo, pos: noun, gender: m, en: [juice], rank: 2908}
          - {lemma: hambre, pos: noun, gender: f, article: el, en: [hunger], rank: 900}
          - {lemma: sed, pos: noun, gender: f, en: [thirst], rank: 2553}
          - {lemma: nunca, pos: adv, en: [never], rank: 169}
        examples:
          - {id: 1, target: "No como carne.", en: ["I don't eat meat.", "I do not eat meat."]}
          - {id: 2, target: "Tengo mucha sed.", en: ["I'm very thirsty.", "I am very thirsty."]}
          - {id: 3, target: "¿Tiene usted hambre?", en: ["Are you hungry?"]}
          - {id: 4, target: "Nunca tomo café.", en: ["I never drink coffee.", "I never have coffee."]}
          - {id: 5, target: "Ellos beben leche.", en: ["They drink milk."]}
          - {id: 6, target: "¿Qué queréis beber?", en: ["What do you want to drink?", "What would you like to drink?"]}
          - {id: 7, target: "Él bebe zumo.", en: ["He drinks juice."]}
          - {id: 8, target: "No bebo vino.", en: ["I don't drink wine.", "I do not drink wine."]}
      - id: es.a1.u03.s03
        kind: vocab
        title: Meals
        cefr: A1
        can_do: I can talk about breakfast, lunch and dinner and when I have them.
        requires: [es.a1.u03.s02]
        grammar_note: >-
          Spain eats late. El desayuno is breakfast, la comida is the main meal at about
          two o'clock, and la cena is dinner, often at nine or ten in the evening. Each
          meal has its own verb: desayunar, comer and cenar, so desayuno a las siete
          means I have breakfast at seven. Desayuno is both the noun and the yo form of
          desayunar, and cena is both the noun and the él form of cenar. Ask when with
          ¿a qué hora...?
        lemmas:
          - {lemma: desayuno, pos: noun, gender: m, en: [breakfast], rank: 1390}
          - {lemma: cena, pos: noun, gender: f, en: [dinner, supper], rank: 1096}
          - {lemma: desayunar, pos: verb, en: [to have breakfast], rank: 836}
          - {lemma: cenar, pos: verb, en: [to have dinner], rank: 554}
          - {lemma: cocinar, pos: verb, en: [to cook], rank: 541}
          - {lemma: plato, pos: noun, gender: m, en: [plate, dish], rank: 1107}
          - {lemma: mesa, pos: noun, gender: f, en: [table], rank: 540}
        examples:
          - {id: 1, target: "Desayuno a las siete.", en: ["I have breakfast at seven."]}
          - {id: 2, target: "¿A qué hora cenas?", en: ["What time do you have dinner?", "What time do you eat dinner?"]}
          - {id: 3, target: "Me gusta cocinar.", en: ["I like cooking.", "I like to cook."]}
