      - id: es.a2.u03.s02
        kind: grammar
        title: What I have done
        cefr: A2
        can_do: I can talk about my experience and what has changed up to now.
        requires: [es.a2.u03.s01]
        grammar_note: >-
          The present perfect is haber plus a past participle: he trabajado, has
          trabajado, ha trabajado, hemos trabajado, habéis trabajado, han trabajado.
          Participles end in -ado for -ar verbs and -ido for -er and -ir verbs:
          cambiado, aprendido, vivido. In Spain it is used for a period that is not over
          (hoy, esta semana, hasta ahora) and for experience with no time given: he
          trabajado en un hotel. With a finished time such as ayer, use the preterite.
          The participle never changes, and nothing comes between haber and it: no he
          terminado. Dejar de means to stop doing something.
        lemmas:
          - {lemma: experiencia, pos: noun, gender: f, en: [experience], rank: 1354}
          - {lemma: ahora, pos: adv, en: [now], rank: 173}
          - {lemma: hasta, pos: prep, en: [until, up to, as far as], rank: 279}
          - {lemma: cambiar, pos: verb, en: [to change], rank: 340}
          - {lemma: dejar, pos: verb, en: [to leave, to let, to stop], rank: 123}
        examples:
          - {id: 1, target: "He cambiado mucho.", en: ["I've changed a lot.", "I have changed a lot."]}
          - {id: 2, target: "No has cambiado nada.", en: ["You haven't changed at all.", "You have not changed at all."]}
          - {id: 3, target: "Yo he dejado de fumar.", en: ["I've given up smoking.", "I have stopped smoking."]}
          - {id: 4, target: "¿Dónde has dejado el coche?", en: ["Where have you left the car?", "Where did you leave the car?"]}
          - {id: 5, target: "Tengo mucha experiencia.", en: ["I have a lot of experience."]}
          - {id: 6, target: "Hasta ahora he trabajado en dos hoteles.", en: ["Up to now I have worked in two hotels.", "So far I've worked in two hotels."]}
          - {id: 7, target: "¿Dónde trabaja ahora?", en: ["Where does he work now?", "Where do you work now?"]}
      - id: es.a2.u03.s03
        kind: function
        title: What I can do
        cefr: A2
        can_do: I can say what I know how to do and what I do well.
        requires: [es.a2.u03.s02]
        grammar_note: >-
          Saber means to know a fact and, with an infinitive, to know how to do
          something: sé cocinar, ¿sabes conducir? Its yo form is irregular: sé, sabes,
          sabe, sabemos, sabéis, saben. Conocer is to know a person or a place, and
          poder is to be able to in a given situation: hoy no puedo trabajar.
          Conducir, the usual verb for to drive in Spain, has the yo form conduzco.
          Rápido works as an adverb as well as an adjective: aprendo rápido (I learn
          quickly). Trabajar en equipo means to work in a team.
        lemmas:
