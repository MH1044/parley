          - {lemma: llevar, pos: verb, en: [to wear, to carry, to take], rank: 197}
        examples:
          - {id: 1, target: "Él lleva sombrero.", en: ["He is wearing a hat.", "He's wearing a hat."]}
          - {id: 2, target: "Ponte el abrigo.", en: ["Put on your coat.", "Put your coat on."]}
          - {id: 3, target: "Me gusta tu chaqueta.", en: ["I like your jacket."]}
          - {id: 4, target: "¿Dónde están mis zapatos?", en: ["Where are my shoes?"]}
          - {id: 5, target: "Voy a la tienda.", en: ["I'm going to the shop.", "I am going to the store."]}
          - {id: 6, target: "¿Qué vestido te gusta más?", en: ["Which dress do you like more?", "Which dress do you like best?"]}
          - {id: 7, target: "¿Qué llevas puesto?", en: ["What are you wearing?"]}
          - {id: 8, target: "Tiene muchas faldas.", en: ["She has a lot of skirts.", "She has many skirts."]}
      - id: es.a1.u05.s02
        kind: grammar
        title: Colours
        cefr: A1
        can_do: I can say what colour something is.
        requires: [es.a1.u05.s01]
        grammar_note: >-
          Colours are adjectives and usually come after the noun: una camisa blanca, los
          zapatos negros. Colours ending in -o change for gender and number: rojo, roja,
          rojos, rojas. Those ending in -e or a consonant change only for number: verde,
          verdes; azul, azules; gris, grises; marrón, marrones. Ask about colour with
          ¿de qué color es? With el in front, a colour works as a noun: me gusta el azul
          (I like blue, or I like the blue one).
        lemmas:
          - {lemma: color, pos: noun, gender: m, en: [colour, color], rank: 828}
          - {lemma: rojo, pos: adj, en: [red], rank: 636}
          - {lemma: azul, pos: adj, en: [blue], rank: 928}
          - {lemma: verde, pos: adj, en: [green], rank: 1077}
          - {lemma: blanco, pos: adj, en: [white], rank: 710}
          - {lemma: negro, pos: adj, en: [black], rank: 867}
          - {lemma: amarillo, pos: adj, en: [yellow], rank: 1615}
          - {lemma: gris, pos: adj, en: [grey, gray], rank: 2932}
          - {lemma: marrón, pos: adj, en: [brown], rank: 2742}
        examples:
          - {id: 1, target: "¿De qué color es?", en: ["What colour is it?", "What color is it?"]}
          - {id: 2, target: "Mis zapatos son marrones.", en: ["My shoes are brown."]}
          - {id: 3, target: "Tengo una camisa verde.", en: ["I have a green shirt."]}
          - {id: 4, target: "Quiero un pantalón blanco.", en: ["I want white trousers.", "I want white pants."]}
          - {id: 5, target: "Las manzanas son rojas.", en: ["Apples are red.", "The apples are red."]}
          - {id: 6, target: "Me gustan los zapatos negros.", en: ["I like the black shoes."]}
          - {id: 7, target: "¿Los tienen en otros colores?", en: ["Do you have them in other colours?", "Do you have these in other colors?"]}
          - {id: 8, target: "Le gustan los vestidos azules.", en: ["She likes blue dresses."]}
      - id: es.a1.u05.s03
        kind: grammar
        title: This one and that one
        cefr: A1
        can_do: I can point out the thing I want and ask for another size.
        requires: [es.a1.u05.s02]
        grammar_note: >-
          Este (this) points to things near you; ese (that) to things near the person
          you are talking to or a little further away. Both agree with the noun: este
          libro, esta camisa, estos zapatos, estas faldas; ese, esa, esos, esas. Without
          a noun they mean this one and that one: quiero ese. Esto and eso never change
          and stand for something you do not name: ¿qué es esto? Talla is a clothes
          size; for shoes, say número. Probarse means to try on: ¿puedo probarme esto?
