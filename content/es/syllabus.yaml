        examples:
          - {id: 1, target: "¿Esto es tuyo?", en: ["Is this yours?"]}
          - {id: 2, target: "No es mío.", en: ["It isn't mine.", "It's not mine."]}
          - {id: 3, target: "Esos son míos.", en: ["Those are mine."]}
          - {id: 4, target: "Esta es tuya.", en: ["This one's yours.", "This one is yours."]}
          - {id: 5, target: "¿Cuál es suyo?", en: ["Which one is yours?", "Which is theirs?"]}
          - {id: 6, target: "Coge el mío.", en: ["Take mine."]}
          - {id: 7, target: "Estas gafas no son mías.", en: ["These glasses aren't mine.", "These glasses are not mine."]}
          - {id: 8, target: "Mi móvil no funciona. ¿Me prestas el tuyo?", en: ["My mobile isn't working. Can I borrow yours?", "My phone doesn't work. Will you lend me yours?"]}
  - id: es.a2.u08
    title: Experiences
    cefr: A2
    skills:
      - id: es.a2.u08.s01
        kind: grammar
        title: Have you ever...?
        cefr: A2
        can_do: I can ask people about their experiences and talk about mine.
        requires: [es.a2.u07.s04]
        grammar_note: >-
          The present perfect asks about experiences in your life so far: ¿has estado
          alguna vez en el extranjero? (have you ever been abroad?). Alguna vez means
          ever; nunca and jamás mean never, and jamás is stronger. Some common
          participles are irregular: hacer hecho, ver visto, decir dicho, escribir
          escrito, poner puesto, volver vuelto, abrir abierto, romper roto. Volar (to
          fly) changes o to ue: vuelo, vuelas. Use al extranjero with verbs of
          movement and en el extranjero with verbs of being: vivo en el extranjero.
        lemmas:
          - {lemma: alguna vez, pos: expr, en: [ever, sometime], rank: null}
          - {lemma: jamás, pos: adv, en: [never, ever], rank: 914}
          - {lemma: extranjero, pos: noun, gender: m, en: [abroad, foreigner], rank: 649}
          - {lemma: mar, pos: noun, gender: m, en: [sea], rank: 961}
          - {lemma: volar, pos: verb, en: [to fly], rank: 701}
          - {lemma: vida, pos: noun, gender: f, en: [life], rank: 223}
        examples:
          - {id: 1, target: "¿Has volado alguna vez?", en: ["Have you ever flown?", "Have you flown before?"]}
          - {id: 2, target: "¿Has estado alguna vez en el extranjero?", en: ["Have you ever been abroad?"]}
          - {id: 3, target: "Nunca he visto el mar.", en: ["I've never seen the sea.", "I have never seen the sea."]}
          - {id: 4, target: "Nunca he estado tan feliz en mi vida.", en: ["I've never been so happy in my life.", "I have never been this happy in my life."]}
          - {id: 5, target: "Jamás he dicho eso.", en: ["I've never said that.", "I have never said that."]}
          - {id: 6, target: "He vuelto del extranjero.", en: ["I've come back from abroad.", "I have returned from abroad."]}
          - {id: 7, target: "¿Has escrito alguna vez un libro?", en: ["Have you ever written a book?"]}
          - {id: 8, target: "Vivo cerca del mar.", en: ["I live near the sea.", "I live close to the sea."]}
      - id: es.a2.u08.s02
        kind: grammar
        title: Already, still, not yet
        cefr: A2
        can_do: I can say what I have already done, what I have not done yet and what I have just done.
        requires: [es.a2.u08.s01]
        grammar_note: >-
          Ya means already: ¿ya has comido? (have you eaten yet?), ya he terminado.
          With no it means no longer: ya no trabajo (I don't work any more). Todavía
          and aún mean still: todavía estoy aquí. Todavía no and aún no mean not yet:
          todavía no estoy listo. In the present perfect, ya and todavía no usually go
          before haber: todavía no he comido. Acabar de plus an infinitive means to have just
          done something: acabo de llegar (I've just arrived). Listo with estar means
          ready.
        lemmas:
          - {lemma: ya, pos: adv, en: [already, yet, now], rank: 142}
          - {lemma: todavía, pos: adv, en: [still, yet], rank: 280}
          - {lemma: aún, pos: adv, en: [still, yet], rank: 480}
          - {lemma: acabar, pos: verb, en: [to finish, to have just], rank: 350}
          - {lemma: listo, pos: adj, en: [ready, clever], rank: 488}
        examples:
          - {id: 1, target: "¿Ya has comido?", en: ["Have you eaten yet?", "Have you already eaten?"]}
          - {id: 2, target: "Ya he terminado.", en: ["I've already finished.", "I'm already done."]}
          - {id: 3, target: "Todavía estoy aquí.", en: ["I'm still here.", "I am still here."]}
          - {id: 4, target: "No, aún no.", en: ["No, not yet."]}
          - {id: 5, target: "Acabo de llegar.", en: ["I've just arrived.", "I just got here."]}
          - {id: 6, target: "Ya no trabajo.", en: ["I don't work any more.", "I no longer work."]}
          - {id: 7, target: "Todavía tenemos tiempo.", en: ["We still have time.", "We've still got time."]}
          - {id: 8, target: "Todavía no estoy listo.", en: ["I'm not ready yet.", "I am not ready yet."]}
      - id: es.a2.u08.s03
        kind: grammar
        title: What was happening
        cefr: A2
        can_do: I can say what was happening when something else happened.
        requires: [es.a2.u08.s02]
        grammar_note: >-
          The preterite and the imperfect often appear together. The imperfect sets the
          scene or says what was going on (estaba comiendo, corría); the preterite says
          what happened, often cutting into it (sonó el teléfono, me hice daño).
          Mientras (while) usually takes the imperfect: leí un libro mientras comía.
          In estaba comiendo cuando sonó el teléfono, cuando brings in the event.
          A finished event takes the preterite even when it lasted a long time: viví en
          Madrid tres años. Haber in the preterite is hubo: hubo un accidente.
        lemmas:
          - {lemma: mientras, pos: conj, en: [while], rank: 593}
          - {lemma: ocurrir, pos: verb, en: [to happen, to occur], rank: 565}
          - {lemma: accidente, pos: noun, gender: m, en: [accident], rank: 507}
          - {lemma: sonar, pos: verb, en: [to ring, to sound], rank: 706}
          - {lemma: ruido, pos: noun, gender: m, en: [noise], rank: 939}
        examples:
          - {id: 1, target: "Estaba comiendo cuando sonó el teléfono.", en: ["I was eating when the phone rang.", "I was having lunch when the phone rang."]}
          - {id: 2, target: "Me hice daño mientras corría.", en: ["I got hurt while running.", "I hurt myself while I was running."]}
          - {id: 3, target: "Ella tuvo un accidente mientras trabajaba.", en: ["She had an accident while working.", "She had an accident while she was working."]}
          - {id: 4, target: "Leí un libro mientras comía.", en: ["I read a book while eating.", "I read a book while I was eating."]}
          - {id: 5, target: "Ocurrió cuando no estaba mirando.", en: ["It happened while I wasn't looking.", "It happened when I was not looking."]}
          - {id: 6, target: "Escuché un ruido.", en: ["I heard a noise."]}
          - {id: 7, target: "Hubo un accidente.", en: ["There was an accident."]}
          - {id: 8, target: "¿Qué pasó mientras yo no estaba?", en: ["What happened while I was away?", "What happened while I wasn't here?"]}
      - id: es.a2.u08.s04
        kind: function
        title: Reacting to news
        cefr: A2
        can_do: I can react to good and bad news and show surprise.
        requires: [es.a2.u08.s03]
        grammar_note: >-
          React to news with ¡qué! and a noun or an adjective: ¡qué suerte! (how
          lucky!), ¡qué pena! (what a shame!), ¡qué sorpresa!, ¡qué bien! ¡No me digas!
          means you don't say! or really? Una noticia is one piece of news, and las
          noticias are the news. Preocupar works like gustar: me preocupa (it worries
          me); no te preocupes (don't worry) is the negative tú command of
          preocuparse. Contento (pleased, happy) goes with estar: estoy muy contento.
        lemmas:
          - {lemma: noticia, pos: noun, gender: f, en: [news, piece of news], rank: 765}
          - {lemma: suerte, pos: noun, gender: f, en: [luck], rank: 924}
          - {lemma: pena, pos: noun, gender: f, en: [shame, pity, sorrow], rank: 1042}
          - {lemma: sorpresa, pos: noun, gender: f, en: [surprise], rank: 2048}
          - {lemma: increíble, pos: adj, en: [incredible, amazing], rank: 3002}
          - {lemma: preocupar, pos: verb, en: [to worry], rank: 513}
          - {lemma: contento, pos: adj, en: [pleased, happy, glad], rank: 1216}
          - {lemma: no me digas, pos: expr, en: [you don't say, really], rank: null}
        examples:
          - {id: 1, target: "Tengo buenas noticias.", en: ["I've got some good news.", "I have good news."]}
          - {id: 2, target: "¡Qué suerte tienes!", en: ["How lucky you are!", "You're so lucky!"]}
          - {id: 3, target: "¡Qué pena! Lo siento mucho.", en: ["What a shame! I'm very sorry.", "What a pity! I'm so sorry."]}
          - {id: 4, target: "¡Eso es increíble!", en: ["That's incredible!", "That's amazing!"]}
          - {id: 5, target: "¡Qué sorpresa verte aquí!", en: ["What a surprise to see you here!"]}
          - {id: 6, target: "No te preocupes.", en: ["Don't worry.", "Don't worry about it."]}
          - {id: 7, target: "Estoy muy contento.", en: ["I'm very pleased.", "I am very happy."]}
          - {id: 8, target: "¡No me digas!", en: ["You don't say!", "Really?"]}
