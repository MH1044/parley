      - id: es.a1.u06.s01
        kind: vocab
        title: At home
        cefr: A1
        can_do: I can name the rooms and things in my home.
        requires: [es.a1.u05.s04]
        grammar_note: >-
          In Spain un piso is a flat or apartment, and piso also means a floor of a
          building. Habitación is any room and is often used for a bedroom. El baño is
          the bathroom, so ¿dónde está el baño? is the polite way to ask for the toilet.
          En casa, with no article, means at home: estoy en casa. La cocina is the
          kitchen, and cocina is also the él form of cocinar.
