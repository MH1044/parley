          - {id: 7, target: "Veo la televisión.", en: ["I watch television.", "I'm watching TV."]}
          - {id: 8, target: "Conozco esta canción.", en: ["I know this song."]}
      - id: es.a2.u06.s02
        kind: grammar
        title: How often
        cefr: A2
        can_do: I can say how often I do things, from always to hardly ever.
        requires: [es.a2.u06.s01]
        grammar_note: >-
          From most to least often: siempre, casi siempre, normalmente, a menudo
          (often), a veces, de vez en cuando (from time to time), rara vez (rarely),
          casi nunca, nunca. Most go at the start or straight after the verb: viajo a
          menudo, a menudo vengo aquí. Casi means almost: casi cada día. Soler with an
          infinitive means to usually do something: suelo comer en casa; it changes o
          to ue: suelo, sueles, suele. With a number, use vez: una vez a la semana, dos
          veces al mes.
        lemmas:
          - {lemma: a menudo, pos: expr, en: [often], rank: null}
          - {lemma: de vez en cuando, pos: expr, en: [from time to time, now and then], rank: null}
          - {lemma: rara vez, pos: expr, en: [rarely, seldom], rank: null}
          - {lemma: casi, pos: adv, en: [almost, nearly], rank: 419}
          - {lemma: soler, pos: verb, en: [to usually do, to tend to], rank: 380}
        examples:
          - {id: 1, target: "¿Nadas a menudo?", en: ["Do you swim often?", "Do you often swim?"]}
          - {id: 2, target: "Viajo a menudo.", en: ["I travel often.", "I often travel."]}
          - {id: 3, target: "Rara vez tomo café.", en: ["I rarely drink coffee.", "I seldom have coffee."]}
          - {id: 4, target: "Nado casi cada día.", en: ["I swim almost every day."]}
