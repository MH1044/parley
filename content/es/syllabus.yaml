          - {id: 7, target: "Se cena muy tarde en España.", en: ["People have dinner very late in Spain.", "People dine very late in Spain."]}
          - {id: 8, target: "Desayunamos pan y huevos.", en: ["We have bread and eggs for breakfast."]}
      - id: es.a1.u03.s04
        kind: function
        title: Ordering
        cefr: A1
        can_do: I can order food and drink politely and ask for more.
        requires: [es.a1.u03.s03]
        grammar_note: >-
          In a Spanish bar the waiter often asks ¿qué le pongo? (what can I get you?),
          and customers answer ¿me pone un café? or simply un café, por favor. ¿Me
          trae...? asks someone to bring you something, and tráigame is the polite usted
          command. Me gustaría (I would like) is softer than quiero. Otro already means
          another, so it never takes un: otra cerveza, not una otra cerveza. Más means
          more and un poco means a little.
