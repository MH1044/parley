          - {id: 2, target: "Siga usted todo recto.", en: ["Go straight on.", "Carry straight on.", "Continue straight ahead."]}
          - {id: 3, target: "Gire a la derecha.", en: ["Turn right.", "Turn to the right."]}
          - {id: 4, target: "Gira a la izquierda.", en: ["Turn left.", "Turn to the left."]}
