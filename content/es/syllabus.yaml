          - {lemma: descansar, pos: verb, en: [to rest], rank: 1214}
          - {lemma: cuidar, pos: verb, en: [to look after, to take care of], rank: 441}
          - {lemma: fumar, pos: verb, en: [to smoke], rank: 582}
          - {lemma: demasiado, pos: adv, en: [too much, too], rank: 234}
          - {lemma: medicina, pos: noun, gender: f, en: [medicine], rank: 1591}
          - {lemma: farmacia, pos: noun, gender: f, en: [chemist's, pharmacy], rank: 4630}
        examples:
          - {id: 1, target: "Descansa un poco.", en: ["Get some rest.", "Rest a little."]}
          - {id: 2, target: "Cuídese, por favor.", en: ["Please take care of yourself.", "Take care of yourself, please."]}
          - {id: 3, target: "Toma la medicina.", en: ["Take the medicine.", "Take your medicine."]}
          - {id: 4, target: "No fume demasiado.", en: ["Don't smoke too much.", "Do not smoke too much."]}
          - {id: 5, target: "No bebas demasiado café.", en: ["Don't drink too much coffee.", "Do not drink too much coffee."]}
          - {id: 6, target: "Deberías fumar menos.", en: ["You should smoke less."]}
          - {id: 7, target: "¿Hay una farmacia cerca?", en: ["Is there a chemist's nearby?", "Is there a pharmacy nearby?"]}
          - {id: 8, target: "Tengo que descansar.", en: ["I have to rest.", "I must rest."]}
  - id: es.a2.u03
    title: Work
    cefr: A2
    skills:
      - id: es.a2.u03.s01
        kind: vocab
        title: At work
        cefr: A2
        can_do: I can name common jobs and talk about the people I work with.
        requires: [es.a2.u02.s04]
        grammar_note: >-
          Most job names have a feminine form: cocinero, cocinera; enfermero,
          enfermera; abogado, abogada; jefe, jefa. As with profesor and médico, a job
          after ser takes no article: soy enfermera, mi tío es abogado. Trabajar como
          means to work as: trabajo como cocinero. Compañero is a colleague or a
          classmate: mis compañeros de trabajo. Una empresa is a company or firm, and in
          Spain a computer is un ordenador. Trabajador describes someone who works hard:
          es muy trabajadora.
        lemmas:
