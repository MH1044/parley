          - {id: 2, target: "Es el edificio más alto de la ciudad.", en: ["It's the tallest building in the city.", "It is the tallest building in town."]}
          - {id: 3, target: "Es el lugar más bonito del mundo.", en: ["It's the most beautiful place in the world."]}
          - {id: 4, target: "Es la persona más amable que conozco.", en: ["She's the kindest person I know.", "He's the kindest person I know."]}
          - {id: 5, target: "Es el museo más famoso de Madrid.", en: ["It's the most famous museum in Madrid."]}
          - {id: 6, target: "Me gusta este lugar.", en: ["I like this place.", "I like it here."]}
          - {id: 7, target: "¿Qué es aquel edificio?", en: ["What's that building?", "What is that building over there?"]}
          - {id: 8, target: "Este edificio es altísimo.", en: ["This building is extremely tall.", "This building is very tall."]}
      - id: es.a2.u07.s04
        kind: grammar
        title: Mine and yours
        cefr: A2
        can_do: I can say who things belong to without repeating the noun.
        requires: [es.a2.u07.s03]
        grammar_note: >-
          Possessive pronouns stand in for a noun: el mío (mine), el tuyo (yours), el
          suyo (his, hers, theirs, or yours with usted), el nuestro, el vuestro. They
          agree with the thing owned, not the owner: mi móvil, el mío; mis gafas, las
          mías. After ser the article is usually left out: es mío, ¿esto es tuyo?
          Because suyo can mean several things, Spanish often says de él, de ella or de
          usted to be clear. In Spain a mobile phone is un móvil, and glasses are las
          gafas, always plural.
        lemmas:
          - {lemma: mío, pos: pron, en: [mine], rank: 429}
          - {lemma: tuyo, pos: pron, en: [yours], rank: 884}
          - {lemma: suyo, pos: pron, en: [his, hers, theirs, yours], rank: 1386}
