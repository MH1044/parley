          - {lemma: restaurante, pos: noun, gender: m, en: [restaurant], rank: 1056}
          - {lemma: centro, pos: noun, gender: m, en: [centre, center, town centre], rank: 1542}
          - {lemma: hotel, pos: noun, gender: m, en: [hotel], rank: 758}
