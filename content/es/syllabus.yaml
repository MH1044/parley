          - {lemma: fácil, pos: adj, en: [easy], rank: 452}
          - {lemma: difícil, pos: adj, en: [difficult, hard], rank: 345}
          - {lemma: rápido, pos: adj, en: [fast, quick, quickly], rank: 448}
          - {lemma: importante, pos: adj, en: [important], rank: 505}
          - {lemma: equipo, pos: noun, gender: m, en: [team, equipment], rank: 932}
        examples:
          - {id: 1, target: "Sabe hablar inglés.", en: ["He can speak English.", "She knows how to speak English."]}
          - {id: 2, target: "No sé cocinar.", en: ["I can't cook.", "I don't know how to cook."]}
          - {id: 3, target: "¿Sabes conducir?", en: ["Can you drive?", "Do you know how to drive?"]}
          - {id: 4, target: "Aprendo rápido.", en: ["I learn quickly.", "I'm a quick learner."]}
          - {id: 5, target: "No fue fácil.", en: ["It wasn't easy.", "It was not easy."]}
          - {id: 6, target: "Esto es difícil.", en: ["This is difficult.", "This is hard."]}
          - {id: 7, target: "Es muy importante.", en: ["It's very important.", "It is very important."]}
          - {id: 8, target: "Trabajo bien en equipo.", en: ["I work well in a team.", "I'm good at working in a team."]}
      - id: es.a2.u03.s04
        kind: function
        title: Asking about the job
        cefr: A2
        can_do: I can ask about the hours and pay and say when I can start.
        requires: [es.a2.u03.s03]
        grammar_note: >-
          Interesar works like gustar: me interesa el puesto (the job interests me),
          me interesan los idiomas. Una pregunta is a question and preguntar is to ask
          a question; ganar means both to earn and to win. El puesto is the post you
          apply for, el sueldo is your pay, and el horario is the working hours or a
          timetable. Ask about them with ¿cuál es...? A job interview is usually formal,
          so use usted: ¿cuándo puede empezar? Disponible means available: estoy
          disponible desde el lunes.
