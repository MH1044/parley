          - {id: 8, target: "Gracias por preguntar.", en: ["Thanks for asking.", "Thank you for asking."]}
  - id: es.a2.u04
    title: Plans
    cefr: A2
    skills:
      - id: es.a2.u04.s01
        kind: grammar
        title: Making plans
        cefr: A2
        can_do: I can say what I plan to do and arrange to meet someone.
        requires: [es.a2.u03.s04]
        grammar_note: >-
          Ir a plus an infinitive is the usual way to talk about plans: voy a estar
          ocupado. Pensar plus an infinitive means to intend to: pienso ir (I'm planning
          to go); pensar changes e to ie: pienso, piensas, piensa. Quedar has several
          uses: quedar, often with con, is to arrange to meet (¿quedamos para mañana?,
          he quedado con Ana), and quedarse is to stay (hoy me quedo en casa). Estar
          libre and estar ocupado say whether you have time. Juntos agrees with the
          people: vamos juntas.
        lemmas:
          - {lemma: plan, pos: noun, gender: m, en: [plan], rank: 553}
          - {lemma: pensar, pos: verb, en: [to think, to intend], rank: 133}
          - {lemma: quedar, pos: verb, en: [to arrange to meet, to stay, to be left], rank: 154}
          - {lemma: libre, pos: adj, en: [free], rank: 839}
          - {lemma: ocupado, pos: adj, en: [busy], rank: 500}
          - {lemma: juntos, pos: adj, en: [together], rank: 834}
          - {lemma: idea, pos: noun, gender: f, en: [idea], rank: 393}
        examples:
          - {id: 1, target: "¿Tienes planes para el fin de semana?", en: ["Do you have any plans for the weekend?", "Have you got plans for the weekend?"]}
          - {id: 2, target: "Pienso ir allí.", en: ["I'm planning to go there.", "I intend to go there."]}
          - {id: 3, target: "¿Quedamos para mañana?", en: ["Shall we meet tomorrow?", "Are we meeting tomorrow?"]}
          - {id: 4, target: "Hoy me quedo en casa.", en: ["I'm staying at home today.", "Today I'm staying in."]}
          - {id: 5, target: "¿Estás libre ahora?", en: ["Are you free now?"]}
          - {id: 6, target: "Voy a estar demasiado ocupado.", en: ["I'm going to be too busy."]}
          - {id: 7, target: "Podemos ir juntos.", en: ["We can go together."]}
          - {id: 8, target: "¡Qué buena idea!", en: ["What a good idea!", "What a nice idea!"]}
      - id: es.a2.u04.s02
        kind: grammar
        title: The future
        cefr: A2
        can_do: I can make promises and predictions about the future.
        requires: [es.a2.u04.s01]
        grammar_note: >-
          The simple future adds -é, -ás, -á, -emos, -éis, -án to the whole infinitive:
          llamaré, comerás, vivirá. Some common verbs change the stem but keep the
          endings: tener tendré, venir vendré, poder podré, salir saldré, hacer haré,
          decir diré, saber sabré, querer querré, poner pondré. For plans, ir a plus an
          infinitive is more usual in speech; the simple future is used for promises
          and predictions: te veré pronto, algún día lo entenderás. Dentro de with a
          length of time means in: vuelvo dentro de una semana.
        lemmas:
          - {lemma: pronto, pos: adv, en: [soon, early], rank: 407}
          - {lemma: futuro, pos: noun, gender: m, en: [future], rank: 1134}
          - {lemma: seguro, pos: adj, en: [sure, safe], rank: 322}
          - {lemma: algún día, pos: expr, en: [some day, one day], rank: null}
          - {lemma: dentro de, pos: expr, en: [in, inside], rank: null}
        examples:
          - {id: 1, target: "Te veré pronto.", en: ["I'll see you soon.", "See you soon!"]}
          - {id: 2, target: "Ella vendrá pronto.", en: ["She will come soon.", "She'll be here soon."]}
          - {id: 3, target: "¿Cómo será nuestro futuro?", en: ["What will our future be like?"]}
          - {id: 4, target: "Algún día entenderás todo.", en: ["Some day you will understand everything.", "One day you'll understand everything."]}
          - {id: 5, target: "Empezaremos dentro de poco.", en: ["We'll begin shortly.", "We will start soon."]}
          - {id: 6, target: "Volveré dentro de una semana.", en: ["I'll be back in a week.", "I will come back in a week."]}
          - {id: 7, target: "¿Seguro que nos ayudará?", en: ["Are you sure he'll help us?", "Is it certain that she will help us?"]}
      - id: es.a2.u04.s03
        kind: function
        title: Invitations
        cefr: A2
        can_do: I can invite someone and accept or refuse an invitation politely.
        requires: [es.a2.u04.s02]
        grammar_note: >-
          To invite, ask ¿quieres...? or, very often in Spain, ¿te apetece...? (do you
          fancy...?), which works like gustar: ¿te apetece ir al cine? Encantar also
          works like gustar and means to love: me encanta la idea. Me encantaría (I
          would love to) accepts an invitation; lo siento, no puedo refuses one
          politely. Con with mí and ti becomes conmigo and contigo. Vale is the
          everyday Spanish word for OK, and de acuerdo means agreed: estoy de acuerdo
          (I agree).
        lemmas:
          - {lemma: invitar, pos: verb, en: [to invite], rank: 735}
          - {lemma: apetecer, pos: verb, en: [to fancy, to feel like], rank: 2868}
          - {lemma: encantar, pos: verb, en: [to love, to delight], rank: 422}
          - {lemma: claro, pos: adv, en: [of course, clearly], rank: 963}
          - {lemma: lo siento, pos: expr, en: [I'm sorry, sorry], rank: null}
          - {lemma: vale, pos: intj, en: [OK, all right], rank: 1018}
          - {lemma: de acuerdo, pos: expr, en: [agreed, all right, in agreement], rank: null}
          - {lemma: conmigo, pos: pron, en: [with me], rank: 437}
          - {lemma: contigo, pos: pron, en: [with you], rank: 439}
        examples:
          - {id: 1, target: "¿Quieres venir conmigo?", en: ["Do you want to come with me?", "Would you like to come with me?"]}
          - {id: 2, target: "Gracias por invitarme.", en: ["Thanks for inviting me.", "Thank you for inviting me."]}
          - {id: 3, target: "¡Claro que sí!", en: ["Of course!", "Yes, of course!"]}
          - {id: 4, target: "Lo siento, no puedo.", en: ["I'm sorry, I can't.", "Sorry, I can't."]}
          - {id: 5, target: "¿Te apetece ir al cine?", en: ["Do you fancy going to the cinema?", "Would you like to go to the movies?"]}
          - {id: 6, target: "Me encantaría ir contigo.", en: ["I would love to go with you.", "I'd love to go with you."]}
          - {id: 7, target: "Vale, nos vemos mañana.", en: ["OK, see you tomorrow."]}
          - {id: 8, target: "Estoy de acuerdo.", en: ["I agree."]}
      - id: es.a2.u04.s04
        kind: grammar
        title: Por and para
        cefr: A2
        can_do: I can say what something is for, who it is for and why something happened.
        requires: [es.a2.u04.s03]
        grammar_note: >-
          Por and para can both mean for, but they are not the same. Para looks ahead to
          a goal: a purpose (estudio para el examen, para comprar un regalo, ¿para qué
          sirve?), the person who receives something (es para ti) or a deadline (para
          el lunes). Por gives a cause or a route: a reason (gracias por tu ayuda, por
          esa razón), a means (por correo, por teléfono), movement through or along a
          place (paseamos por el parque) and a part of the day (por la tarde). Servir
          para means to be useful for.
        lemmas:
          - {lemma: ayuda, pos: noun, gender: f, en: [help], rank: 449}
          - {lemma: razón, pos: noun, gender: f, en: [reason], rank: 568}
          - {lemma: examen, pos: noun, gender: m, en: [exam, test], rank: 674}
          - {lemma: regalo, pos: noun, gender: m, en: [present, gift], rank: 804}
          - {lemma: correo, pos: noun, gender: m, en: [post, mail], rank: 1132}
          - {lemma: enviar, pos: verb, en: [to send], rank: 845}
          - {lemma: servir, pos: verb, en: [to serve, to be useful], rank: 1057}
          - {lemma: pasear, pos: verb, en: [to go for a walk, to stroll], rank: 1320}
        examples:
          - {id: 1, target: "Gracias por tu ayuda.", en: ["Thanks for your help.", "Thank you for your help."]}
          - {id: 2, target: "Envíalo por correo.", en: ["Send it by post.", "Send it by mail."]}
          - {id: 3, target: "Este regalo es para ti.", en: ["This present is for you.", "This gift is for you."]}
          - {id: 4, target: "Tengo que estudiar para el examen.", en: ["I have to study for the exam.", "I have to study for the test."]}
          - {id: 5, target: "¿Para qué sirve esto?", en: ["What is this for?", "What is this used for?"]}
          - {id: 6, target: "Por la tarde paseamos por el parque.", en: ["In the afternoon we walk in the park.", "In the evening we go for a walk through the park."]}
          - {id: 7, target: "Por esa razón no fui.", en: ["For that reason I didn't go.", "That's why I didn't go."]}
          - {id: 8, target: "Fuimos al centro para comprar un regalo.", en: ["We went into town to buy a present.", "We went downtown to buy a gift."]}
  - id: es.a2.u05
    title: Weather and seasons
    cefr: A2
    skills:
      - id: es.a2.u05.s01
        kind: vocab
        title: What's the weather like?
        cefr: A2
        can_do: I can ask about the weather and say whether it is hot, cold, sunny or windy.
        requires: [es.a2.u04.s04]
        grammar_note: >-
          Weather uses hacer in the él form: hace calor, hace frío, hace sol, hace
          viento, hace fresco. Bueno and malo shorten to buen and mal before a
          masculine singular noun: hace buen tiempo, hace mal tiempo. Add mucho for a
          lot: hace mucho calor. For how a person feels, use tener instead: tengo frío
          (I'm cold), ¿no tienes calor? Tiempo means both weather and time: ¿qué tiempo
          hace? asks about the weather, but no tengo tiempo means I have no time. In the
          past: ayer hizo calor (it was hot yesterday).
        lemmas:
          - {lemma: tiempo, pos: noun, gender: m, en: [weather, time], rank: 128}
          - {lemma: calor, pos: noun, gender: m, article: el, en: [heat, warmth], rank: 848}
          - {lemma: frío, pos: noun, gender: m, en: [cold], rank: 489}
          - {lemma: sol, pos: noun, gender: m, en: [sun], rank: 623}
          - {lemma: viento, pos: noun, gender: m, en: [wind], rank: 1352}
          - {lemma: fresco, pos: adj, en: [cool, fresh], rank: 1761}
          - {lemma: buen, pos: adj, en: [good], rank: 221}
          - {lemma: nube, pos: noun, gender: f, en: [cloud], rank: 1736}
          - {lemma: cielo, pos: noun, gender: m, en: [sky], rank: 898}
        examples:
          - {id: 1, target: "¿Qué tiempo hace hoy?", en: ["What's the weather like today?", "What is the weather like today?"]}
          - {id: 2, target: "Hace mucho frío.", en: ["It's very cold.", "It is really cold."]}
          - {id: 3, target: "Hoy hace calor.", en: ["It's hot today.", "It's warm today."]}
          - {id: 4, target: "Hoy hace sol.", en: ["It's sunny today."]}
          - {id: 5, target: "Hace mucho viento.", en: ["It's very windy."]}
          - {id: 6, target: "Hace buen tiempo.", en: ["The weather is good.", "It's nice weather."]}
          - {id: 7, target: "¿No tienes frío?", en: ["Aren't you cold?"]}
          - {id: 8, target: "Mira esas nubes.", en: ["Look at those clouds."]}
      - id: es.a2.u05.s02
        kind: vocab
        title: Rain, snow and the seasons
        cefr: A2
        can_do: I can talk about rain and snow and name the seasons.
        requires: [es.a2.u05.s01]
        grammar_note: >-
          Llover (to rain) and nevar (to snow) are used only in the él form: llueve,
          with o to ue, and nieva, with e to ie; in the past, llovió and nevó. To say it
          is raining or snowing right now, use estar with the -ando form: está
          lloviendo, está nevando. The nouns are la lluvia and la nieve. The seasons
          take the article: la primavera, el verano, el otoño, el invierno; en invierno
          means in winter. Many people in Spain take their summer holidays in August.
        lemmas:
          - {lemma: llover, pos: verb, en: [to rain], rank: 421}
          - {lemma: nevar, pos: verb, en: [to snow], rank: 607}
          - {lemma: lluvia, pos: noun, gender: f, en: [rain], rank: 879}
          - {lemma: nieve, pos: noun, gender: f, en: [snow], rank: 895}
          - {lemma: primavera, pos: noun, gender: f, en: [spring], rank: 1561}
          - {lemma: verano, pos: noun, gender: m, en: [summer], rank: 729}
          - {lemma: otoño, pos: noun, gender: m, en: [autumn, fall], rank: 2211}
          - {lemma: invierno, pos: noun, gender: m, en: [winter], rank: 1104}
        examples:
          - {id: 1, target: "Llueve mucho aquí.", en: ["It rains a lot here."]}
          - {id: 2, target: "¿Nieva mucho aquí?", en: ["Does it snow a lot here?"]}
          - {id: 3, target: "¿Está lloviendo ahora?", en: ["Is it raining now?"]}
          - {id: 4, target: "Llegó la primavera.", en: ["Spring has come.", "Spring is here."]}
          - {id: 5, target: "Nací en invierno.", en: ["I was born in winter.", "I was born in the winter."]}
          - {id: 6, target: "El verano terminó.", en: ["Summer is over.", "The summer is over."]}
          - {id: 7, target: "Ahora es otoño.", en: ["It's autumn now.", "It's fall now."]}
          - {id: 8, target: "Necesitamos la lluvia.", en: ["We need the rain.", "We need rain."]}
      - id: es.a2.u05.s03
        kind: grammar
        title: How it was
        cefr: A2
        can_do: I can describe the weather, a place or how people felt at a time in the past.
        requires: [es.a2.u05.s02]
        grammar_note: >-
          The imperfect describes how things were: the weather, the scene, feelings and
          states. Regular -ar verbs take -aba: estaba, estabas, estaba, estábamos,
          estabais, estaban; -er and -ir verbs take -ía: hacía, tenía, vivía, parecía.
          Only three verbs are irregular: ser (era), ir (iba) and ver (veía). Use it for
          the background and the preterite for what happened against it: estaba
          lloviendo cuando llegué. Hay becomes había (there was, there were). Parecer
          (to seem) has the yo form parezco, and feliz has the plural felices.
        lemmas:
          - {lemma: cuando, pos: conj, en: [when], rank: 130}
          - {lemma: parecer, pos: verb, en: [to seem, to look], rank: 182}
          - {lemma: feliz, pos: adj, en: [happy], rank: 362}
          - {lemma: triste, pos: adj, en: [sad], rank: 1085}
          - {lemma: solo, pos: adj, en: [alone, lonely], rank: 112}
          - {lemma: oscuro, pos: adj, en: [dark], rank: 1468}
          - {lemma: tranquilo, pos: adj, en: [quiet, calm], rank: 1934}
        examples:
          - {id: 1, target: "Estaba lloviendo cuando llegué.", en: ["It was raining when I arrived.", "When I arrived, it was raining."]}
          - {id: 2, target: "Ella parecía triste.", en: ["She looked sad.", "She seemed sad."]}
          - {id: 3, target: "Todos parecían felices.", en: ["Everyone looked happy.", "Everybody seemed happy."]}
          - {id: 4, target: "Él estaba muy feliz.", en: ["He was very happy."]}
          - {id: 5, target: "No estaba solo.", en: ["I wasn't alone.", "He wasn't alone."]}
          - {id: 6, target: "Estaba muy oscuro.", en: ["It was very dark."]}
          - {id: 7, target: "Todo estaba tranquilo.", en: ["Everything was quiet.", "All was still."]}
          - {id: 8, target: "Era un día tranquilo y hacía sol.", en: ["It was a quiet day and it was sunny.", "It was a calm, sunny day."]}
      - id: es.a2.u05.s04
        kind: function
        title: If it rains
        cefr: A2
        can_do: I can say what we will do if the weather is good or bad.
        requires: [es.a2.u05.s03]
        grammar_note: >-
          Si (if, with no accent) followed by the present talks about a real
          possibility. The other half can be in the present, the future or a command:
          si llueve, nos quedamos en casa; si hace buen tiempo, iremos a la playa; si
          llueve, llámame. Do not confuse si with sí (yes). In Spain coger is the
          everyday verb for to take or to catch: coge un paraguas, coger el autobús.
          Paraguas is the same in the singular and the plural: un paraguas, dos
          paraguas. Fuera and dentro mean outside and inside.
        lemmas:
