[package]
name = "parley-publik"
description = "Parley's AI client: the publik API reference module, the own-key and local providers, status and errors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
keyring = { workspace = true }
parley-core = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sha2 = { workspace = true }
tempfile = { workspace = true }
# A runtime to call the transport from, as the desktop app's async commands do.
tokio = { version = "1", default-features = false, features = ["rt"] }
