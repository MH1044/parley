[workspace]
resolver = "2"
members = [
  "crates/parley-core",
  "crates/parley-publik",
  "crates/parley-audio",
  "crates/parley-cli",
  "app/src-tauri",
]

# One version for every crate and the app; RELEASING.md lists the other two places it appears.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MH1044/parley"
rust-version = "1.90"

[workspace.dependencies]
parley-core = { path = "crates/parley-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for the syllabus and numbers files; reads `no`, `on` and `yes` as the strings they are
# (YAML 1.2), which the function-word lists need.
serde_yaml_ng = "0.10"
# JSON Schema checks of content; no network resolver, so the core stays free of HTTP code.
jsonschema = { version = "0.60", default-features = false }
# Sentence packs (and, from module 02, the learner's store): one file, transactional, offline.
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.11"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
toml = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
# test-only
ignore = "0.4"
libtest-mimic = "0.8"
regex = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
