[workspace]
resolver = "2"
members = [
  "crates/parley-core",
  "crates/parley-publik",
  "crates/parley-audio",
  "crates/parley-cli",
  "app/src-tauri",
]

# One version for every crate and the app; RELEASING.md lists the other two places it appears.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MH1044/parley"
rust-version = "1.90"

[workspace.dependencies]
parley-core = { path = "crates/parley-core" }
parley-publik = { path = "crates/parley-publik" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for the syllabus and numbers files; reads `no`, `on` and `yes` as the strings they are
# (YAML 1.2), which the function-word lists need.
serde_yaml_ng = "0.10"
# JSON Schema checks of content; no network resolver, so the core stays free of HTTP code.
jsonschema = { version = "0.60", default-features = false }
# Sentence packs and the learner's store: one file, transactional, offline.
rusqlite = { version = "0.41", features = ["bundled"] }
# FSRS-6 scheduling with its default parameters; pinned because the recorded reference values
# (py-fsrs) were checked against this version. No training backend at this version.
fsrs = "=6.6.2"
sha2 = "0.11"
# Optimal string alignment distance over chars, for typo tolerance in grading.
strsim = "0.11"
# Language identification of AI answers (trigram profiles), restricted to English, Spanish,
# French and German; pure Rust, no data files.
whatlang = "0.18"
# Snowball stemmers for Spanish, French and German: the coverage check's fallback for word forms
# the forms table does not list.
rust-stemmers = "1.2"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
# The native file picker for backups, called from Rust only, so the web view needs no dialog
# permission.
tauri-plugin-dialog = "2"
# Opens the claim, top-up and add-credit links in the browser, called from Rust only, so the web view
# needs no opener permission.
tauri-plugin-opener = "2"
# The HTTP transport of every AI call and pack download: blocking calls on a plain thread, rustls
# for TLS with the operating system's certificate store, no crypto provider of its own (ring is
# chosen below).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
# TLS. The ring provider builds with the C compiler alone (no CMake or NASM) on every platform the
# app ships for; its licence is Apache-2.0 AND ISC.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The learner's own key in the OS keychain (Windows Credential Manager, macOS Keychain, the Secret
# Service on Linux over zbus, so no system D-Bus library is needed).
keyring = "4"
# The install id of the publik API reference module.
uuid = { version = "1", features = ["v4"] }
# AttachConsole for the built-app self-test on Windows.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
# The local UTC offset of the desktop clock; the clock feature only.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
# test-only
ignore = "0.4"
libtest-mimic = "0.8"
regex = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
